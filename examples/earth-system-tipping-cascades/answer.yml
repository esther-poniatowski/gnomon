# tests prediction against a partially known empirical target; the route runs on a stylized model, bound to the phenomenon

_schema: gnomon:answer@3
title: "Overshoot forecast from a network of four elements"
id: ans.earth-tipping-subsystems.four-element-overshoot-network
type: answer
answers: quest.earth-tipping-subsystems.overshoot-sequence-forecast

claim:
  reading: "In the network of four tipping elements, an overshoot raises the probability that at least one element tips by the horizon, relative to a matched trajectory without overshoot; the network assigns each element a probability of tipping and a distribution of its time under each trajectory."
  expression: "p_any(\"overshoot\") > p_any(\"matched non-overshoot\")"

grounds:
  - id: normal-forms
    role: idealization
    content: "Each subsystem is replaced by the normal form of a fold."
    record: mod.earth-tipping-subsystems.four-element-network.normal_form
    distortion: "The actual subsystems follow high-dimensional physical dynamics, which the normal form does not resolve."
    motive: tractability
    gain: "An ensemble forecast over the uncertainty of the thresholds, the timescales and the couplings."
    removable: unknown
  - id: one-way-forcing
    role: idealization
    content: "The prescribed warming receives no feedback from the transitions of the elements."
    record: mod.earth-tipping-subsystems.four-element-network.gmt_m
    distortion: "The transitions of the subsystems feed back on the global mean temperature."
    motive: tractability
    gain: "Paired simulations, with and without overshoot, in which the forcing is held fixed from outside."
    removable: unknown
  - id: directed-coupling
    role: assumption
    content: "The subsystems interact along the directed links that the ensemble of networks samples."
    record: mod.earth-tipping-subsystems.four-element-network.network_coupling
  - id: element-correspondence
    role: warrant
    content: "Each element of the network stands for one selected subsystem, by its label."
    record: bind.earth-tipping-subsystems.four-element-network.subsystems
  - id: risk-law
    role: warrant
    content: "Within the studied scenarios, an overshoot raises the probability that some element tips."
    record: mod.earth-tipping-subsystems.four-element-network.overshoot_risk

dependence:
  - kind: minimal-set
    grounds: [normal-forms, one-way-forcing, directed-coupling, element-correspondence, risk-law]

route:
  kind: simulation
  runs_on: [mod.earth-tipping-subsystems.four-element-network]
  pointer: "Wunderling et al., Global warming overshoots increase risks of climate tipping cascades in a network model, Nature Climate Change 13, 75-82, 2023, https://doi.org/10.1038/s41558-022-01545-9"

domain: "conv <= peak"

status: hypothesized
support: informal

modal_strength: possible

erotetic_relation:
  value: partial

binding:
  - record: bind.earth-tipping-subsystems.four-element-network
    version: "1"

aim_block:
  prediction:
    outputs:
      - target: phen.earth-tipping-subsystems.transition-sequences.pi
        condition: "peak > conv"
        value: "p_tip(node, \"overshoot\")"
      - target: phen.earth-tipping-subsystems.transition-sequences.Fi
        condition: "peak > conv"
        value: "mean_{member}( tev_m <= time )"
