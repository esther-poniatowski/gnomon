# negative for a forecast from a stylized network, which supplies no value of the requested laws for the actual Earth system

_schema: gnomon:assessment@1
title: "Assessment of the overshoot forecast from a network of four elements"
id: assess.earth-tipping-subsystems.four-element-overshoot-network
type: assessment
status: stabilized
assesses: ans.earth-tipping-subsystems.four-element-overshoot-network
against: quest.earth-tipping-subsystems.overshoot-sequence-forecast

tests:
  admissibility:
    product:
      verdict: fail
      evidence: "The answer states how the network computes each probability and each distribution of time, but delivers neither the joint law PZ nor a value of pi or Fi for the actual Earth system."
    scope:
      verdict: fail
      evidence: "The domain of the answer is the stylized ensemble of networks, whereas the question names the four subsystems of the actual Earth system and admits uncertainty in their physical dynamics and interactions."
    grain:
      verdict: fail
      evidence: "The answer reports the aggregate risk and the expressions of the network, without the numerical joint law PZ or the censored distribution Fi that the question requests."
    individuation:
      verdict: pass
      evidence: "The component pair subsystems carries the four elements of the model one to one onto the four subsystems of the target, by their labels; the model introduces no other bearer."
    binding:
      verdict: pass
      evidence: "The binding computes the probability and the distribution of time of each element through the key of the tipped state, pairs the prescribed warming with the global warming through a map of units, and argues the correspondence of the elements and the effect of the overshoot."
    modal-strength:
      verdict: fail
      evidence: "The answer claims a possible strength, what the stylized ensemble generates, whereas the question requests the actual strength for the Earth system."
    outputs:
      verdict: fail
      evidence: "Each predicted output gives the expression of the network under an overshoot, but no value, so no output can be compared with the tolerance that the question leaves open."
  warrant:
    phenomenon-established:
      verdict: fail
      evidence: "The phenomenon marks the sequence law as predicted, and the candidate neither establishes nor calibrates it for the actual Earth system."
    foil-evidence:
      verdict: pass
      evidence: "Paired simulations under a matched trajectory without overshoot generate the counterfactual foil."
    law-warrant:
      verdict: pass
      evidence: "The model marks its normal form as posited and the increase of risk as measured in the reported ensemble."
    closure:
      verdict: fail
      evidence: "The target declares a partial empirical closure, and the posited normal forms and couplings do not close the unknown physical laws of the actual subsystems."
    fidelity:
      verdict: pending
      evidence: "No comparison is recorded: the question leaves both tolerances open, the binding states no structural discrepancy, and no data of the Earth system calibrate the network."
    robustness:
      verdict: fail
      evidence: "The ensembles sample the parameters and the networks of the stylized model, but relax neither idealization: each subsystem stays a normal form, and the forcing acts in one direction only."
    selection:
      verdict: not-applicable
      evidence: "The named subsystems fix the membership of the target, so whether tipping occurs does not affect it."

obligations: []
appraisal: []
maturity:
  tests.warrant.fidelity: open
