title: "Coupled tipping elements of the actual Earth system"
id: system.earth-tipping-subsystems
type: target-system
status: provisional
commitment: specified
target_type: particular

identification:
  description: "the Greenland and West Antarctic ice sheets, the Atlantic Meridional Overturning Circulation and the Amazon rainforest, taken together as four coupled tipping elements of the actual Earth system"
  pointers:
    - "wunderling2024: https://doi.org/10.5194/esd-15-41-2024"
    - "wunderling2023: https://doi.org/10.1038/s41558-022-01545-9"

reference_class:
  name: "the selected subsystems of the actual Earth system that are relevant to tipping"
  projectibility:
    status: not-claimed
  selection_criteria: []

constituents:
  - name: "climate subsystem"
    symbol: sub
    extent: "enum(\"Greenland ice sheet\", \"West Antarctic ice sheet\", \"Atlantic Meridional Overturning Circulation\", \"Amazon rainforest\")"

index_sets:
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:
  - name: "physical state of a subsystem, in its empirically admissible state space"
    symbol: z
    determined: within
    signature: [sub, t]
    values:
    expression: null             # z is the declared subsystem state, so no aggregate expression
    shared: false
  - name: "qualitative regime of a subsystem"
    symbol: r
    determined: within
    signature: [sub, t]
    values: "enum(\"baseline\", \"transition\", \"alternative\")"
    expression: null             # the detection law supplies the expression, and a law can be false of the system
    shared: false
  - name: "physical signal transmitted from one subsystem to another: the climatic flux or field specific to that ordered pair"
    symbol: u
    determined: within
    signature: [sub, sub, t]
    values:
    expression: null             # the transmission law supplies the expression, and a law can be false of the system
    shared: false
  - name: "physical indicators of the state of a subsystem"
    symbol: ind
    determined: within
    signature: [sub, t]
    values:
    expression: null
    shared: false
  - name: "internal climate variability left unresolved"
    symbol: eta
    notation: '\eta'
    determined: within
    signature: [sub, t]
    values:
  - name: "prescribed trajectory of global mean surface temperature"
    symbol: DGMT
    notation: '\Delta T_{\text{GMT}}'
    of: scenario_source
    determined: outside
    signature: [t]
    values: reals
  - name: "rate of prescribed warming"
    symbol: rate
    of: scenario_source
    determined: outside
    signature: [t]
    values: reals
    expression: "diff(DGMT, t)"
    reading: "The rate measures how fast the prescribed forcing changes. A subsystem crossing a threshold responds to this rate as well as to the level that the forcing reaches."

parameters:
  - name: "critical threshold of the forcing"
    symbol: Theta
    notation: '\Theta'
    signature: [sub]
    values: reals
    expression: null
    shared: false
  - name: "intrinsic timescale of the transition"
    symbol: tau
    notation: '\tau'
    signature: [sub]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "directed architecture of the interactions"
    symbol: Aij
    notation: 'A_{ij}'
    signature: [sub, sub]
    values: bools
    expression: null
    shared: false
  - name: "law of the response along a directed interaction"
    symbol: s
    signature: [sub, sub]
    values:
    expression: null
    shared: false
  - name: "law of the internal feedback of a subsystem"
    symbol: intern
    signature: [sub]
    values:
    expression: null
    shared: false
  - name: "emission law of a transmitted signal"
    symbol: emit
    signature: [sub, sub]
    values:
    expression: null
    shared: false
  - name: "rule detecting regimes and events"
    symbol: detect
    signature: [sub]
    values:
    expression: null
    shared: false
  - name: "baseline regime of a subsystem"
    symbol: baseline
    signature: [sub]
    values: "enum(\"baseline\")"
    expression: null
    shared: false
  - name: "end of the prescribed scenario"
    symbol: Tend
    of: scenario_source
    signature: []
    values: "nonneg(reals)"
    expression: null
  - name: "peak of the prescribed warming"
    symbol: peak
    of: scenario_source
    signature: []
    values: reals
    expression: "max_{t}( DGMT )"
    reading: "The peak marks the highest level that the trajectory reaches. In an overshoot scenario, the trajectory exceeds its settling level only temporarily."
  - name: "convergence level of the prescribed warming"
    symbol: conv
    of: scenario_source
    signature: []
    values: reals
    expression: "DGMT(Tend)"
    reading: "The trajectory has settled at the convergence level once the scenario ends. The matched comparator of the question holds this level fixed."

external_systems:
  - name: "specification of the forcing scenario and Earth-system processes outside the selected subsystems"
    symbol: scenario_source
    class:                       # no admitted scenario generator named; only the trajectory they prescribe is declared
    shares: [DGMT]
    constrains:
      - name: "stabilized scenario"
        signature: []
        role: state-constraint
        expression: "rate(Tend) = 0"
        reading: "The prescribed trajectory has stopped changing by the end of the scenario, and only then is its convergence level well defined."
    reading: "The warming trajectory is prescribed from outside, so no subsystem transition feeds back onto the forcing."
  - name: "systems of Earth observation and paleoclimate measurement"
    symbol: observation
    class:                       # no quantity declared for the instruments and proxies
    shares: [ind]
    constrains: []               # the detection law already fixes how the regime is read; required coverage and uncertainty bound belong to the detection criterion of the phenomenon
    reading: "The regime indicator is read off instruments and proxies, so the criterion for a transition depends on the quantities that these measurements resolve."

maturity:
  variables.z.values: open
  variables.u.values: open
  variables.ind.values: open
  variables.eta.values: open
  parameters.s.values: open
  parameters.intern.values: open
  parameters.emit.values: open
  parameters.detect.values: open
  external_systems.class: open
