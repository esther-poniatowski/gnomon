# tests a theorem proving one direction of implication against a modal question asking for both

_schema: gnomon:assessment@1
title: "Assessment of the theorem that feasibility implies stability"
id: assess.microbial.feasibility-implies-stability
type: assessment
status: stabilized
assesses: ans.microbial.feasibility-implies-stability
against: quest.microbial.stable-coexistence-constraints

tests:
  admissibility:
    scope:
      verdict: fail
      evidence: "The theorem covers the subclass with explicit resources that microbes consume without producing any. The question, however, ranges over both variants, with interactions mediated by resources or with direct higher-order terms. The question also asks which sufficient constraints survive as the supply varies."
    grain:
      verdict: pass
      evidence: "The theorem keeps feasibility mN > 0 and local stability alpha < 0 distinct and evaluates the complete consumer-resource Jacobian at the same equilibrium."
    contrast:
      verdict: pass
      evidence: "Strict feasibility rules out competitive exclusion. The negative spectral abscissa eliminates the foil of a feasible but unstable equilibrium."
    relation:
      verdict: pass
      evidence: "The cited Jacobian argument proves the mathematical implication from feasibility plus the structural conditions to local stability."
    individuation:
      verdict: pass
      evidence: "The route runs on the target, and the claim reaches the observables mN and alpha that the phenomenon declares, so the answer introduces no quantity of its own."
    binding:
      verdict: not-applicable
      evidence: "The claim bears on a formal class, and the question names no output to match, so the answer declares its use instead of a binding."
    modal-strength:
      verdict: pass
      evidence: "The theorem claims the necessary strength that the question requests: under the laws of its subclass, no feasible equilibrium is unstable when the resource pools are at least as numerous as the populations. The restriction to that subclass fails the test of scope, and the absence of a necessary constraint fails the test of product."
    witness-or-proof:
      verdict: pass
      evidence: "The block states the space of alternatives, the feasible equilibria of the subclass, and points to the theorem on the factorized Jacobian that proves the necessity over that space."
    product:
      verdict: fail
      evidence: "The question asks for necessary and sufficient constraints across both variants. The candidate supplies only one sufficient theorem for a restricted subclass with explicit resources."
  warrant:
    phenomenon-established:
      verdict: pass
      evidence: "The candidate derives feasibility and local stability for the same formal equilibrium without presupposing any empirical observation of coexistence."
    foil-evidence:
      verdict: pass
      evidence: "The conditions of the proof directly negate the two formal expressions of the foils: mN <= 0 and alpha >= 0."
    law-warrant:
      verdict: pass
      evidence: "The two warrants of the answer are the growth and turnover laws of the background, which the closed background admits as defining the class, and the route names the published theorem on the Jacobian that establishes the implication."
    closure:
      verdict: pass
      evidence: "Within the stated subclass, the proof uses the complete consumer-resource dynamics and their full Jacobian."
    adequacy-to-use:
      verdict: pass
      evidence: "The factorization of the Jacobian exhibits the structure of consumption without production from which stability follows, which is the property that the declared use of understanding requires."
    robustness:
      verdict: not-applicable
      evidence: "The answer rests on no idealization; each condition of the theorem bounds its domain."
    selection:
      verdict: not-applicable
      evidence: "The target class is generated by model form, not selected by the presence of stable coexistence."

obligations:
  - verdict: fail
    evidence: "Stable coexistence does not imply M >= S and Pr = 0 across the admitted class, because members with direct interactions have no resource count. Even within the family with explicit resources, the condition is only sufficient."
  - verdict: pass
    evidence: "For the stated subclass, feasibility implies alpha < 0 whenever M >= S and the resource mediation involves consumption without production [butler2018]."

appraisal: []
maturity: {}
