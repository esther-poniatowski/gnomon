# positive for a candidate that states a theorem under explicit assumptions

_schema: gnomon:assessment@2
title: "Assessment of the theorem of uniform linearization"
id: assess.ntk.uniform-linearization-theorem
type: assessment
status: stabilized
assesses: ans.ntk.uniform-linearization-theorem
against: quest.ntk.linearized-dynamics-validity
against_version: "1"

tests:
  admissibility:
    product:
      verdict: pass
      evidence: "The answer supplies a validity domain and three bounds at finite width, with their convergence mode and a horizon covering every training time. Together, these deliver the consequences that the question requests."
    scope:
      verdict: pass
      evidence: "The domain of the answer conjoins its four assumptions on the gap of the limiting kernel, the inputs and the activation. It lies inside the declared class of networks, at fixed depth, as the question requires."
    grain:
      verdict: pass
      evidence: "The claim bounds Eout, Edrift and Elimit separately at order m^(-1/2). The two bounds on trajectories cover every training time, and the third holds in probability over initialization."
    individuation:
      verdict: pass
      evidence: "The route runs on the target, and the claim reaches the features that the phenomenon declares, so the answer introduces no quantity of its own."
    binding:
      verdict: not-applicable
      evidence: "The claim bears on a formal class, so the answer declares its use instead of a binding."
    modal-strength:
      verdict: pass
      evidence: "The answer claims the necessary strength that the question requests: under the assumptions of the theorem, the bounds hold with probability tending to one over the declared initialization law."
    consequence:
      verdict: pass
      evidence: "The derived law states the three bounds and their rate, and discharges the three proof obligations of the question by name."
  warrant:
    phenomenon-established:
      verdict: pass
      evidence: "The cited theorem at finite width, with the result on the limiting kernel, derives the three manifestations of convergence."
    foil-evidence:
      verdict: not-applicable
      evidence: "The question declares no foil."
    law-warrant:
      verdict: pass
      evidence: "The warrant of the answer is the gradient flow of the background, and the route names the theorem from which the bounds follow."
    closure:
      verdict: pass
      evidence: "The proof starts from the declared network and its initialization under neural tangent parameterization, uses gradient flow on the squared loss from the shared initial outputs, and bounds the resulting trajectories."
    adequacy-to-use:
      verdict: pass
      evidence: "The bounds hold uniformly in training time at every finite width, which is the property that the use of the linearized dynamics as a stand-in requires."
    robustness:
      verdict: not-applicable
      evidence: "The answer rests on no idealization; each assumption of the theorem bounds its domain."
    selection:
      verdict: not-applicable
      evidence: "Membership in the class of networks does not depend on whether the linearization succeeds."

obligations:
  - obligation: linearization
    verdict: pass
    evidence: "The claim bounds max_{t} Eout by Bout for every training time, with m * Bout^2 <= Cout^2, so Bout vanishes at order m^(-1/2)."
  - obligation: kernel-stability
    verdict: pass
    evidence: "The claim bounds max_{t} Edrift by Bdrift for every training time, with m * Bdrift^2 <= Cdrift^2, so the drift vanishes as width grows."
  - obligation: kernel-limit
    verdict: pass
    evidence: "The claim bounds Elimit by Binit in probability over initialization, with m * Binit^2 <= Cinit^2."

