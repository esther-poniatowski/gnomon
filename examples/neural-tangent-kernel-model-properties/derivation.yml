# the derivation of the shared initial outputs of the network and of its linearization, from the
# definition of the linearized model and the initial condition of the parameters

_schema: gnomon:derivation@1
title: "Shared initial outputs of the network and its linearization"
id: derivation.ntk.shared-start
type: derivation
status: provisional

serves: bg.ntk-gradient-flow.gradient-flow.shared_init
runs_on:
  - bg.ntk-gradient-flow.gradient-flow
  - system.ntk-gradient-flow
uses:

sought:
  id: shared-start
  statement: "the linearized and the nonlinear outputs coincide at the initial time"
  type: claim-truth
  condition: "for the linearization about the initial parameters theta0"

subordinate:

slots:

objects:
  - id: linearization
    form: expression
    expression:
    reading: "the linearized outputs are the outputs of the network at theta0, plus the Jacobian of the outputs at theta0 applied to the increment theta - theta0"
  - id: at-start
    form: expression
    expression:
    reading: "at the initial time the increment theta - theta0 vanishes, since the parameters start at theta0"
  - id: shared
    form: expression
    expression: "at_zero(flin) = at_zero(f)"
    reading: "the two trajectories begin with the same outputs"

posits:

moves:
  - id: start-parameters
    kind: substitute
    inputs: [linearization, bg.ntk-gradient-flow.gradient-flow.init_state]
    outputs: [at-start]
    binds:
    warrant:
      source: definition
      cites: "the initial condition of the parameters"
      error: exact
      regime:
      applies_because:
  - id: drop-increment
    kind: eliminate
    inputs: [at-start]
    outputs: [shared]
    binds:
    warrant:
      source: definition
      cites: "a linear map applied to a vanishing increment vanishes"
      error: exact
      regime:
      applies_because: affine-in-increment

kernel: start-parameters

orientations:
  - id: evaluate-at-start
    of: start-parameters
    purpose: "to evaluate the linearization at the initial time"
    determines: shared-start
    change:
    occasion: affine-in-increment
    means: "substitute the initial condition of the parameters"
    alternatives:
    provenance: reconstructed
    expected_gain: "the initial outputs of the linearization, without solving its flow"

interpretations:
  - id: affine-in-increment
    of: linearization
    kind: structural
    reading: "the linearization is affine in the increment of the parameters, so it agrees with the network wherever that increment vanishes"
    grounds: [system.ntk-gradient-flow.flin, system.ntk-gradient-flow.theta0]

features:

segments:

consequences:
  - id: shared-law
    answers: shared-start
    from: shared
    record: bg.ntk-gradient-flow.gradient-flow.shared_init
    gain: "the two trajectories are compared from a common start, so their gap is the effect of the dynamics alone"
    principle:
    pattern: "a linearization about a point agrees with its map at that point"

impasses:

refutations:
