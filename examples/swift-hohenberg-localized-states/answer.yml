# tests description at an incomplete grain of reporting; the route runs on the target, a formal equation

_schema: gnomon:answer@1
title: "Snakes-and-ladders catalogue of localized states"
id: ans.swift-hohenberg.snakes-ladders-catalogue
type: answer
answers: quest.swift-hohenberg.localized-states-description

claim:
  reading: "Numerical continuation of the one-dimensional Swift-Hohenberg equation with quadratic and cubic nonlinearities finds two snaking branches of localized profiles, both symmetric under reflection, with opposite phase. Asymmetric ladder branches connect the two snaking families. Selected segments between folds are linearly stable."
  expression: "topology = enum(\"snaking\", \"ladders\") and symmetry = enum(\"even\", \"odd\", \"asymmetric\")"
  caveat: "The claim leaves the intervals of linear stability unstated: the published continuation reports the stability of selected segments between folds, not a map over the admitted domain of the coefficients r and b. The isolas reported in other regimes of the coefficients [beck2009] lie outside the explored slice, so the claim does not state them."

grounds:
  - id: finite-domain
    role: idealization
    content: "The infinite spatial line is represented by a large finite numerical domain, for profiles whose tails decay before the boundary and whose branches stay unchanged when the domain is enlarged."
    distortion: "The target profiles live on the infinite line, whereas the computed profiles meet a boundary at a finite distance."
    motive: tractability
    gain: "The numerical continuation of localized profiles and of their temporal eigenvalues."
    removable: unknown
  - id: explored-slice
    role: condition
    content: "The continuation explores the slice b = 1.64. The cited study writes the equation with q_c = 0.5, v = 0.41 and g = 1; rescaling space by q_c, time by q_c^4 and the field by q_c^2 / sqrt(g) gives the form of the target, with b = 4 * v and r equal to 16 times the control parameter of the study."
  - id: stationary-law
    role: warrant
    content: "Each catalogued profile solves the evolution law at steady state, diff(u, t) = 0, and the reflection x to -x leaves that law invariant."
    record: bg.swift-hohenberg-localized-states.equation.evolve
  - id: localized-condition
    role: warrant
    content: "Each catalogued profile decays to the homogeneous state in the far field."
    record: bg.swift-hohenberg-localized-states.equation.localized

dependence:
  - kind: minimal-set
    grounds: [finite-domain, explored-slice, stationary-law, localized-condition]

route:
  kind: simulation
  runs_on: [system.swift-hohenberg-localized-states]
  pointer: "Numerical continuation of each localized stationary branch through its folds, with the temporal eigenvalues of the linearization about each continued profile, https://doi.org/10.1103/PhysRevE.73.056211 [burke2006]; the analysis of the snaking and ladder branches, https://doi.org/10.1137/080713306 [beck2009]"

domain: "b = 1.64"

status: hypothesized
support: informal

modal_strength: actual

erotetic_relation:
  value: partial

aim_block:
  description:
    values:
      - of: phen.swift-hohenberg.localized-states.topology
        value: "enum(\"snaking\", \"ladders\")"
      - of: phen.swift-hohenberg.localized-states.symmetry
        value: "enum(\"even\", \"odd\", \"asymmetric\")"
      - of: phen.swift-hohenberg.localized-states.stability
        value:

