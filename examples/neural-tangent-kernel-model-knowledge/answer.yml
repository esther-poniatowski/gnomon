# positive fixture for answer and assessment; the route runs on the target, a formal class, so no model and no binding

_schema: gnomon:answer@1
title: "Theorem of uniform linearization under neural tangent parameterization"
id: ans.ntk.uniform-linearization-theorem
type: answer
answers: quest.ntk.linearized-dynamics-validity

claim:
  reading: "Under the assumptions of the theorem, with probability tending to one over initialization, the nonlinear output stays within a bound of its linearization for every training time, the empirical kernel drifts by at most a bound throughout training, and the initial kernel lies within a bound of its limit; each bound is of order m^(-1/2)."
  expression: "max_{t}(Eout(m, t)) <= Bout(m) and max_{t}(Edrift(m, t)) <= Bdrift(m) and Elimit(m) <= Binit(m) and m * Bout(m) * Bout(m) <= Cout * Cout and m * Bdrift(m) * Bdrift(m) <= Cdrift * Cdrift and m * Binit(m) * Binit(m) <= Cinit * Cinit and mode_out = \"in-probability\" and mode_drift = \"in-probability\" and mode_init = \"in-probability\""

grounds:
  - id: spectral-gap
    role: assumption
    content: "The limiting kernel has a positive spectral gap on the training set: min(re(spectrum(Kinf))) > 0."
  - id: regular-inputs
    role: assumption
    content: "The inputs are bounded and the activation is regular: max_{a}(norm(X)) <= 1, with sigma and its derivative Lipschitz."
  - id: independent-initialization
    role: assumption
    content: "The parameters are drawn independently under neural tangent parameterization, as the initialization law of the background states."
    record: bg.ntk-gradient-flow.gradient-flow.init_draw
  - id: gradient-flow
    role: warrant
    content: "The parameters follow gradient flow on the squared loss from the shared initial outputs."
    record: bg.ntk-gradient-flow.gradient-flow.flow

dependence:
  - kind: minimal-set
    grounds: [spectral-gap, regular-inputs, independent-initialization, gradient-flow]

route:
  kind: proof
  runs_on: [system.ntk-gradient-flow]
  pointer: "Theorem 2.1 of Lee et al., Wide neural networks of any depth evolve as linear models under gradient descent, NeurIPS 2019, https://papers.nips.cc/paper_files/paper/2019/hash/0d1a9651497a38d8b1c3871c84528bd4-Abstract.html; the limiting kernel of Jacot et al., NeurIPS 2018, https://papers.nips.cc/paper/2018/hash/5a4be1fa34e62bb8a6ec6b91d2462f5a-Abstract.html"

domain: "min(re(spectrum(Kinf))) > 0 and max_{a}(norm(X)) <= 1 and lipschitz(sigma) and lipschitz_derivative(sigma)"

status: accepted
support: formally-proven

modal_strength: necessary

erotetic_relation:
  value: complete

use:
  value: tool
  property: "The bounds hold uniformly in training time at finite width, so the linearized dynamics can stand in for the training dynamics of a wide network."

aim_block:
  model_knowledge:
    form: derived-law
    discharges: ["nonlinear path approaches its linearization", "empirical kernel remains near its initial value", "initial empirical kernel approaches its deterministic limit"]
