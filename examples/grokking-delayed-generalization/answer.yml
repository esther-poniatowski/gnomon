# rests on the effective theory of representation learning [liu2022]; the route runs on a derived model, bound to the phenomenon

_schema: gnomon:answer@1
title: "Account of grokking through a structured representation that forms slowly"
id: ans.grokking.slow-structured-representation
type: answer
answers: quest.grokking.explain_delay

claim:
  reading: "The decoder fits the training set first, and the embedding acquires the structure consistent with the task at the slowest positive rate of the effective dynamics; the delay scales as the inverse of that rate times the learning rate of the embedding, and a vanishing rate leaves persistent memorization."
  expression: "delay_m > 0 and depends_on(delay_m, 1 / (lambda3 * eta_rep))"

grounds:
  - id: toy-task
    role: condition
    content: "The claim holds for the toy addition task, with a learned embedding table and a decoder."
    record: mod.grokking.effective-representation.toy-addition
  - id: coarse-representation
    role: assumption
    content: "The quality index and the effective loss capture the geometry of the embeddings on which generalization depends."
    record: mod.grokking.effective-representation.representation
  - id: fast-decoder
    role: idealization
    content: "The decoder step is infinitesimal relative to representation learning."
    record: mod.grokking.effective-representation.decoder-step
    distortion: "The decoder of a trained network moves at a finite rate, which can alter the Hessian of the representation."
    motive: limit
    gain: "A closed linear relaxation of the representation, separated from the motion of the decoder."
    removable: unknown
  - id: timescale-separation
    role: warrant
    content: "The networks of the question fit their decoder much faster than their representation learns, which places them in the regime of the limit decoder-step."
    record: bind.grokking.effective-representation.delay-scale
  - id: relaxation-law
    role: warrant
    content: "The representation relaxes along the modes of its Hessian."
    record: mod.grokking.effective-representation.representation_flow
  - id: timescale-law
    role: warrant
    content: "The inverse of the slowest positive rate sets the scale of the delay."
    record: mod.grokking.effective-representation.representation_time
  - id: generalization-link
    role: warrant
    content: "A representation of sufficient quality brings the held-out loss under its threshold."
    record: mod.grokking.effective-representation.generalization_link

dependence:
  - kind: minimal-set
    grounds: [toy-task, coarse-representation, fast-decoder, timescale-separation, relaxation-law, timescale-law, generalization-link]

route:
  kind: derivation
  runs_on: [mod.grokking.effective-representation]
  pointer: "Liu et al., Towards understanding grokking: an effective theory of representation learning, NeurIPS 2022, https://proceedings.neurips.cc/paper_files/paper/2022/hash/dfc310e81992d2e4cedc09ac47eff13e-Abstract-Conference.html"

domain: "source = addition and P > card(train)"

status: hypothesized
support: informal

modal_strength: actual

erotetic_relation:
  value: partial

binding:
  - record: bind.grokking.effective-representation
    version: "1"

aim_block:
  explanation:
    contrastive_explanandum: "The network generalizes strictly after it fits the training set, rather than immediately (no_delay) or never within the horizon (no_generalization)."
    explanatory_claim:
      - ground: timescale-law
        explanatory: true
        determinant: "The slowest positive rate of the representation sets how long generalization lags behind fitting."
      - ground: generalization-link
        explanatory: true
        determinant: "Generalization waits on the quality of the representation, not on the fit of the decoder."
      - ground: relaxation-law
        explanatory: false
        determinant: "The posited relaxation law supplies the dynamics in which the rate is defined, without itself making the difference."
    relation: mathematical
    factors:
      - id: slow-relaxation
        name: "slow but positive relaxation of the representation"
        factor: condition
        holds: "0 < lambda3 * eta_rep"
        bears_on: [lambda3, eta_rep]
        through: [representation_flow, representation_time, generalization_link]
        produces: positive_delay
        separates: [no_delay]
        procedure: "The decoder first memorizes the training sample; the slower positive mode of the representation then builds geometry consistent with the task and lowers the held-out loss."
        target_status: limit-construct
        pair: bind.grokking.effective-representation.delay-scale
      - id: nonzero-mode
        name: "nonzero mode of representation learning"
        factor: structural-property
        holds: "lambda3 > 0"
        bears_on: [Hrep]
        through: [representation_flow, generalization_link]
        produces: crossing_order
        separates: [no_generalization]
        procedure: "A positive rate lets the structured representation emerge before the horizon; a zero rate leaves the memorizing solution without that route to generalization."
        target_status: coarse-graining
        pair: bind.grokking.effective-representation.learning-regime
