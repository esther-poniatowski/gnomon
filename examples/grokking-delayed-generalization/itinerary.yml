_schema: gnomon:itinerary@1
title: "Itinerary of the inquiry into delayed generalization"
id: itin.grokking.explain-delay
type: itinerary
addresses: prob.grokking.delayed-generalization

steps:
  - id: pose
    activity: problematization
    inputs:
      - type: source
        ref: "liu2022: https://proceedings.neurips.cc/paper_files/paper/2022/hash/dfc310e81992d2e4cedc09ac47eff13e-Abstract-Conference.html"
    output:
      type: problem
      ref: prob.grokking.delayed-generalization
    norm:
      test: norm.problematization
      verdict: pass
      evidence: "The problem states its demand, its constraints and its explicanda, and each explicandum points to its source, a phenomenon or a candidate answer."
      judged: "2026-10-27"
    rationale:
      serves: prob.grokking.delayed-generalization
    mode: non-inferential
  - id: formulate
    activity: question-formulation
    inputs:
      - type: problem
        ref: itin.grokking.explain-delay.pose
    output:
      type: question-schema       # the schema was raised to the question quest.grokking.explain-delay, so no record holds it now
    norm:
      test: norm.question-formulation
      verdict: pass
      evidence: "The aim, the requested relation and the modal strength type the answer space, and the contrast states the foils; the topic presupposed by the question is the phenomenon, whose evidential status is established."
      judged: "2026-10-27"
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: answer-type
    mode: non-inferential
  - id: identify
    activity: subject-identification
    inputs:
      - type: question-schema
        ref: itin.grokking.explain-delay.formulate
    output:
      type: identified-subject
      ref: phen.grokking.delayed-generalization
    norm:
      test: norm.subject-identification
      verdict: pass
      evidence: "The phenomenon was fixed by a definite description and pointers, at the commitment identified, so the slot of the question refers to it."
      judged: "2026-10-27"
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: definiteness
    mode: non-inferential
  - id: delimit
    activity: delimitation
    inputs:
      - type: question
        ref: quest.grokking.explain-delay
      - type: identified-subject
        ref: itin.grokking.explain-delay.identify
    output:
      type: target-specification
      ref: system.delayed-generalization-networks
    norm:
      test: norm.delimitation
      verdict: pending
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: definiteness
    mode: non-inferential
  - id: admit
    activity: background-appraisal
    inputs:
      - type: source
        ref: "the definition of the class of trained networks"
    output:
      type: admitted-laws
      ref: bg.delayed-generalization-networks.training-specification
    norm:
      test: norm.background-appraisal
      verdict: fail
      evidence: "No admitted law of the background states its origin or the range over which it is established."
      judged: "2026-10-27"
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: bridging
    mode: inductive
  - id: propose
    activity: abduction
    inputs:
      - type: phenomenon
        ref: phen.grokking.delayed-generalization
    output:
      type: target-claim
      ref: ans.grokking.slow-structured-representation
    norm:
      test: norm.abduction
      verdict: pass
      evidence: "The candidate proposes a mechanism, the slow formation of a structured representation, that would produce the delay, and its status hypothesized claims no truth for it."
      judged: "2026-10-27"
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: candidates
    mode: abductive
  - id: derive
    activity: derivation
    inputs:
      - type: model
        ref: mod.grokking.effective-representation
    output:
      type: consequence
      ref: mod.grokking.effective-representation
    derivation: derivation.grokking.delay-scale
    norm:
      test: norm.derivation
      verdict: pending
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: candidates
    mode: deductive
  - id: check
    activity: admissibility-check
    inputs:
      - type: target-claim
        ref: itin.grokking.explain-delay.propose
      - type: question
        ref: quest.grokking.explain-delay
    output:
      type: verdict
      ref: assess.grokking.slow-structured-representation
    norm:
      test: norm.admissibility-check
      verdict: pending
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: evaluation
    mode: non-inferential
  - id: test
    activity: testing
    inputs:
      - type: target-claim
        ref: itin.grokking.explain-delay.propose
      - type: consequence
        ref: itin.grokking.explain-delay.derive
      - type: data
        ref: phen.grokking.delayed-generalization
    output:
      type: verdict
      ref: assess.grokking.slow-structured-representation
    norm:
      test: norm.testing
      verdict: pending
    rationale:
      serves: quest.grokking.explain-delay
      acts_on: evaluation
    mode: error-statistical
