title: "Finite neural networks and their training"
id: system.delayed_generalization_networks
type: target-system
status: provisional
commitment: specified
target_type: no-external-target

identification:
  description: "finite neural networks trained by gradient-based optimizers on algorithmic supervised tasks, the class in which delayed generalization is reported"
  pointers:
    - "liu2022: https://proceedings.neurips.cc/paper_files/paper/2022/hash/dfc310e81992d2e4cedc09ac47eff13e-Abstract-Conference.html"
    - "humayun2024: https://proceedings.mlr.press/v235/humayun24a.html"

reference_class:
  name: "systems that train finite neural networks"
  projectibility:
    status: assumed
    evidence: "Delayed generalization is reported across several architectures and tasks [humayun2024]. The record therefore treats the trained networks of the class as one kind for this phenomenon. No study cited here tests whether one mechanism holds across the class."
  selection_criteria: []         # membership not conditioned on an outcome; the inquiry restricts the domain to overparameterized networks instead

constituents:
  - name: "computational unit"
    symbol: unit
    extent: "range(Nu)"
  - name: "coordinate of the trainable parameters"
    symbol: coord
    extent: "range(P)"

index_sets:
  - name: "training step"
    symbol: step
    extent: "interval(nonneg(ints))"
    structure: interval
  - name: "training sample"
    symbol: train
    extent: train_set
    structure: discrete-set
  - name: "held-out sample"
    symbol: test
    extent: test_set
    structure: discrete-set

variables:
  - name: "coordinate of the network parameters"
    symbol: theta
    notation: '\theta'
    determined: within
    signature: [coord, step]
    values: reals
    expression: null
    shared: false
  - name: "auxiliary state of the optimizer, of the finite dimension that the selected optimizer fixes"
    symbol: z
    determined: within
    signature: [step]
    values:
    expression: null
    shared: false
  - name: "prediction of the network, in the prediction space of the task readout"
    symbol: pred
    determined: within
    signature: [step]
    values: "maps(data, reals)"
    expression: null             # the forward law states the prediction, and that law can be false of the system
    shared: false
  - name: "training loss"
    symbol: Ltrain
    notation: 'L_{\text{train}}'
    determined: within
    signature: [step]
    values: "nonneg(reals)"
    expression: "mean_{train}( ell(pred(train), train) )"
    reading: "The variable averages the task loss over the training sample at the current parameters."
    shared: false
  - name: "test loss"
    symbol: Ltest
    notation: 'L_{\text{test}}'
    determined: within
    signature: [step]
    values: "nonneg(reals)"
    expression: "mean_{test}( ell(pred(test), test) )"
    reading: "The variable averages the task loss over the held-out sample at the current parameters."
    shared: false

parameters:
  - name: "number of computational units"
    symbol: Nu
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "number of coordinates of the trainable parameters"
    symbol: P
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "predicate selecting the admitted algorithmic supervised tasks"
    symbol: algorithmic
    signature: []
    values:
    expression: null
  - name: "specification of the architecture: a finite computation graph with activation functions and a task readout"
    symbol: Arch
    signature: []
    values:
    expression: null
  - name: "specification of the gradient-based optimizer with its hyperparameters"
    symbol: opt
    signature: []
    values:
    expression: null
  - name: "task loss"
    symbol: ell
    signature: []
    values: "maps(prod(reals, data), nonneg(reals))"
    expression: null
  - name: "initialization distribution"
    symbol: p0
    signature: []
    values: "measures(vectors(reals, P))"
    expression: null
  - name: "initial parameter vector"
    symbol: theta0
    notation: '\theta_0'
    signature: [coord]
    values: reals
    expression: null
    shared: false
  - name: "observation horizon in training steps"
    symbol: T
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "evaluation protocol fixing when the losses are read and how a crossing time is classified before the horizon"
    symbol: proto
    signature: []
    values:
    expression: null
  - name: "near-zero threshold on the training loss"
    symbol: eps_fit
    notation: '\varepsilon_{\text{fit}}'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "generalization threshold on the test loss"
    symbol: eps_gen
    notation: '\varepsilon_{\text{gen}}'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "space of labeled examples for the supervised task"
    symbol: data
    of: source
    signature: []
    values:
    expression: null
  - name: "realized training set"
    symbol: train_set
    of: source
    signature: []
    values: "powerset(data)"
    expression: null
  - name: "realized held-out set"
    symbol: test_set
    of: source
    signature: []
    values: "powerset(data)"
    expression: null
  - name: "update rule for the auxiliary state of the optimizer"
    symbol: opt_state
    signature: []
    values:
    expression: null
  - name: "initial auxiliary state of the optimizer"
    symbol: z0
    signature: []
    values:
    expression: null

external_systems:
  - name: "process that generates the task data"
    symbol: source
    class: "subset(measures(data), algorithmic)"
    shares: [data, train_set, test_set]
    constrains:
      - name: "disjoint training and evaluation samples"
        signature: []
        role: admissibility
        expression: "intersect(train_set, test_set) = empty()"
        reading: "No example scored for generalization was available to the fit, so the two losses are different measurements."
    reading: "The task distribution supplies the two disjoint samples."

maturity:
  variables.z.values: open
  parameters.algorithmic.values: open
  parameters.Arch.values: open
  parameters.opt.values: open
  parameters.proto.values: open
  parameters.data.values: open
  parameters.opt_state.values: open
  parameters.z0.values: open
