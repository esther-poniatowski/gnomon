# types finite samples and the quantities the candidate answer defines on learned representations
# open carriers: the target leaves the type of its heterogeneous architecture unresolved

_schema: gnomon:operators@2
title: "Operators of the inquiry into delayed generalization"
id: ops.delayed-generalization-networks
type: operators
status: provisional
target_system: system.delayed-generalization-networks

operators:
  - name: "the set of all subsets of a declared set"
    symbol: powerset
    notation: '\mathcal{P}( #1 )'
    for_any: [S]
    signature: [S]
    values:
  - name: "the learned representation extracted from a parameter trajectory"
    symbol: representation
    signature:
    values:
  - name: "the fraction of the relations consistent with the task that are realized by a learned representation"
    symbol: representation_quality
    signature:
    values: "interval(0, 1)"
  - name: "the effective loss on a learned representation"
    symbol: effective_loss
    signature:
    values: reals
  - name: "the gradient of a loss with respect to the trainable parameters, at the current parameters"
    symbol: grad_parameter
    signature:
    values:

maturity:
  operators.powerset.values: open  # outside the type language: a set of subsets
  operators.representation.signature: open  # outside the type language: heterogeneous computational objects without a common structural type
  operators.representation.values: open  # outside the type language: heterogeneous computational objects without a common structural type
  operators.representation_quality.signature: open  # outside the type language: heterogeneous computational objects without a common structural type
  operators.effective_loss.signature: open  # outside the type language: heterogeneous computational objects without a common structural type
  operators.grad_parameter.signature: open  # outside the type language: a loss over parameters indexed by a heterogeneous architecture
  operators.grad_parameter.values: open  # outside the type language: a family of partial derivatives over the parameters
