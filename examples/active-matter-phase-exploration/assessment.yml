# negative for an exploration that derives a catalogue on a reduced model and omits the search and the persistence results

_schema: gnomon:assessment@2
title: "Assessment of the catalogue of exceptional phase transitions"
id: assess.nonreciprocal-active-matter.exceptional-transition-catalogue
type: assessment
status: stabilized
assesses: ans.nonreciprocal-active-matter.exceptional-transition-catalogue
against: quest.nonreciprocal-active-matter.phase-exploration
against_version: "1"

tests:
  admissibility:
    product:
      verdict: fail
      evidence: "An exploration returns the detected catalogue and the classification of persistence over the declared search space. The candidate omits the lattice search, and the detection of each of its three classes stays pending."
    scope:
      verdict: fail
      evidence: "The domain of the answer is the deterministic continuum subfamily near onset, whereas the question covers the continuum and lattice variants of the stochastic class, at every size and dimension that it selects."
    grain:
      verdict: fail
      evidence: "The catalogue gives three qualitative classes without a diagnostic at each size and dimension, without distributions over realizations, and without the finite-size scaling that separates a persistent phase."
    individuation:
      verdict: pass
      evidence: "The derived model keeps the species fields of the target and builds its Jacobian from the operators of the target, so it introduces no incompatible bearer."
    binding:
      verdict: not-applicable
      evidence: "The claim bears on a formal class, so the answer declares its use; the operations of the derived model carry its relation to the target."
    modal-strength:
      verdict: fail
      evidence: "The question requests the actual strength for the admitted stochastic models. Relative to them, the answer claims at most a possible strength, since it derives the regimes in a model without noise."
    space:
      verdict: fail
      evidence: "The space varies the cross-coupling only, whereas the question also varies the self-dynamics, the size and the dimension, and covers the lattice observables."
  warrant:
    phenomenon-established:
      verdict: not-applicable
      evidence: "The phenomenon is the product of the exploration, and was deliberately left open."
    foil-evidence:
      verdict: not-applicable
      evidence: "The question names no foil."
    law-warrant:
      verdict: pass
      evidence: "The law of onset is derived through the operation weak-amplitude, an approximation near onset, and a published bifurcation analysis [fruchart2021], so it claims no measured property of the full class."
    closure:
      verdict: fail
      evidence: "The derived model states the onset of the instability, not the normal form whose phase diagram yields the three classes, so the catalogue rests on the cited diagrams rather than on the laws of the model."
    adequacy-to-use:
      verdict: pass
      evidence: "The linearization keeps the spectral distinction between stationary and oscillatory instabilities, which the conceptual exploration requires."
    robustness:
      verdict: fail
      evidence: "Both operations of the derived model have an uncontrolled error: the answer relaxes neither the removal of the noise nor the linearization near onset, and supplies no analysis at finite size."
    selection:
      verdict: not-applicable
      evidence: "Membership in the target class does not depend on observing a phase."

obligations: []
appraisal: []
