# tests the answer form against an exploratory inquiry; the route runs on a model derived from the target, a formal class

_schema: gnomon:answer@3
title: "Catalogue of exceptional phase transitions"
id: ans.nonreciprocal-active-matter.exceptional-transition-catalogue
type: answer
answers: quest.nonreciprocal-active-matter.phase-exploration

claim:
  reading: "Near the onset of instability, the deterministic continuum subfamily separates three collective regimes: a static ordered phase, a time-dependent chiral phase and a spatially patterned phase. A nonreciprocal coupling makes the time-dependent phase reachable through an exceptional transition."
  expression: "phase_catalogue = enum(\"static ordered\", \"time-dependent chiral\", \"spatially patterned\")"

grounds:
  - id: no-noise
    role: idealization
    content: "The stochastic increments are neglected, so the model is deterministic whereas the target is stochastic."
    record: mod.nonreciprocal-active-matter.near-onset.drop-noise
    distortion: "The target fields fluctuate, and the model fields do not."
    motive: tractability
    gain: "A deterministic bifurcation problem, whose stationary and oscillatory instabilities separate in the spectrum."
    removable: unknown
  - id: near-onset
    role: condition
    content: "The claim holds near the onset of instability, where the linearization about the homogeneous ordered state is admitted."
    record: mod.nonreciprocal-active-matter.near-onset.weak-amplitude
  - id: nonreciprocal-coupling
    role: condition
    content: "The cross-coupling is nonreciprocal: G differs from its adjoint."
  - id: onset-law
    role: warrant
    content: "The homogeneous ordered state loses stability where the largest growth rate crosses zero."
    record: mod.nonreciprocal-active-matter.near-onset.onset

dependence:
  - kind: minimal-set
    grounds: [no-noise, near-onset, nonreciprocal-coupling, onset-law]

route:
  kind: derivation
  runs_on: [mod.nonreciprocal-active-matter.near-onset]
  pointer: "The bifurcation analysis and the phase diagrams of nonreciprocal phase transitions, https://doi.org/10.1038/s41586-021-03375-9 [fruchart2021]"

domain: "abs(gamma_max) <= onset_distance and G != adjoint(G)"

variant: continuum

status: hypothesized
support: informal

modal_strength: possible

erotetic_relation:
  value: partial

use:
  value: conceptual-exploration
  property: "The linearization near onset keeps the spectral distinction between stationary and oscillatory instabilities, from which the regimes are separated."

aim_block:
  exploration:
    space:
      origin: input
      observables: [C, S]
      varied:
        - factor: G
          range: "maps(U(sp), U(sp))"
    criterion:
      origin: output
      reading: "The kind of the leading eigenvalue of the linearization at onset: a real eigenvalue, a complex pair, or an instability at a nonzero wavenumber."
    classes:
      - id: static-ordered
        reading: "The leading eigenvalue is real, and the ordered state persists without time dependence."
        detection: pending
      - id: time-dependent-chiral
        reading: "A complex pair crosses at an exceptional point, and the ordered state rotates in time."
        detection: pending
      - id: spatially-patterned
        reading: "The instability occurs at a nonzero wavenumber, and the ordered state breaks into a spatial pattern."
        detection: pending
