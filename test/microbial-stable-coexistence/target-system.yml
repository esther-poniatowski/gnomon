title: "Formal population models of microbial communities"
id: system.microbial-formal-population-models
type: target-system
status: provisional
commitment: specified
target_type: possible-systems

identification:
  description: "the formal population models of microbial communities whose consumer populations interact either through explicit resource pools or through direct pairwise and higher-order coefficients"
  pointers:
    - "butler2018: https://www.nature.com/articles/s41467-018-05308-z"
    - "gibbs2024: https://onlinelibrary.wiley.com/doi/10.1111/ele.14458"

reference_class:
  name: "population models of microbial communities with interactions mediated by resources or of higher order"
  projectibility:
    status: not-claimed
  selection_criteria: []

variants:                        # explicit-resource models and direct-interaction models, with different state spaces
  - name: "community with explicit resources"
    symbol: resource_explicit
    differentiation: "The abiotic pools are part of the state, so two populations interact only by drawing on a pool that both use."
  - name: "community with direct interactions"
    symbol: direct
    differentiation: "The pools are integrated out, so the state consists of the abundances alone, and one population enters the growth of another through a coefficient."

constituents:
  - name: "microbial population"
    symbol: pop
    extent: "range(S)"
  - name: "abiotic resource pool"
    symbol: res
    variant: resource_explicit
    extent: "range(M)"

index_sets:
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:
  - name: "abundance of each microbial population"
    symbol: N
    determined: within
    signature: [pop, t]
    values: "nonneg(reals)"
    expression: null             # abundance declared directly, so no aggregate expression
    shared: false
  - name: "resource concentration"
    symbol: R
    variant: resource_explicit
    determined: within
    signature: [res, t]
    values: "nonneg(reals)"
    expression: null
    shared: false

parameters:
  - name: "number of microbial populations"
    symbol: S
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "number of abiotic resource pools"
    symbol: M
    variant: resource_explicit
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "rate of resource supply"
    symbol: rho
    notation: '\rho'
    variant: resource_explicit
    signature: [res]
    values: "nonneg(reals)"
    expression: null
    shared: false
  - name: "mortality rate of each consumer"
    symbol: mu
    notation: '\mu'
    signature: [pop]
    values: "nonneg(reals)"
    expression: null
    shared: false
  - name: "coefficient of resource consumption"
    symbol: C
    variant: resource_explicit
    signature: [res, pop]
    values: "nonneg(reals)"
    expression: null
    shared: false
  - name: "coefficient of resource production"
    symbol: Pr
    variant: resource_explicit
    signature: [res, pop]
    values: "nonneg(reals)"
    expression: null
    shared: false
  - name: "coefficient of pairwise interaction"
    symbol: A
    variant: direct
    signature: [pop, pop]
    values: reals
    expression: null
    shared: false
  - name: "coefficient of higher-order interaction"
    symbol: B
    variant: direct
    signature: [pop, pop, pop]
    values: reals
    expression: null
    shared: false
  - name: "specification of the interaction laws: the admissible functional forms and coefficients of one member model"
    symbol: theta
    notation: '\theta'
    signature: []
    values:
    expression: null
    reading: "One member specification fixes a variant and its functional forms. The specification therefore supplies only the coefficient families that the variant declares."
  - name: "per-capita growth law with explicit resources"
    symbol: Fr
    notation: 'F_{\mathrm{res}}'
    variant: resource_explicit
    signature: [pop]
    values: "maps(prod(vectors(nonneg(reals), S), vectors(nonneg(reals), M)), reals)"
    expression: null
    reading: "The abundance and resource vectors determine the per-capita growth of each population."
    shared: false
  - name: "per-capita growth law with direct interactions"
    symbol: Fd
    notation: 'F_{\mathrm{dir}}'
    variant: direct
    signature: [pop]
    values: "maps(vectors(nonneg(reals), S), reals)"
    expression: null
    reading: "The abundance vector directly determines the per-capita growth of each population."
    shared: false
  - name: "law of resource turnover"
    symbol: G
    variant: resource_explicit
    signature: [res]
    values: "maps(prod(prod(vectors(nonneg(reals), S), vectors(nonneg(reals), M)), vectors(nonneg(reals), M)), reals)"
    expression: null
    shared: false

external_systems:
  - name: "formal environment that supplies the resources"
    symbol: supply
    variant: resource_explicit
    class:                       # environment individuated by the supply vector that rho already declares
    shares: [rho]
    constrains: []               # the declared value set of rho already imposes nonnegativity
    reading: "The resource inflow is set outside the community, so no population alters its own supply."

maturity:
  parameters.theta.values: open  # member specification has a different type in each variant
  external_systems.class: open
