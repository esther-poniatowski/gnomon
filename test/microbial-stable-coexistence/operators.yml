title: "Operators of the inquiry into microbial coexistence"
id: ops.microbial-formal-population-models
type: operators
status: provisional
target_system: system.microbial-formal-population-models

operators:
  - name: "the predicate that a complete member state belongs to an equilibrium of the dynamics of the member model"
    symbol: equilibrium
    notation: '\operatorname{Eq}_{#1}( #2 )'
    signature: [open, open]
    values: bools
  - name: "the component of a complete member state that holds the population abundances"
    symbol: population_component
    notation: '\operatorname{pop}_{#1}( #2, #3 )'
    signature: [open, open, pop]
    values: "nonneg(reals)"
  - name: "the Jacobian of the complete dynamics of the member model at a selected equilibrium"
    symbol: community_jacobian
    notation: '\operatorname{J}_{#1}( #2 )'
    signature: [open, open]
    values: open

maturity:
  operators.equilibrium.signature: open
  operators.population_component.signature: open
  operators.community_jacobian.signature: open
  operators.community_jacobian.values: open
