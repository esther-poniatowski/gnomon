title: "Necessary and sufficient constraints for stable coexistence"
statement: "Across models of microbial communities, which constraints on interactions are necessary, sufficient, or both for feasible and locally stable coexistence? The interactions are mediated by resources or of higher order. The contrast is with competitive exclusion and with an unstable positive equilibrium. Which sufficient constraints remain valid as resource supply varies?"
id: quest.microbial.stable-coexistence-constraints
type: question
status: posed
subject:
  target_system: system.microbial-formal-population-models
  phenomenon: phen.microbial.stable-coexistence
  contrast:
    locus: other-outcome
    foil_set:
      - name: "competitive exclusion"
        symbol: exclusion
        expression: ["mN <= 0"]
        reading: "No equilibrium gives every microbial population a positive abundance, as under competitive exclusion."
      - name: "feasible but unstable equilibrium"
        symbol: unstable
        expression: ["mN > 0", "alpha >= 0"]
        reading: "An equilibrium gives every microbial population a positive abundance but is locally dynamically unstable."
    compatibility: derived
    foil_status: counterfactual
  domain:
    restrictions: []
    limit: null                  # the question concerns no limit system

task:
  epistemic_aim: modal-knowledge
  requested_relation: mathematical
  modal_strength: necessary
  admissible_explanans:
    compositional: [system.microbial-formal-population-models#pop, system.microbial-formal-population-models#res]
    substrate: independent
    justification: "The sought constraints concern how populations affect one another and, for members with explicit resources, the pools that mediate those effects. No identity specific to a taxon may therefore carry the result."
  required_accuracy:
    standard: not-applicable        # answer derived by proof, so no measurement standard
    outputs_to_match: []
    structures_to_match: []
  proof_obligations:             # one obligation per direction; the inquiry asks for both
    - name: "necessity of the constraint"
      reading: "Every member model with a feasible and locally stable equilibrium satisfies the proposed constraint."
      antecedent: ["mN > 0", "alpha < 0"]
      consequent: [open]         # the constraint itself is the sought result
    - name: "sufficiency of the constraint"
      reading: "Every member model that satisfies the proposed constraint has a feasible and locally stable equilibrium."
      antecedent: [open]
      consequent: ["mN > 0", "alpha < 0"]

virtues: []

maturity:
  task.proof_obligations.necessity.consequent: open
  task.proof_obligations.sufficiency.antecedent: open
