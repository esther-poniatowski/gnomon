title: "Transition sequences under warming trajectories"
statement: "The selected tipping elements of the actual Earth system are coupled and undergo ordered regime transitions. The identities and event times of these transitions depend on the prescribed warming trajectory and on the interactions among subsystems."
id: phen.earth-tipping-subsystems.transition-sequences
type: phenomenon
status: provisional
target_system: system.earth-tipping-subsystems

category: regularity

index_sets:
  - name: "prediction horizon"
    symbol: H
    extent: "interval(reals)"
    structure: interval

explanandum_variables:
  - name: "transition time of a subsystem"
    symbol: Tev
    notation: 'T'
    signature: [sub]
    values: "nonneg(reals)"
    expression: "min_{t}( r != baseline )"
    reading: "The subsystem first leaves its baseline regime at the transition time."
    event:
      origin: "0"
      horizon: H
      censoring: right
      reading: "The event occurs when the subsystem leaves its baseline regime. A subsystem that has not left its baseline regime by the horizon is recorded as *censored*. A censored subsystem is not recorded as a late transition."
  - name: "marked sequence of transitions"
    symbol: Z
    signature: []
    values: open
    expression: "sequence(sub, Tev)"
    reading: "The sequence lists the subsystems that transition, ordered by their event times."
  - name: "joint law of the marked sequence of transitions"
    symbol: PZ
    notation: 'P_Z'
    signature: [H]
    values: "measures(Z)"
    expression: "dist_{realization, param, struct}( Z )"
    reading: "The joint law describes the whole ordered sequence and is taken over every declared source of spread."
  - name: "probability that a subsystem transitions by the horizon"
    symbol: pi
    notation: 'p_i'
    signature: [sub, H]
    values: "interval(0, 1)"
    expression: "dist_{realization, param, struct}( Tev <= H )"
    reading: "The probability equals the fraction of the ensemble in which the transition has already occurred. The number therefore characterizes the *scenario and the model class*. The number is not a property of any single trajectory."
  - name: "censored distribution of the transition time"
    symbol: Fi
    notation: 'F_i'
    signature: [sub, H]
    values: "maps(t, interval(0, 1))"
    expression: "dist_{realization, param, struct}( Tev <= t )"
    reading: "The cumulative distribution of each transition time extends through the horizon and retains non-events as right-censored observations."

manifestations:                  # sequence law as a function of the warming trajectory
  - name: "dependence of the transition sequence on the warming trajectory"
    symbol: overshoot_dependence
    form: dependence
    expression: "depends_on(PZ, DGMT)"
    reading: "The system alone does not fix which subsystems transition or in which order: two trajectories that reach the same warming along separate paths can produce different sequences."
    features:
      - name: "effect of an overshoot trajectory on the sequence law"
        symbol: overshoot_effect
        values: open
        observed: open

scope_over_instances:            # predictive spread decomposes into declared sources
  - name: "internal climate variability"
    symbol: realization
    over: [eta]
    source: realization
    quantification: ensemble-distribution
    conditional_on: [param, struct, scenario]
  - name: "admissible dynamical parameters of each subsystem"
    symbol: param
    over: [Theta, tau, intern]
    source: random-parameters
    quantification: ensemble-distribution
    conditional_on: [scenario]
  - name: "admissible interaction architectures among subsystems"
    symbol: struct
    over: [Aij, s, emit]
    source: random-structure
    quantification: ensemble-distribution
    conditional_on: [scenario]
  - name: "prescribed emission scenario"
    symbol: scenario
    over: [DGMT]
    source: scenario
    quantification: single
    conditional_on: []

conditions_and_byproducts:       # scenario declared as a source of variation; precipitating list empty: no necessary trigger asserted for the partially known actual system
  precipitating: []
  inhibiting: []
  modulating:
    - name: "rate of warming"
      reading: "The warming rate changes the time spent beyond a threshold and can also trigger rate-induced transitions, so the effect of the rate need not be monotone."
      effect: "depends_on(pi, rate)"
  nonstandard: []
  byproducts: []

evidential_status: predicted

detection_criterion:
  - name: "robustness across admissible parameters and structures"
    across: [param, struct]
    expression: open
    procedure: "The conclusions hold across the scientifically admissible parameters and interaction structures."
  - name: "predeclared criteria and calibrated probabilities"
    across: []
    expression: open
    procedure: "Each transition criterion is predeclared, and the event probabilities are calibrated against independent evidence."
    limited_by: [system.earth-tipping-subsystems#observation]
  - name: "separable sources of spread"
    across: [realization, param, struct, scenario]
    expression: open
    procedure: "Each source of spread keeps a separately identifiable contribution."

data:
  - "wunderling2023: An ensemble of network models of four tipping elements under stylized overshoot trajectories: https://doi.org/10.1038/s41558-022-01545-9"
  - "wunderling2024: A synthesis of the evidence on interactions among tipping elements and on nonlinear mediators: https://doi.org/10.5194/esd-15-41-2024"

maturity:                        # sequence law and overshoot effect not yet established
  explanandum_variables.Z.values: open
  manifestations.features.values: open
  manifestations.features.observed: open
  scope_over_instances: provisional
  detection_criterion.expression: open
