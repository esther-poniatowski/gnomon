title: "Forecasts of transition sequences under warming overshoot"
statement: "For the selected tipping elements of the actual Earth system, what joint probability distribution governs transition sequences through a stated horizon under each specified warming trajectory? How does a temporary overshoot change that distribution relative to a matched trajectory that never exceeds its final warming level?"
id: quest.earth-tipping-subsystems.overshoot-sequence-forecast
type: question
status: posed
subject:
  target_system: system.earth-tipping-subsystems
  phenomenon: phen.earth-tipping-subsystems.transition-sequences
  contrast:
    locus: other-condition
    foil_set:
      - name: "matched non-overshoot trajectory"
        symbol: no_overshoot
        expression: ["peak <= conv"]
        reading: "The comparator follows a warming path that never exceeds its convergence level. The path matches the overshoot trajectory on the convergence level and on every other property that the comparison holds fixed."
    compatibility: derived
    foil_status: counterfactual
  domain:
    restrictions: []
    limit: null

task:
  epistemic_aim: prediction
  requested_relation: statistical
  modal_strength: actual
  admissible_explanans:
    compositional: [system.earth-tipping-subsystems#sub]
    substrate: specific
    justification: "The forecast names which subsystem transitions and when, so the explanans must resolve every tipping element individually, with its own parameters. An account that holds for any system of that shape cannot determine which subsystem tips first."
  required_accuracy:
    standard: numeric-bound
    outputs_to_match:
      - target: phen.earth-tipping-subsystems.transition-sequences#pi
        tolerance:
          metric: "abs(answer - target)"
          bound: open
        justification: "A forecast is usable only if it assigns each transition a probability, so an answer that only lists possible events does not meet the question."
      - target: phen.earth-tipping-subsystems.transition-sequences#Fi
        tolerance:
          metric: "max_{t}( abs(answer - target) )"
          bound: open
        justification: "The time of each transition fixes the lead time available for any response. The question therefore requires, for each transition, its probability and the distribution of its time."
    structures_to_match: []

virtues:
  - virtue: structural-transparency
    standing: constitutive
    justification: "A cascade propagates along the interactions among subsystems, and the question requires the answer to reproduce their architecture. An answer whose transmission pathway is not inspectable cannot be checked against that architecture."

maturity:
  task.required_accuracy.outputs_to_match.tolerance.bound: open
