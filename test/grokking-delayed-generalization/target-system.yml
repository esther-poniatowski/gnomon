# Method: docs/epistemology/target-system.md. One file per target system.
# Symbols and expressions: docs/epistemology/symbols-and-expressions.md.
# The specifications appear in the order of the method note.

title: "Finite neural-network training systems"
id: system.delayed_generalization_networks
type: target-system
status: provisional              # provisional | stabilized | retracted
target_type: no-external-target  # particular | class-actual | class-possible | hypothetical | no-external-target | open

reference_class:                 # a name only: the specifications below generate the class, so they are not restated here
  name: "finite neural-network training systems"
  selection_criteria: []         # membership is not conditioned on an outcome; the overparameterization the inquiry needs is a restriction of its domain

constituents:
  - name: "computational unit"
    symbol: unit
    extent: "range(Nu)"
  - name: "trainable parameter coordinate"
    symbol: coord
    extent: "range(P)"

index_sets:
  - name: "training step"
    symbol: step
    extent: "interval(nonneg(ints))"
    structure: interval
  - name: "training sample"
    symbol: train
    extent: train_set
    structure: discrete-set
  - name: "held-out sample"
    symbol: test
    extent: test_set
    structure: discrete-set

variables:                       # quantities that vary while the phenomenon unfolds; the state space is the product of the value sets of the non-aggregate ones determined within
  - name: "network parameter coordinate"
    symbol: theta
    notation: '\theta'
    determined: within
    signature: [coord, step]
    values: reals
    expression: null
    shared: false
  - name: "optimizer auxiliary state, of the finite dimension the selected optimizer fixes"
    symbol: z
    determined: within
    signature: [step]
    values: open
    expression: null
    shared: false
  - name: "network prediction, in the prediction space of the task readout"
    symbol: pred
    determined: within
    signature: [step]
    values: "maps(data, reals)"
    expression: null             # the law below states it, and a law can be false of the system
    shared: false
  - name: "training loss"
    symbol: Ltrain
    notation: 'L_{\text{train}}'
    determined: within
    signature: [step]
    values: "nonneg(reals)"
    expression: "mean_{train}( ell(pred(train), train) )"
    reading: "the average task loss over the training sample at the current parameters"
    shared: false
  - name: "test loss"
    symbol: Ltest
    notation: 'L_{\text{test}}'
    determined: within
    signature: [step]
    values: "nonneg(reals)"
    expression: "mean_{test}( ell(pred(test), test) )"
    reading: "the average task loss over the held-out sample at the current parameters"
    shared: false

parameters:                      # quantities held fixed while the phenomenon unfolds
  - name: "number of computational units"
    symbol: Nu
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "number of trainable parameter coordinates"
    symbol: P
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "predicate selecting the admitted algorithmic supervised tasks"
    symbol: algorithmic
    signature: []
    values: open
    expression: null
  - name: "architecture specification: a finite computation graph with activation functions and a task readout"
    symbol: Arch
    signature: []
    values: open
    expression: null
  - name: "gradient-based optimizer specification with its hyperparameters"
    symbol: opt
    signature: []
    values: open
    expression: null
  - name: "task loss"
    symbol: ell
    signature: []
    values: "maps(prod(reals, data), nonneg(reals))"
    expression: null
  - name: "initialization distribution"
    symbol: p0
    signature: []
    values: "measures(vectors(reals, P))"
    expression: null
  - name: "initial parameter vector"
    symbol: theta0
    notation: '\theta_0'
    signature: [coord]
    values: reals
    expression: null
    shared: false
  - name: "observation horizon in training steps"
    symbol: T
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "evaluation protocol fixing when the losses are read and how a crossing time is classified before the horizon"
    symbol: proto
    signature: []
    values: open
    expression: null
  - name: "near-zero training-loss threshold"
    symbol: eps_fit
    notation: '\varepsilon_{\text{fit}}'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "generalization threshold on the test loss"
    symbol: eps_gen
    notation: '\varepsilon_{\text{gen}}'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "space of labeled examples for the supervised task"
    symbol: data
    of: source
    signature: []
    values: open
    expression: null
  - name: "realized training set"
    symbol: train_set
    of: source
    signature: []
    values: "powerset(data)"
    expression: null
  - name: "realized held-out set"
    symbol: test_set
    of: source
    signature: []
    values: "powerset(data)"
    expression: null
  - name: "optimizer auxiliary-state update rule"
    symbol: opt_state
    signature: []
    values: open
    expression: null
  - name: "initial optimizer auxiliary state"
    symbol: z0
    signature: []
    values: open
    expression: null

laws:                            # the behaviors of the components or of the system that are admitted a priori
  - name: "forward computation"
    symbol: forward
    signature: []
    role: input-output
    expression: "pred = Arch(theta, data)"
    reading: "the architecture maps the current parameters and the inputs to predictions"
    warrant: posited
    rests_on: "the architecture the class fixes"
  - name: "initialization draw"
    symbol: init_draw
    signature: []
    role: distribution
    expression: "drawn_from(theta0, p0)"
    reading: "the full initial parameter vector is sampled from the declared initialization law"
    warrant: posited
    rests_on: "the initialization scheme the class fixes"
  - name: "initial parameter state"
    symbol: initial_state
    signature: [coord]
    role: state-constraint
    expression: "theta(coord, 0) = theta0"
    reading: "the training trajectory begins at the sampled initial parameter vector"
    warrant: posited
    rests_on: "the initialization draw"
  - name: "gradient-based update"
    symbol: update
    signature: [coord]
    role: evolution
    expression: "diff(theta, step) = opt(grad(Ltrain), z)"
    reading: "the optimizer moves the parameters along the training-loss gradient, carrying its own state"
    warrant: posited
    rests_on: "the optimizer the class fixes"
  - name: "optimizer-state update"
    symbol: update_state
    signature: []
    role: evolution
    expression: "diff(z, step) = opt_state(grad(Ltrain), z)"
    reading: "the optimizer updates its auxiliary state together with the trainable parameters"
    warrant: posited
    rests_on: "the optimizer the class fixes"
  - name: "initial optimizer state"
    symbol: initial_optimizer_state
    signature: []
    role: state-constraint
    expression: "z(0) = z0"
    reading: "the auxiliary optimizer state begins at the value fixed by the optimizer specification"
    warrant: posited
    rests_on: "the optimizer the class fixes"

closure: complete                # complete (formal target: the laws define the system) | partial (empirical target) | open

external_systems:
  - name: "task data-generating process"
    symbol: source
    class: "subset(measures(data), algorithmic)"
    shares: [data, train_set, test_set]
    constrains:
      - name: "disjoint training and evaluation samples"
        signature: []
        role: admissibility
        expression: "intersect(train_set, test_set) = empty()"
        reading: "no example scored for generalization was available to the fit, so the two losses are different measurements rather than one taken twice"
    reading: "the task distribution supplies the two disjoint samples, so the test loss is measured on data the fit never saw"

maturity:
  variables.z.values: open
  parameters.algorithmic.values: open
  parameters.Arch.values: open
  parameters.opt.values: open
  parameters.proto.values: open
  parameters.data.values: open
  parameters.opt_state.values: open
  parameters.z0.values: open
