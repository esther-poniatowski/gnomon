title: "Finite neural networks and their training"
id: system.delayed_generalization_networks
type: target-system
status: provisional
target_type: no-external-target

reference_class:
  name: "systems that train finite neural networks"
  selection_criteria: []         # membership not conditioned on an outcome; the inquiry restricts the domain to overparameterized networks instead

constituents:
  - name: "computational unit"
    symbol: unit
    extent: "range(Nu)"
  - name: "coordinate of the trainable parameters"
    symbol: coord
    extent: "range(P)"

index_sets:
  - name: "training step"
    symbol: step
    extent: "interval(nonneg(ints))"
    structure: interval
  - name: "training sample"
    symbol: train
    extent: train_set
    structure: discrete-set
  - name: "held-out sample"
    symbol: test
    extent: test_set
    structure: discrete-set

variables:
  - name: "coordinate of the network parameters"
    symbol: theta
    notation: '\theta'
    determined: within
    signature: [coord, step]
    values: reals
    expression: null
    shared: false
  - name: "auxiliary state of the optimizer, of the finite dimension that the selected optimizer fixes"
    symbol: z
    determined: within
    signature: [step]
    values: open
    expression: null
    shared: false
  - name: "prediction of the network, in the prediction space of the task readout"
    symbol: pred
    determined: within
    signature: [step]
    values: "maps(data, reals)"
    expression: null             # the forward law states the prediction, and that law can be false of the system
    shared: false
  - name: "training loss"
    symbol: Ltrain
    notation: 'L_{\text{train}}'
    determined: within
    signature: [step]
    values: "nonneg(reals)"
    expression: "mean_{train}( ell(pred(train), train) )"
    reading: "The variable averages the task loss over the training sample at the current parameters."
    shared: false
  - name: "test loss"
    symbol: Ltest
    notation: 'L_{\text{test}}'
    determined: within
    signature: [step]
    values: "nonneg(reals)"
    expression: "mean_{test}( ell(pred(test), test) )"
    reading: "The variable averages the task loss over the held-out sample at the current parameters."
    shared: false

parameters:
  - name: "number of computational units"
    symbol: Nu
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "number of coordinates of the trainable parameters"
    symbol: P
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "predicate selecting the admitted algorithmic supervised tasks"
    symbol: algorithmic
    signature: []
    values: open
    expression: null
  - name: "specification of the architecture: a finite computation graph with activation functions and a task readout"
    symbol: Arch
    signature: []
    values: open
    expression: null
  - name: "specification of the gradient-based optimizer with its hyperparameters"
    symbol: opt
    signature: []
    values: open
    expression: null
  - name: "task loss"
    symbol: ell
    signature: []
    values: "maps(prod(reals, data), nonneg(reals))"
    expression: null
  - name: "initialization distribution"
    symbol: p0
    signature: []
    values: "measures(vectors(reals, P))"
    expression: null
  - name: "initial parameter vector"
    symbol: theta0
    notation: '\theta_0'
    signature: [coord]
    values: reals
    expression: null
    shared: false
  - name: "observation horizon in training steps"
    symbol: T
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "evaluation protocol fixing when the losses are read and how a crossing time is classified before the horizon"
    symbol: proto
    signature: []
    values: open
    expression: null
  - name: "near-zero threshold on the training loss"
    symbol: eps_fit
    notation: '\varepsilon_{\text{fit}}'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "generalization threshold on the test loss"
    symbol: eps_gen
    notation: '\varepsilon_{\text{gen}}'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "space of labeled examples for the supervised task"
    symbol: data
    of: source
    signature: []
    values: open
    expression: null
  - name: "realized training set"
    symbol: train_set
    of: source
    signature: []
    values: "powerset(data)"
    expression: null
  - name: "realized held-out set"
    symbol: test_set
    of: source
    signature: []
    values: "powerset(data)"
    expression: null
  - name: "update rule for the auxiliary state of the optimizer"
    symbol: opt_state
    signature: []
    values: open
    expression: null
  - name: "initial auxiliary state of the optimizer"
    symbol: z0
    signature: []
    values: open
    expression: null

laws:
  - name: "forward computation"
    symbol: forward
    signature: []
    role: input-output
    expression: "pred = Arch(theta, data)"
    reading: "The architecture maps the current parameters and the inputs to predictions."
    warrant: posited
    rests_on: "The class fixes the architecture."
  - name: "initialization draw"
    symbol: init_draw
    signature: []
    role: distribution
    expression: "drawn_from(theta0, p0)"
    reading: "The full parameter vector at step zero is sampled from the declared initialization law."
    warrant: posited
    rests_on: "The class fixes the initialization scheme."
  - name: "initial state of the parameters"
    symbol: initial_state
    signature: [coord]
    role: state-constraint
    expression: "theta(coord, 0) = theta0"
    reading: "The training trajectory begins at the sampled initial parameter vector."
    warrant: posited
    rests_on: "The law follows from the initialization draw."
  - name: "gradient-based update"
    symbol: update
    signature: [coord]
    role: evolution
    expression: "diff(theta, step) = opt(grad(Ltrain), z)"
    reading: "The optimizer moves the parameters along the gradient of the training loss, using its own auxiliary state."
    warrant: posited
    rests_on: "The class fixes the optimizer."
  - name: "update of the optimizer state"
    symbol: update_state
    signature: []
    role: evolution
    expression: "diff(z, step) = opt_state(grad(Ltrain), z)"
    reading: "The optimizer updates its auxiliary state together with the trainable parameters."
    warrant: posited
    rests_on: "The class fixes the optimizer."
  - name: "initial state of the optimizer"
    symbol: initial_optimizer_state
    signature: []
    role: state-constraint
    expression: "z(0) = z0"
    reading: "The auxiliary state begins at the value fixed by the optimizer specification."
    warrant: posited
    rests_on: "The class fixes the optimizer."

closure: complete

external_systems:
  - name: "process that generates the task data"
    symbol: source
    class: "subset(measures(data), algorithmic)"
    shares: [data, train_set, test_set]
    constrains:
      - name: "disjoint training and evaluation samples"
        signature: []
        role: admissibility
        expression: "intersect(train_set, test_set) = empty()"
        reading: "No example scored for generalization was available to the fit, so the two losses are different measurements."
    reading: "The task distribution supplies the two disjoint samples."

maturity:
  variables.z.values: open
  parameters.algorithmic.values: open
  parameters.Arch.values: open
  parameters.opt.values: open
  parameters.proto.values: open
  parameters.data.values: open
  parameters.opt_state.values: open
  parameters.z0.values: open
