title: "Mathematical explanation of delayed generalization"
statement: "Which mathematical properties of training finite overparameterized neural networks on algorithmic tasks explain delayed generalization? The contrast is with immediate generalization and with persistent memorization. An answer must also account for the duration of the delay and its variation across random initializations."
id: quest.grokking.explain_delay
type: question
status: posed
subject:
  target_system: system.delayed_generalization_networks
  phenomenon: phen.grokking.delayed_generalization
  contrast:
    locus: other-outcome
    foil_set:
      - name: "immediate generalization"
        symbol: no_delay
        expression: ["delay = 0"]
        reading: "Under immediate generalization, the delay vanishes within the temporal resolution of the evaluation protocol."
      - name: "persistent memorization"
        symbol: no_generalization
        expression: ["min_{step <= T}( Ltest ) > eps_gen"]
        reading: "Under persistent memorization, the time of the generalization event is right-censored at the finite observation horizon."
    compatibility: derived
    foil_status: observed
  domain:
    restrictions:
      - name: "algorithmic supervised task"
        expression: "algorithmic(source)"
        justification: "The delay is reported for algorithmic tasks, whose training examples a network can memorize before it learns their exact rule. Without an exact rule, the contrast between fitting and generalizing does not apply."
      - name: "overparameterized architecture"
        expression: "P > card(train)"
        justification: "This restriction selects the interpolation regime in which delayed generalization is studied. The restriction does not claim that fewer parameters make that regime unreachable."
    limit: null

task:
  epistemic_aim: explanation
  requested_relation: mathematical
  modal_strength: actual
  admissible_explanans:
    compositional: null
    substrate: null
  required_accuracy:
    standard: qualitative
    outputs_to_match:
      - target: phen.grokking.delayed_generalization#crossing_order
        tolerance: null
        justification: "The explanandum is that fitting comes first, so an account that produces the opposite order addresses a different phenomenon."
      - target: phen.grokking.delayed_generalization#delay
        tolerance: null
        justification: "An account under which the delay vanishes in the regime where it is observed contradicts the phenomenon. Any candidate must therefore produce a strictly positive delay."
      - target: phen.grokking.delayed_generalization#Pdelay
        tolerance: null
        justification: "The question asks why runs with distinct initializations generalize at different times, so an account must recover the whole distribution of durations: its qualitative spread and its censoring pattern. One representative duration does not answer the question."
    structures_to_match: []

virtues:
  - virtue: unification
    standing: preferred
    justification: "An account that covers several training specifications is preferred once each of them has been explained on its own terms."
  - virtue: structural-transparency
    standing: constitutive
    justification: "The explanandum is a change of regime during training, so the mechanism that produces it must be exhibited. A curve fitted to the transition after the fact does not meet this requirement."

maturity:
  task.admissible_explanans: open  # keep open: a level fixed prematurely would exclude an account the analysis has not yet reached
