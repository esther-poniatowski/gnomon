title: "Delayed generalization"
statement: "A finite neural network brings its training loss under a threshold close to zero, and its test loss crosses the generalization criterion only after a positive delay."
id: phen.grokking.delayed_generalization
type: phenomenon
status: provisional
target_system: system.delayed_generalization_networks

category: regularity

explanandum_variables:           # reference the loss trajectories: the target declares them as quantities
  - reference: system.delayed_generalization_networks#Ltrain
  - reference: system.delayed_generalization_networks#Ltest
  - name: "first crossing time of the training criterion"
    symbol: tfit
    notation: 't_{\text{fit}}'
    signature: []
    values: step
    expression: "min_{step}( Ltrain <= eps_fit )"
    reading: "The training loss reaches its threshold close to zero for the first time at this step."
    event:
      origin: "0"
      horizon: T
      censoring: right
      reading: "The event occurs when the training loss first reaches its threshold, and a run that never fits by the horizon is recorded as censored."
  - name: "first crossing time of the generalization criterion"
    symbol: tgen
    notation: 't_{\text{gen}}'
    signature: []
    values: step
    expression: "min_{step}( Ltest <= eps_gen )"
    reading: "The test loss reaches its generalization threshold for the first time at this step."
    event:
      origin: "0"
      horizon: T
      censoring: right
      reading: "The event occurs when the test loss first reaches its threshold. A run that never reaches the threshold is recorded as exceeding the horizon. The record does not read such a run as a large delay."
  - name: "duration of the delay"
    symbol: delay
    notation: '\Delta t'
    signature: []
    values: "nonneg(ints)"
    expression: "tgen - tfit"
    reading: "The delay counts the steps by which generalization follows fitting, when both events occur."
    event:
      origin: tfit
      horizon: "T - tfit"
      censoring: right
      reading: "When generalization has not occurred by the observation horizon, the delay is right-censored at the time left after fitting."
  - name: "distribution of the delay across initialization draws"
    symbol: Pdelay
    notation: 'P_{\Delta t}'
    signature: []
    values: "measures(nonneg(ints))"
    expression: "dist_{init}( delay )"
    reading: "The distribution records completed delay durations and retains right-censored runs at the observation horizon."

manifestations:                  # training-loss criterion reached first; delay positive
  - name: "order of the two crossing times"
    symbol: crossing_order
    form: relation
    expression: "tfit < tgen"
    reading: "When both crossings occur, the ordering identifies a run with delayed generalization. The frequency and the duration of such runs are read over initialization draws."
    features: []
  - name: "strictly positive delay"
    symbol: positive_delay
    form: value
    expression: "delay > 0"
    reading: "The network generalizes strictly after it fits the training set."
    features:
      - name: "observed duration of the delay"
        symbol: delay_obs
        values: "pos(ints)"
        observed: open           # the delay depends on the training specification, and the case fixes none

scope_over_instances:            # distribution over initializations at one fixed training specification
  - name: "initialization draw"
    symbol: init
    over: [theta0]
    source: realization
    quantification: ensemble-distribution
    conditional_on: [spec]
  - name: "training specification"
    symbol: spec
    over: [Arch, opt, opt_state, z0, ell, proto, data, train_set, test_set, p0, eps_fit, eps_gen, T]
    source: class-member
    quantification: single
    conditional_on: []
    differentiation: "Each specification fixes the architecture, the optimizer, the task loss, and the evaluation protocol together. A claim that holds for one specification therefore need not hold for another."

conditions_and_byproducts:
  precipitating: []
  inhibiting: []
  modulating:
    - name: "size of the training sample"
      reading: "The size of the training set selects which learning phase is reached, so the size can alter the delay, although in no universal monotone direction."
      effect: "depends_on(delay, card(train))"
  nonstandard: []
  byproducts: []

evidential_status: established

detection_criterion: null

data:
  - "liu2022: Empirical phase evidence across repeated seeds: https://proceedings.neurips.cc/paper_files/paper/2022/hash/dfc310e81992d2e4cedc09ac47eff13e-Abstract-Conference.html"
  - "humayun2024: Trajectories of delayed generalization across neural architectures and tasks: https://proceedings.mlr.press/v235/humayun24a.html"

maturity:
  manifestations.features.observed: open
