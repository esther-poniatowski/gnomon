title: "Convergence toward neural tangent dynamics"
statement: "As width increases in network families under neural tangent parameterization, the empirical kernel and the output trajectory approach the linearized dynamics governed by the initial kernel. Both quantities converge only under suitable assumptions on regularity and scaling."
id: phen.ntk.linearized-dynamics
type: phenomenon
status: provisional
target_system: system.ntk-gradient-flow

category: regularity

index_sets: []                   # the target already declares the training-example index and the time index

explanandum_variables:
  - name: "discrepancy between output trajectories"
    symbol: Eout
    signature: [m, t]
    values: "nonneg(reals)"
    expression: "norm_{a}(f(a, t) - flin(a, t))"
    reading: "The norm compares nonlinear and linearized outputs across the training examples."
  - name: "drift of the empirical kernel"
    symbol: Edrift
    signature: [m, t]
    values: "nonneg(reals)"
    expression: "norm_{a1, a2}(K(a1, a2, t) - K0(a1, a2))"
    reading: "The norm compares the empirical kernel during training with its initial value."
  - name: "discrepancy from the limiting kernel at initialization"
    symbol: Elimit
    signature: [m]
    values: "nonneg(reals)"
    expression: "norm_{a1, a2}(K0(a1, a2) - Kinf(a1, a2))"
    reading: "The norm compares the initial empirical kernel with its deterministic limit at infinite width."

manifestations:
  - name: "convergence of the network output to the linearized output"
    symbol: output_converges
    form: scaling
    expression: "max_{t <= Tout}(Eout(m, t)) <= Bout(m)"
    reading: "Over the stated training horizon, the nonlinear output trajectory stays within a bound that vanishes as width grows."
    features:
      - name: "finite-width bound on the discrepancy between output trajectories"
        symbol: Bout
        values: "maps(pos(ints), nonneg(reals))"
        observed: open
        condition: "limit_{m}(Bout(m)) = 0"
        selects: any
      - name: "training horizon for the bound on the outputs"
        symbol: Tout
        values: "pos(reals)"
        observed: open
      - name: "mode of convergence of the bound on the outputs over initialization draws"
        symbol: mode_out
        values: "enum(\"in-probability\", \"almost-sure\", \"mean-square\", \"in-distribution\")"
        observed: open
  - name: "vanishing drift of the empirical kernel"
    symbol: kernel_drift_vanishes
    form: scaling
    expression: "max_{t <= Tdrift}(Edrift(m, t)) <= Bdrift(m)"
    reading: "Over the stated training horizon, the empirical kernel stays within a bound that vanishes as width grows."
    features:
      - name: "finite-width bound on the drift of the empirical kernel"
        symbol: Bdrift
        values: "maps(pos(ints), nonneg(reals))"
        observed: open
        condition: "limit_{m}(Bdrift(m)) = 0"
        selects: any
      - name: "training horizon for the bound on the drift of the kernel"
        symbol: Tdrift
        values: "pos(reals)"
        observed: open
      - name: "mode of convergence of the bound on the drift of the kernel over initialization draws"
        symbol: mode_drift
        values: "enum(\"in-probability\", \"almost-sure\", \"mean-square\", \"in-distribution\")"
        observed: open
  - name: "vanishing distance to the limiting kernel"
    symbol: limit_error_vanishes
    form: scaling
    expression: "Elimit(m) <= Binit(m)"
    reading: "The initial empirical kernel stays within a bound that vanishes as width grows."
    features:
      - name: "finite-width bound on the discrepancy from the limiting kernel"
        symbol: Binit
        values: "maps(pos(ints), nonneg(reals))"
        observed: open
        condition: "limit_{m}(Binit(m)) = 0"
        selects: any
      - name: "mode of convergence of the initial kernel over initialization draws"
        symbol: mode_init
        values: "enum(\"in-probability\", \"almost-sure\", \"mean-square\", \"in-distribution\")"
        observed: open

scope_over_instances:
  - name: "specification of the network and its training, indexed by width"
    symbol: spec
    over: [X, y, L, sigma, eta, rho0]
    source: class-member
    quantification: open
    conditional_on: []
    differentiation: "The inquiry must establish the validity domain, so the record does not assert that every activation, dataset, and initialization family in the target class converges."
  - name: "initialization draw"
    symbol: init_draw
    over: [theta0]
    source: realization
    quantification: ensemble-distribution
    conditional_on: [spec, m]
    differentiation: "The width limit quantifies over the initialization distribution, so one sampled network cannot establish the claim."

conditions_and_byproducts:
  precipitating: []
  inhibiting: []
  modulating: []                # the manifestations already vary with the width; a modulating condition would restate that dependence
  nonstandard: []
  byproducts: []

evidential_status: derived

detection_criterion:
  - name: "uniform control of the output path on the stated horizon"
    across: [init_draw, spec]
    expression: "max_{t <= Tout}(Eout(m, t)) <= Bout(m)"
    procedure: "Under stated assumptions, the bound at finite width on the output path is derived and proved to vanish in the declared convergence mode."
  - name: "uniform control of the empirical kernel on the stated horizon"
    across: [init_draw, spec]
    expression: "max_{t <= Tdrift}(Edrift(m, t)) <= Bdrift(m)"
    procedure: "The bound at finite width on the drift of the empirical kernel is derived and proved to vanish in the declared convergence mode."
  - name: "convergence of the initial kernel"
    across: [init_draw, spec]
    expression: "Elimit(m) <= Binit(m)"
    procedure: "The bound at finite width on the distance between the initial kernel and its limit is derived and proved to vanish in the declared convergence mode."

data:
  - "jacot2018: https://papers.nips.cc/paper/2018/hash/5a4be1fa34e62bb8a6ec6b91d2462f5a-Abstract.html"
  - "lee2019: https://papers.nips.cc/paper_files/paper/2019/hash/0d1a9651497a38d8b1c3871c84528bd4-Abstract.html"
  - "chizat2019: https://papers.nips.cc/paper/8559-on-lazy-training-in-differentiable-programming.pdf"

maturity:
  manifestations.features.observed: open
  scope_over_instances.quantification: open
