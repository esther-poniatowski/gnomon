explanans:
  - name: "positive spectral gap of the limiting kernel"
    factor: condition
    holds: "min(re(spectrum(Kinf))) > 0"
    bears_on: [Kinf]
    through: [output_bound, kernel_bound]
    produces: output_converges
    separates: []
    appeals_to: []
    procedure: "The positive gap of the kernel makes the linearized risk contract. The gap also bounds the displacement of the parameters and closes the uniform perturbation estimate."
  - name: "bounded inputs and regular activation"
    factor: condition
    holds: "max_{a}(norm(X)) <= 1 and lipschitz(sigma) and lipschitz_derivative(sigma)"
    bears_on: [X, sigma]
    through: [initial_kernel_bound, kernel_bound, output_bound]
    produces: kernel_drift_vanishes
    separates: []
    appeals_to: []
    procedure: "The regularity bounds control the parameter Jacobian and its change inside the neighborhood of the initialization."
  - name: "independent initialization under neural tangent parameterization"
    factor: law-property
    holds: "drawn_from(theta0, rho0)"
    bears_on: [rho0, K0]
    through: [initial_kernel_bound]
    produces: limit_error_vanishes
    separates: []
    appeals_to: []
    procedure: "The initial parameter coordinates are drawn independently, so the empirical kernel at time zero concentrates around its deterministic limit as width grows."

