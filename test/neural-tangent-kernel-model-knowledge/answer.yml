  - name: "constant bounding the discrepancy between outputs"
    symbol: Cout
    signature: []
    values: "pos(reals)"
    reading: "The constant does not depend on width and is fixed by the training specification and the spectral gap of the limiting kernel."
  - name: "constant bounding the drift of the kernel"
    symbol: Cdrift
    signature: []
    values: "pos(reals)"
    reading: "The constant does not depend on width and enters the uniform estimate of the drift of the kernel."
  - name: "constant bounding the distance of the initial kernel to its limit"
    symbol: Cinit
    signature: []
    values: "pos(reals)"
    reading: "The constant does not depend on width and governs the concentration of the initial empirical kernel."
  - name: "finite-width bound on the discrepancy between outputs"
    symbol: Bout_ans
    notation: 'B_{\mathrm{out}}^{\mathrm{ans}}'
    signature: [m]
    values: "nonneg(reals)"
    condition: "m * Bout_ans(m) * Bout_ans(m) <= Cout * Cout"
    selects: any
    reading: "The value gives an upper bound of order m^(-1/2) on the discrepancy between the nonlinear and the linearized outputs."
  - name: "finite-width bound on the drift of the kernel"
    symbol: Bdrift_ans
    notation: 'B_{\mathrm{drift}}^{\mathrm{ans}}'
    signature: [m]
    values: "nonneg(reals)"
    condition: "m * Bdrift_ans(m) * Bdrift_ans(m) <= Cdrift * Cdrift"
    selects: any
    reading: "The value gives an upper bound of order m^(-1/2) on the drift of the empirical kernel."
  - name: "finite-width bound on the distance of the initial kernel to its limit"
    symbol: Binit_ans
    notation: 'B_{\mathrm{init}}^{\mathrm{ans}}'
    signature: [m]
    values: "nonneg(reals)"
    condition: "m * Binit_ans(m) * Binit_ans(m) <= Cinit * Cinit"
    selects: any
    reading: "The value gives a concentration bound of order m^(-1/2) for the initial empirical kernel."

laws:
  - name: "uniform bound on the deviation of the output from its linearization"
    symbol: output_bound
    signature: [m]
    role: state-constraint
    expression: "max_{t >= 0}(Eout(m, t)) <= Bout_ans(m)"
    reading: "With probability tending to one over initialization, the nonlinear output remains uniformly close to its linearization for all training times."
    warrant: derived
    rests_on: "The law rests on Theorem 2.1, https://papers.nips.cc/paper_files/paper/2019/hash/0d1a9651497a38d8b1c3871c84528bd4-Abstract.html [lee2019]."
  - name: "uniform bound on the drift of the empirical kernel"
    symbol: kernel_bound
    signature: [m]
    role: state-constraint
    expression: "max_{t >= 0}(Edrift(m, t)) <= Bdrift_ans(m)"
    reading: "With probability tending to one, the empirical neural tangent kernel moves by at most order m^(-1/2) throughout training."
    warrant: derived
    rests_on: "The law rests on the part of Theorem 2.1 that establishes the stability of the kernel [lee2019]."
  - name: "concentration of the initial kernel"
    symbol: initial_kernel_bound
    signature: [m]
    role: distribution
    expression: "Elimit(m) <= Binit_ans(m)"
    reading: "The empirical kernel at initialization converges in probability to the deterministic limiting kernel at order m^(-1/2)."
    warrant: derived-in-a-limit
    rests_on: "The law rests on a concentration result for the kernel at finite width that the theorem uses [lee2019]. The law also rests on the result that establishes the limiting kernel, https://papers.nips.cc/paper/2018/hash/5a4be1fa34e62bb8a6ec6b91d2462f5a-Abstract.html [jacot2018]."

