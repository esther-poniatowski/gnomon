title: "Validity domain of neural tangent dynamics"
statement: "At fixed depth, as width tends to infinity, under which assumptions do the empirical kernel and nonlinear trajectory approach their linearization at initialization? Which error bounds at finite width, and which training horizons, follow from the model?"
id: quest.ntk.linearized-dynamics-validity
type: question
status: posed
subject:
  target_system: system.ntk-gradient-flow
  phenomenon: phen.ntk.linearized-dynamics
  contrast:
    locus: none
    foil_set: []
    compatibility: derived
    foil_status: not-applicable
  domain:
    restrictions: []
    limit:
      expression: "m -> infinity"
      justification: "The limit varies width and holds every other specification fixed (the dataset size and values, the input dimension, the depth, the activation, the training rate). Bounds at finite width connect this limit to individual networks."

task:
  epistemic_aim: model-knowledge
  requested_relation: mathematical
  modal_strength: necessary
  admissible_explanans:
    compositional: null
    substrate: null
    justification: "The question asks for the implications of the model, so each consequence may involve any declared quantity. The question sets no bound, because a bound on the explanans excludes part of the model from its own consequences."
  required_accuracy:
    standard: not-applicable
    outputs_to_match: []
    structures_to_match: []
  proof_obligations:
    - name: "nonlinear path approaches its linearization"
      reading: "The assumptions must imply a bound at finite width on the discrepancy between output paths. The bound must hold over an explicit training horizon and vanish as width grows, in a stated mode of convergence."
      antecedent: [open]
      consequent: ["max_{t <= Tout}(Eout(m, t)) <= Bout(m)", "limit_{m}(Bout(m)) = 0"]
    - name: "empirical kernel remains near its initial value"
      reading: "The assumptions must imply a bound at finite width on the drift of the kernel. The bound must hold over an explicit training horizon and vanish as width grows, in a stated mode of convergence."
      antecedent: [open]
      consequent: ["max_{t <= Tdrift}(Edrift(m, t)) <= Bdrift(m)", "limit_{m}(Bdrift(m)) = 0"]
    - name: "initial empirical kernel approaches its deterministic limit"
      reading: "The assumptions must imply a bound at finite width on the distance between the initial kernel and its deterministic limit. The bound must vanish in the stated convergence mode."
      antecedent: [open]
      consequent: ["Elimit(m) <= Binit(m)", "limit_{m}(Binit(m)) = 0"]

virtues: []

maturity:
  task.proof_obligations.antecedent: open
