title: "Scale dependence of the distributions of velocity increments"
statement: "Ordered pairs of spatial locations in statistically stationary flow realizations have joint longitudinal and transverse velocity increments. The probability distribution of these increments varies with the magnitude and the orientation of the separation."
id: phen.turbulence.velocity-increment-distributions
type: phenomenon
status: provisional
target_system: system.turbulence-incompressible-navier-stokes

category: regularity

index_sets:
  - name: "magnitude of the separation"
    symbol: rmag
    notation: '\lvert r \rvert'
    extent: "pos(reals)"
    structure: continuum
  - name: "direction of the separation, a unit vector"
    symbol: rdir
    notation: '\hat{r}'
    extent: "subset(vectors(reals, 3), norm_one)"
    structure: continuum
  - name: "order of the structure function"
    symbol: p
    extent: "pos(reals)"
    structure: continuum

explanandum_variables:
  - name: "velocity increment across a separation"
    symbol: du
    notation: '\delta u'
    signature: [x, t, rmag, rdir]
    values: "vectors(reals, 3)"
    expression: "u(x + rmag * rdir, t) - u(x, t)"
    reading: "The value gives the velocity difference between two points at a given separation and direction."
  - name: "longitudinal increment"
    symbol: duL
    notation: '\delta u_L'
    signature: [x, t, rmag, rdir]
    values: reals
    expression: "dot(du, rdir)"
    reading: "The value is the component of the increment along the separation."
  - name: "transverse increment"
    symbol: duT
    notation: '\delta u_T'
    signature: [x, t, rmag, rdir]
    values: "nonneg(reals)"
    expression: "abs(du - duL * rdir)"
    reading: "The value is the magnitude of the component of the increment perpendicular to the separation."
  - name: "joint distribution of the increments"
    symbol: P
    signature: [rmag, rdir]
    values: "measures(prod(reals, nonneg(reals)))"
    expression: "dist_{x, t}( duL, duT )"
    reading: "The value is the joint law of the two increment components, taken over positions and times."
  - name: "longitudinal structure function"
    symbol: S
    signature: [p, rmag, rdir]
    values: "nonneg(reals)"
    expression: "mean_{x, t}( abs(duL)^p )"
    reading: "The value is the moment of order p of the longitudinal increment, averaged over positions and times."
  - name: "transverse structure function"
    symbol: ST
    notation: 'S_T'
    signature: [p, rmag, rdir]
    values: "nonneg(reals)"
    expression: "mean_{x, t}( duT^p )"
    reading: "The value is the moment of order p of the magnitude of the transverse increment, averaged over positions and times."

manifestations:
  - name: "power-law scaling of the longitudinal structure functions"
    symbol: anomalous_scaling
    form: scaling
    expression: "S ~ rmag^zetaL(p)"
    reading: "Each longitudinal moment follows a power of the separation, with an exponent that can depart from the self-similar value."
    features:
      - name: "longitudinal scaling exponents, one per order"
        symbol: zetaL
        notation: '\zeta_L'
        values: "maps(pos(reals), reals)"
        observed: open
        condition: "zetaL(4) != 4 / 3"
        selects: any
        procedure: "The slopes of the structure functions are estimated over the inertial range. The estimate must establish, within uncertainty, that the exponent of order four departs from the self-similar value."
        caveat: "The record declares no curvature operator, so the concavity that the measurements show is not written."
  - name: "power-law scaling of the transverse structure functions"
    symbol: transverse_scaling
    form: scaling
    expression: "ST ~ rmag^zetaT(p)"
    reading: "Each transverse moment follows a power of the separation, with its own exponent."
    features:
      - name: "transverse scaling exponents, one per order"
        symbol: zetaT
        notation: '\zeta_T'
        values: "maps(pos(reals), reals)"
        observed: open
        condition: "zetaT(4) != 4 / 3"
        selects: any
        procedure: "The slopes of the transverse structure functions are estimated over the inertial range. The estimate must establish, within uncertainty, that the exponent of order four departs from the self-similar value."
  - name: "disparity between longitudinal and transverse intermittency"
    symbol: increment_disparity
    form: relation
    expression: "zetaL != zetaT"
    reading: "The longitudinal and transverse exponent functions are not identical."
    features: []

scope_over_instances:
  - name: "flow realizations under one family of forcing and boundary conditions"
    symbol: realization
    over: []
    source: realization
    quantification: ensemble-distribution
    conditional_on: [family]
  - name: "admitted families of forcing and boundary conditions"
    symbol: family
    over: [f, b]
    source: class-member
    quantification: open
    conditional_on: []

conditions_and_byproducts:       # the case description asserts no additional condition
  precipitating:
    - name: "separation above the dissipation scale"
      expression: "rmag > etaK"
      justification: "At separations smaller than the dissipation scale, viscosity smooths the increments. The moments then follow the analytic prediction for a differentiable field and reflect no cascade."
    - name: "separation below the forcing scale"
      expression: "rmag < Lc"
      justification: "At separations larger than the forcing scale, the stirring of the flow sets the increments. The exponents at these separations then reflect the energy injection alone."
  inhibiting: []
  modulating: []                # the two precipitating conditions already fix the width of the scaling range
  nonstandard: []
  byproducts: []                # dissipative anomaly omitted: its expression needs an undeclared rate of viscous energy loss

evidential_status: established

detection_criterion: null

data:
  - "buaria2026: https://www.cambridge.org/core/journals/journal-of-fluid-mechanics/article/turbulence-intermittency-and-velocity-gradients/83110A5131F55CF9B890415703AA7770"

maturity:                        # exponent values and their universality not yet established
  manifestations.features.observed: open
  scope_over_instances.quantification: open
