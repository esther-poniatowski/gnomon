title: "Necessary constraints on anomalous scaling"
statement: "At Re -> ∞, which mathematical constraints of statistically stationary, three-dimensional, incompressible Navier–Stokes flow necessarily make the joint distribution of longitudinal and transverse increments depart from self-similarity? Which resulting relations and exponents remain invariant across admitted forcing and boundary families?"
id: quest.turbulence.anomalous-scaling-constraints
type: question
status: posed
subject:
  target_system: system.turbulence-incompressible-navier-stokes
  phenomenon: phen.turbulence.velocity-increment-distributions
  contrast:
    locus: other-outcome
    foil_set:
      - name: "self-similar scaling"
        symbol: self_similar
        expression: ["zetaL(p) = p / 3", "zetaT(p) = p / 3"]
        reading: "The foil takes the classical self-similar dependence of the distributions of velocity increments on scale."
      - name: "identical longitudinal and transverse intermittency"
        symbol: identical_scaling
        expression: ["zetaL = zetaT"]
        reading: "The foil gives longitudinal and transverse velocity increments identical scaling exponents."
    compatibility: derived
    foil_status: counterfactual
  domain:
    restrictions:
      - of: system.turbulence-incompressible-navier-stokes#u
        restriction: stationary
        values: "subset(maps(prod(Om, interval(reals)), vectors(reals, 3)), stationary)"
        justification: "The structure functions are means over positions and times, so a flow whose statistics still drift would mix two regimes in each mean."
    limit:
      expression: "Re -> infinity"
      justification: "The inertial range separates the injection scale from the dissipation scale only as the viscosity vanishes. The exponents are therefore defined on the *limit system*. The exponents are not properties of any single flow."

task:
  epistemic_aim: explanation
  requested_relation: mathematical
  modal_strength: necessary
  admissible_explanans:
    compositional: [system.turbulence-incompressible-navier-stokes#x]
    substrate: independent
    justification: "The exponents are claimed across forcing and boundary families, so an explanans built from the boundary data of one flow cannot answer the question. Variables resolved by position are admitted, because an increment is defined across a separation."
  required_accuracy:
    standard: numeric-bound
    outputs_to_match:
      - target: phen.turbulence.velocity-increment-distributions#zetaL
        tolerance:
          metric: "abs(answer - target)"
          bound: open            # reported uncertainty interval differs with the order p
        justification: "The departure of the longitudinal exponents from the self-similar line is part of the content of intermittency, and its size at each order separates competing accounts."
      - target: phen.turbulence.velocity-increment-distributions#zetaT
        tolerance:
          metric: "abs(answer - target)"
          bound: open            # reported uncertainty interval differs with the order p
        justification: "The transverse exponents and their difference from the longitudinal ones are needed to test whether an account explains both sectors."
    structures_to_match:
      - target: phen.turbulence.velocity-increment-distributions#P
        justification: "The exponents are the scaling exponents of the moments of the joint distribution, so an account that fixes them while predicting the wrong shape would reproduce the targets by construction."

virtues:
  - virtue: generality
    standing: preferred
    justification: "The question asks which results persist across forcing and boundary families, but it must still admit a correct answer that identifies a narrower domain of universality."
  - virtue: intelligibility
    standing: constitutive
    justification: "The question asks which constraints produce the departure from self-similarity. An account whose steps cannot be followed leaves unintelligible how that departure depends on the constraints, however accurate its exponents are."
  - virtue: structural-transparency
    standing: constitutive
    justification: "An account can reproduce the exponents and still hide the mechanism that produces the departure from self-similarity. The mechanism must therefore be shown."

maturity:
  task.required_accuracy.outputs_to_match.tolerance.bound: open
