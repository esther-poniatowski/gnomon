title: "Three-dimensional incompressible Navier–Stokes flows"
id: system.turbulence-incompressible-navier-stokes
type: target-system
status: provisional
commitment: specified
target_type: no-external-target

identification:
  description: "statistically stationary flows governed by the three-dimensional incompressible Navier–Stokes equations, under the admitted forcing and boundary families"
  pointers:
    - "buaria2026: https://www.cambridge.org/core/journals/journal-of-fluid-mechanics/article/turbulence-intermittency-and-velocity-gradients/83110A5131F55CF9B890415703AA7770"

reference_class:
  name: "Three-dimensional incompressible Navier–Stokes flows"
  projectibility:
    status: assumed
    evidence: "The record assumes that the statistics of the small-scale increments do not depend on the forcing family or on the boundary family. The question itself tests which parts of those statistics hold across the class."
  selection_criteria: []

constituents: []                 # an Eulerian field decomposes into no unit

index_sets:
  - name: "spatial location in the flow domain"
    symbol: x
    extent: Om
    structure: continuum
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:
  - name: "velocity field"
    symbol: u
    determined: within
    signature: [x, t]
    values: "vectors(reals, 3)"
    expression: null
    shared: false
  - name: "field of kinematic pressure"
    symbol: pr
    determined: within
    signature: [x, t]
    values: reals
    expression: null
    shared: false
  - name: "field of body force"
    symbol: f
    of: forcing
    determined: outside
    signature: [x, t]
    values: "vectors(reals, 3)"
  - name: "boundary data"
    symbol: b
    of: boundaryenv
    determined: outside
    signature: [x, t]
    values: "vectors(reals, 3)"

parameters:
  - name: "mean rate of energy injection by the forcing"
    symbol: eps
    notation: '\varepsilon'
    of: forcing
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "kinematic viscosity"
    symbol: nu
    notation: '\nu'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "characteristic velocity scale"
    symbol: U
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "characteristic length scale"
    symbol: Lc
    notation: 'L_c'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "Reynolds number"
    symbol: Re
    signature: []
    values: "pos(reals)"
    expression: "U * Lc / nu"
    reading: "The Reynolds number gives the ratio of inertial to viscous transport at the characteristic scales."
  - name: "Kolmogorov dissipation scale"
    symbol: etaK
    notation: '\eta_K'
    signature: []
    values: pos(reals)
    expression: "(nu^3 / eps)^(1/4)"
    reading: "At this scale, viscous dissipation balances the energy transferred down the cascade."
  - name: "flow domain"
    symbol: Om
    notation: '\Omega'
    signature: []
    values: "regions(vectors(reals, 3))"
    expression: null

external_systems:
  - name: "formal forcing process"
    symbol: forcing
    class:                       # only the constraint on the mean injection rate narrows the admitted forcing processes
    shares: [f]
    constrains:
      - name: "mean injection of energy"
        signature: []
        role: state-constraint
        expression: "mean_{x, t}( dot(f, u) ) = eps"
        reading: "The force does work on the flow at one rate, so a realization that injects more or less energy belongs to another family."
    reading: "The force sustains the flow at a fixed mean injection rate. The inertial range carries this rate down the cascade."
  - name: "formal environment at the boundary"
    symbol: boundaryenv
    class:                       # no boundary geometry declared to range over
    shares: [b]
    constrains: []               # none beyond the declared values of Om and b
    reading: "The boundary values are imposed from outside, so external data close the domain."

maturity:
  external_systems.class: open   # universality domain over the forcing and boundary families not yet established
