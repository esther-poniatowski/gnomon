title: "Three-dimensional incompressible Navier–Stokes flows"
id: system.turbulence-incompressible-navier-stokes
type: target-system
status: provisional
target_type: no-external-target

reference_class:
  name: "Three-dimensional incompressible Navier–Stokes flows"
  selection_criteria: []

constituents: []                 # an Eulerian field decomposes into no unit

index_sets:
  - name: "spatial location in the flow domain"
    symbol: x
    extent: Om
    structure: continuum
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:
  - name: "velocity field"
    symbol: u
    determined: within
    signature: [x, t]
    values: "vectors(reals, 3)"
    expression: null
    shared: false
  - name: "field of kinematic pressure"
    symbol: pr
    determined: within
    signature: [x, t]
    values: reals
    expression: null
    shared: false
  - name: "field of body force"
    symbol: f
    of: forcing
    determined: outside
    signature: [x, t]
    values: "vectors(reals, 3)"
  - name: "boundary data"
    symbol: b
    of: boundaryenv
    determined: outside
    signature: [x, t]
    values: "vectors(reals, 3)"

parameters:
  - name: "mean rate of energy injection by the forcing"
    symbol: eps
    notation: '\varepsilon'
    of: forcing
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "kinematic viscosity"
    symbol: nu
    notation: '\nu'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "characteristic velocity scale"
    symbol: U
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "characteristic length scale"
    symbol: Lc
    notation: 'L_c'
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "Reynolds number"
    symbol: Re
    signature: []
    values: "pos(reals)"
    expression: "U * Lc / nu"
    reading: "The Reynolds number gives the ratio of inertial to viscous transport at the characteristic scales."
  - name: "Kolmogorov dissipation scale"
    symbol: etaK
    notation: '\eta_K'
    signature: []
    values: pos(reals)
    expression: "(nu^3 / eps)^(1/4)"
    reading: "At this scale, viscous dissipation balances the energy transferred down the cascade."
  - name: "flow domain"
    symbol: Om
    notation: '\Omega'
    signature: []
    values: "regions(vectors(reals, 3))"
    expression: null

laws:
  - name: "incompressible momentum balance"
    symbol: momentum
    signature: [x]
    role: evolution
    expression: "diff(u, t) + dot(u, grad(u)) = - grad(pr) + nu * lap(u) + f"
    reading: "The velocity changes under its own advection, the pressure gradient, viscous diffusion, and the applied force."
    warrant: posited
    rests_on: "The law rests on the definition of the model class."
  - name: "incompressibility constraint"
    symbol: incompressible
    signature: [x]
    role: state-constraint
    expression: "div(u) = 0"
    reading: "The flow neither compresses nor expands any element of fluid."
    warrant: posited
    rests_on: "The law rests on the definition of the model class."
  - name: "pressure gauge"
    symbol: gauge
    signature: []
    role: state-constraint
    expression: "mean_{x}( pr ) = 0"
    reading: "The pressure is fixed only up to a constant, so its spatial mean is set to zero."
    warrant: posited
    rests_on: "The law rests on a gauge choice that fixes the pressure only up to a constant."
  - name: "boundary constraint"
    symbol: boundary_law
    signature: [x]
    role: state-constraint
    expression: "restrict(u, boundary(Om)) = b"
    reading: "The velocity on the boundary of the domain equals the prescribed data."
    warrant: posited
    rests_on: "The law rests on the boundary data that the environment supplies."

closure: complete                # the equations and the admitted inputs define the formal system

external_systems:
  - name: "formal forcing process"
    symbol: forcing
    class: open                  # only the constraint on the mean injection rate narrows the admitted forcing processes
    shares: [f]
    constrains:
      - name: "mean injection of energy"
        signature: []
        role: state-constraint
        expression: "mean_{x, t}( dot(f, u) ) = eps"
        reading: "The force does work on the flow at one rate, so a realization that injects more or less energy belongs to another family."
    reading: "The force sustains the flow at a fixed mean injection rate. The inertial range carries this rate down the cascade."
  - name: "formal environment at the boundary"
    symbol: boundaryenv
    class: open                  # no boundary geometry declared to range over
    shares: [b]
    constrains: []               # none beyond the declared values of Om and b
    reading: "The boundary values are imposed from outside, so external data close the domain."

maturity:
  external_systems.class: open   # universality domain over the forcing and boundary families not yet established
