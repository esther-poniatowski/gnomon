title: "Collective phases under nonreciprocal coupling"
statement: open                  # product of this inquiry
id: phen.nonreciprocal-active-matter.collective-phases
type: phenomenon
status: provisional
target_system: system.nonreciprocal-active-matter

category: open

index_sets:
  - name: "spatial separation"
    symbol: rsep
    notation: 'r'
    extent: "vectors(reals, d)"
    structure: continuum
  - name: "temporal lag"
    symbol: lag
    extent: "nonneg(reals)"
    structure: continuum
  - name: "wavevector"
    symbol: k
    extent: "vectors(reals, d)"
    structure: continuum
  - name: "frequency"
    symbol: omega
    notation: '\omega'
    extent: reals
    structure: continuum
  - name: "lattice displacement"
    symbol: rsite
    variant: lattice
    extent: "sites(d, L, bgeom)"
    structure: discrete-set
  - name: "lattice wavevector"
    symbol: klat
    variant: lattice
    extent: "sites(d, L, bgeom)"
    structure: discrete-set

explanandum_variables:           # candidate observables for an open search for phases
  - name: "correlation matrix between species"
    symbol: C
    variant: continuum
    signature: [sp, sp, rsep, lag]
    values: reals
    expression: "mean_{x, t}( u(sp, x, t) * u(sp, x + rsep, t + lag) )"
    reading: "The matrix correlates the species fields at a spatial separation and a temporal lag."
  - name: "spectral matrix between species"
    symbol: S
    variant: continuum
    signature: [sp, sp, k, omega]
    values: complex
    expression: "ft_{rsep, lag}( C )"
    reading: "The spectral matrix expresses the same correlation in wavevector and frequency."
  - name: "empirical distribution of the local field state of each species"
    symbol: rho_emp
    notation: '\hat{\rho}'
    variant: continuum
    signature: [sp]
    values: "measures(U(sp))"
    expression: "dist_{x, t}( u )"
    reading: "The variable gives the distribution of the local state of each species after positions and times are pooled."
  - name: "correlation matrix between species on the lattice"
    symbol: Cl
    notation: 'C_{\mathrm{lat}}'
    variant: lattice
    signature: [sp, sp, rsite, lag]
    values: reals
    expression: "mean_{q, t}( v(sp, q, t) * v(sp, q + rsite, t + lag) )"
    reading: "The matrix correlates the two lattice species at a site displacement and a temporal lag."
  - name: "spectral matrix between species on the lattice"
    symbol: Sl
    notation: 'S_{\mathrm{lat}}'
    variant: lattice
    signature: [sp, sp, klat, omega]
    values: complex
    expression: "ft_{rsite, lag}( Cl )"
    reading: "The spectrum expresses the lattice correlation in wavevector and frequency."
  - name: "empirical distribution of the lattice state of each species"
    symbol: rho_lat
    notation: '\hat{\rho}_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "measures(U(sp))"
    expression: "dist_{q, t}( v )"
    reading: "The variable gives the distribution of the local lattice state of each species after sites and times are pooled."
  - name: "diagnostic of phases for the continuum variant"
    symbol: diag
    variant: continuum
    signature: [L, d]
    values: open
    expression: open             # product of the inquiry
  - name: "diagnostic of phases for the lattice variant"
    symbol: diag_lattice
    variant: lattice
    signature: [L, d]
    values: open
    expression: open

manifestations:                  # phase catalogue is the sought product of the inquiry
  - name: "catalogue of distinguishable collective regimes"
    symbol: phase_catalogue
    variant: continuum
    form: open
    expression: open
    features:
      - name: "candidate collective phase"
        symbol: phase
        values: open
        observed: open
  - name: "catalogue of distinguishable lattice regimes"
    symbol: phase_catalogue_lattice
    variant: lattice
    form: open
    expression: open
    features:
      - name: "candidate collective phase on the lattice"
        symbol: phase_lattice
        values: open
        observed: open

scope_over_instances:            # distributions over sampled controls and realizations
  - name: "stochastic realizations at fixed controls"
    symbol: realization
    variant: continuum
    over: [W]
    source: realization
    quantification: ensemble-distribution
    conditional_on: [coupling, selfdyn]
  - name: "admitted nonreciprocal operators of cross-coupling"
    symbol: coupling
    variant: continuum
    over: [G]
    source: random-parameters
    quantification: ensemble-distribution
    conditional_on: []
  - name: "admitted self-dynamics, diffusion coefficients and noise laws"
    symbol: selfdyn
    variant: continuum
    over: [F, Q, D]
    source: random-parameters
    quantification: ensemble-distribution
    conditional_on: []
  - name: "stochastic realizations of the lattice at fixed controls"
    symbol: realization_lattice
    variant: lattice
    over: [Xi]
    source: realization
    quantification: ensemble-distribution
    conditional_on: [coupling_lattice, selfdyn_lattice]
  - name: "admitted nonreciprocal couplings on the lattice"
    symbol: coupling_lattice
    variant: lattice
    over: [Gl]
    source: random-parameters
    quantification: ensemble-distribution
    conditional_on: []
  - name: "admitted self-dynamics, diffusion coefficients and noise laws of the lattice"
    symbol: selfdyn_lattice
    variant: lattice
    over: [Fl, Ql, Dl]
    source: random-parameters
    quantification: ensemble-distribution
    conditional_on: []

conditions_and_byproducts:       # every swept control is an index or a source of variation, so the lists assert no effect
  precipitating: []
  inhibiting: []
  modulating: []
  nonstandard: []
  byproducts: []

evidential_status: open

detection_criterion:             # the phase-separating diagnostic is the product of the inquiry
  - name: "recurrence across realizations and windows"
    variant: continuum
    across: [realization]
    expression: open
    procedure: "A candidate regime recurs across stochastic realizations and persists over longer observation windows."
  - name: "separation in the sampled control space"
    variant: continuum
    across: [coupling, selfdyn]
    expression: open
    procedure: "The regime occupies a distinguishable region of the sampled control space."
  - name: "persistence in the thermodynamic limit"
    variant: continuum
    across: []
    expression: open
    procedure: "Finite-size scaling in L must show that the regime persists in the thermodynamic limit. Otherwise, the regime is labelled as absent from that limit."
  - name: "recurrence of lattice regimes across realizations and windows"
    variant: lattice
    across: [realization_lattice]
    expression: open
    procedure: "A candidate lattice regime recurs across stochastic realizations and persists over longer observation windows."
  - name: "separation of lattice regimes in the sampled control space"
    variant: lattice
    across: [coupling_lattice, selfdyn_lattice]
    expression: open
    procedure: "The lattice regime occupies a distinguishable region of the sampled control space."
  - name: "persistence of a lattice regime in the thermodynamic limit"
    variant: lattice
    across: []
    expression: open
    procedure: "Finite-size scaling in L separates a lattice phase that persists in the thermodynamic limit from a regime that vanishes as L grows."

data: []

maturity:                        # phase catalogue and its characterization remain the product of the inquiry
  statement: open
  category: open
  manifestations.form: open
  manifestations.expression: open
  manifestations.features.values: open
  manifestations.features.observed: open
  explanandum_variables.diag.values: open
  explanandum_variables.diag.expression: open
  explanandum_variables.diag_lattice.values: open
  explanandum_variables.diag_lattice.expression: open
  detection_criterion.expression: open
  evidential_status: open
