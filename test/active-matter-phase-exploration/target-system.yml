title: "Spatially extended stochastic systems of two species with nonreciprocal couplings"
id: system.nonreciprocal-active-matter
type: target-system
status: provisional
target_type: no-external-target

reference_class:
  name: "spatially extended stochastic models of two species with nonreciprocal cross-couplings"
  selection_criteria: []

variants:                        # continuum field and lattice realization; the two differ in their position index
  - name: "continuum field"
    symbol: continuum
    differentiation: "Position runs over a region of space, so the state is a field and the dynamics is a stochastic partial differential equation."
  - name: "lattice realization"
    symbol: lattice
    differentiation: "Position runs over the sites of a lattice, so the state is one variable per site."

constituents:
  - name: "species field"
    symbol: sp
    extent: "enum(\"A\", \"B\")"

index_sets:
  - name: "spatial position"
    symbol: x
    variant: continuum
    extent: "regions(vectors(reals, d), L, bgeom)"
    structure: continuum
  - name: "lattice site"
    symbol: q
    variant: lattice
    extent: "sites(d, L, bgeom)"
    structure: discrete-set
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:
  - name: "local state of a species field"
    symbol: u
    variant: continuum
    determined: within
    signature: [sp, x, t]
    values: "U(sp)"
    expression: null             # u declared directly, so no aggregate expression
    shared: false
  - name: "stochastic increment of a species field"
    symbol: W
    variant: continuum
    determined: within
    signature: [sp, x, t]
    values: "U(sp)"
  - name: "local state at a lattice site"
    symbol: v
    variant: lattice
    determined: within
    signature: [sp, q, t]
    values: "U(sp)"
    expression: null
    shared: false
  - name: "stochastic increment at a lattice site"
    symbol: Xi
    notation: '\Xi'
    variant: lattice
    determined: within
    signature: [sp, q, t]
    values: "U(sp)"

parameters:
  - name: "admitted local state space common to the two species"
    symbol: U
    signature: [sp]
    values: open
    expression: null
    shared: true
  - name: "spatial dimension"
    symbol: d
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "linear system size"
    symbol: L
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "periodic geometry of the boundary"
    symbol: bgeom
    notation: '\partial\Omega'
    signature: []
    values: "enum(\"periodic\")"
    expression: null
  - name: "operator of the local self-dynamics"
    symbol: F
    variant: continuum
    signature: [sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "linear operator of the cross-coupling"
    symbol: G
    variant: continuum
    signature: [sp, sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "diffusion coefficient of the continuum"
    symbol: D
    variant: continuum
    signature: [sp]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "distribution of the local noise"
    symbol: Q
    variant: continuum
    signature: [sp]
    values: "measures(U(sp))"
    expression: null
    shared: false
  - name: "operator of the lattice self-dynamics"
    symbol: Fl
    notation: 'F_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "linear operator of the lattice cross-coupling"
    symbol: Gl
    notation: 'G_{\mathrm{lat}}'
    variant: lattice
    signature: [sp, sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "diffusion coefficient on the lattice"
    symbol: Dl
    notation: 'D_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "noise law on the lattice"
    symbol: Ql
    notation: 'Q_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "measures(U(sp))"
    expression: null
    shared: false

laws:
  - name: "local stochastic evolution"
    symbol: evolve
    variant: continuum
    signature: [sp, x, t]
    role: evolution
    expression: "diff(u, t) = D * lap(u) + F(u) + G(u) + W"
    reading: "The field of each species diffuses in space and evolves under its own local dynamics. A noise term and the cross-coupling from the other species also drive the field."
    warrant: posited
    rests_on: "The definition of the model class posits this law."
  - name: "distribution of the local noise"
    symbol: noiselaw
    variant: continuum
    signature: [sp, x]
    role: distribution
    expression: "dist_{t}( W ) = Q"
    reading: "The stochastic increments are distributed according to the declared noise law."
    warrant: posited
    rests_on: "The class admits this noise law."
  - name: "nonreciprocity of the cross-coupling"
    symbol: nonrecip
    variant: continuum
    signature: [sp, sp]
    role: admissibility
    expression: "G != adjoint(G)"
    reading: "One species acts on the other differently than the other acts on it, so the coupling is nonreciprocal."
    warrant: posited
    rests_on: "The continuum variant is defined as a class with only nonreciprocal couplings."
  - name: "local stochastic evolution on the lattice"
    symbol: evolve_lattice
    variant: lattice
    signature: [sp, q, t]
    role: evolution
    expression: "diff(v, t) = Dl * lattice_lap(v) + Fl(v) + Gl(v) + Xi"
    reading: "Each lattice state diffuses between neighbouring sites and evolves under its local dynamics. Stochastic increments and the cross-coupling from the other species also drive the state."
    warrant: posited
    rests_on: "The definition of the lattice variant posits this law."
  - name: "distribution of the local noise on the lattice"
    symbol: noiselaw_lattice
    variant: lattice
    signature: [sp, q]
    role: distribution
    expression: "dist_{t}( Xi ) = Ql"
    reading: "The lattice increments follow the noise law declared for that variant."
    warrant: posited
    rests_on: "The lattice variant declares this noise law."
  - name: "nonreciprocity of the lattice cross-coupling"
    symbol: nonrecip_lattice
    variant: lattice
    signature: [sp, sp]
    role: admissibility
    expression: "Gl != adjoint(Gl)"
    reading: "The two directed lattice couplings are not reciprocal."
    warrant: posited
    rests_on: "The lattice variant is defined as a class with only nonreciprocal couplings."

closure: complete

organization:
  - name: "nonreciprocal cross-coupling"
    symbol: crosscoupling
    variant: continuum
    reading: "Each species field acts on the other. The nonreciprocity law forbids the two actions from being adjoint, so the pair of edges carries unequal weights in the two directions."
    relates: "prod(sp, sp)"
    realized_by: [evolve, nonrecip]
  - name: "nonreciprocal cross-coupling on the lattice"
    symbol: crosscoupling_lattice
    variant: lattice
    reading: "Each lattice species acts on the other through directed couplings, and the nonreciprocity law excludes their reciprocal equality."
    relates: "prod(sp, sp)"
    realized_by: [evolve_lattice, nonrecip_lattice]

external_systems: []

maturity:
  parameters.U.values: open       # ranges deliberately over scalar and vector order parameters
