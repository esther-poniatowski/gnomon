# Method: docs/epistemology/target-system.md. One file per target system.
# Symbols and expressions: docs/epistemology/symbols-and-expressions.md.
# The specifications appear in the order of the method note.

title: "Spatially extended two-species nonreciprocal stochastic systems"
id: system.nonreciprocal-active-matter
type: target-system
status: provisional              # provisional | stabilized | retracted
target_type: no-external-target  # particular | class-actual | class-possible | hypothetical | no-external-target | open

reference_class:                 # a name only: the specifications below generate the class, so they are not restated here
  name: "spatially extended two-species stochastic models with nonreciprocal cross-couplings"
  selection_criteria: []         # only when the specifications below do not fix membership

variants:                        # the class covers a continuum field and a lattice realization, whose position indices differ
  - name: "continuum field"
    symbol: continuum
    differentiation: "position runs over a region of space, so the state is a field and the dynamics is a stochastic partial differential equation"
  - name: "lattice realization"
    symbol: lattice
    differentiation: "position runs over the sites of a lattice, so the state is one variable per site"

constituents:
  - name: "species field"
    symbol: sp
    extent: "enum(\"A\", \"B\")"

index_sets:
  - name: "spatial position"
    symbol: x
    variant: continuum
    extent: "regions(vectors(reals, d), L, bgeom)"
    structure: continuum
  - name: "lattice site"
    symbol: q
    variant: lattice
    extent: "sites(d, L, bgeom)"
    structure: discrete-set
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:                       # quantities that vary while the phenomenon unfolds; the state space is the product of the value sets of the non-aggregate ones determined within
  - name: "local state of a species field"
    symbol: u
    variant: continuum
    determined: within
    signature: [sp, x, t]
    values: "U(sp)"
    expression: null             # a declared local state variable, not an aggregate
    shared: false
  - name: "stochastic increment of a species field"
    symbol: W
    variant: continuum
    determined: within
    signature: [sp, x, t]
    values: "U(sp)"
  - name: "local state at a lattice site"
    symbol: v
    variant: lattice
    determined: within
    signature: [sp, q, t]
    values: "U(sp)"
    expression: null
    shared: false
  - name: "stochastic increment at a lattice site"
    symbol: Xi
    notation: '\Xi'
    variant: lattice
    determined: within
    signature: [sp, q, t]
    values: "U(sp)"

parameters:                      # quantities held fixed while the phenomenon unfolds
  - name: "common admitted local state space of the two species"
    symbol: U
    signature: [sp]
    values: open
    expression: null
    shared: true
  - name: "spatial dimension"
    symbol: d
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "linear system size"
    symbol: L
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "periodic boundary geometry"
    symbol: bgeom
    notation: '\partial\Omega'
    signature: []
    values: "enum(\"periodic\")"
    expression: null
  - name: "local self-dynamics operator"
    symbol: F
    variant: continuum
    signature: [sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "linear cross-coupling operator"
    symbol: G
    variant: continuum
    signature: [sp, sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "continuum diffusion coefficient"
    symbol: D
    variant: continuum
    signature: [sp]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "local noise distribution"
    symbol: Q
    variant: continuum
    signature: [sp]
    values: "measures(U(sp))"
    expression: null
    shared: false
  - name: "lattice self-dynamics operator"
    symbol: Fl
    notation: 'F_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "linear lattice cross-coupling operator"
    symbol: Gl
    notation: 'G_{\mathrm{lat}}'
    variant: lattice
    signature: [sp, sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "lattice diffusion coefficient"
    symbol: Dl
    notation: 'D_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "lattice noise law"
    symbol: Ql
    notation: 'Q_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "measures(U(sp))"
    expression: null
    shared: false

laws:                            # the behaviors of the components or of the system that are admitted a priori
  - name: "local stochastic evolution"
    symbol: evolve
    variant: continuum
    signature: [sp, x, t]
    role: evolution
    expression: "diff(u, t) = D * lap(u) + F(u) + G(u) + W"
    reading: "each species field evolves under spatial diffusion, its own local dynamics, the coupling from the other species and noise"
    warrant: posited
    rests_on: "the definition of the model class"
  - name: "local noise distribution"
    symbol: noiselaw
    variant: continuum
    signature: [sp, x]
    role: distribution
    expression: "dist_{t}( W ) = Q"
    reading: "the stochastic increments are distributed according to the declared noise law"
    warrant: posited
    rests_on: "the noise law the class admits"
  - name: "nonreciprocity of the cross-coupling"
    symbol: nonrecip
    variant: continuum
    signature: [sp, sp]
    role: admissibility
    expression: "G != adjoint(G)"
    reading: "the action of one species on the other differs from the reciprocal action, so the coupling is nonreciprocal"
    warrant: posited
    rests_on: "the definition of the continuum variant as a class with only nonreciprocal couplings"
  - name: "local stochastic lattice evolution"
    symbol: evolve_lattice
    variant: lattice
    signature: [sp, q, t]
    role: evolution
    expression: "diff(v, t) = Dl * lattice_lap(v) + Fl(v) + Gl(v) + Xi"
    reading: "each lattice state evolves under nearest-site diffusion, local dynamics, coupling from the other species and stochastic increments"
    warrant: posited
    rests_on: "the definition of the lattice variant"
  - name: "local lattice noise distribution"
    symbol: noiselaw_lattice
    variant: lattice
    signature: [sp, q]
    role: distribution
    expression: "dist_{t}( Xi ) = Ql"
    reading: "the lattice increments are distributed according to the declared lattice noise law"
    warrant: posited
    rests_on: "the noise law of the lattice variant"
  - name: "nonreciprocity of the lattice cross-coupling"
    symbol: nonrecip_lattice
    variant: lattice
    signature: [sp, sp]
    role: admissibility
    expression: "Gl != adjoint(Gl)"
    reading: "the two directed lattice couplings are not reciprocal"
    warrant: posited
    rests_on: "the definition of the lattice variant as a class with only nonreciprocal couplings"

closure: complete                # complete (formal target: the laws define the system) | partial (empirical target) | open

organization:
  - name: "nonreciprocal cross-coupling"
    symbol: crosscoupling
    variant: continuum
    reading: "each species field acts on the other, and the second law denies that the two actions are adjoint, so the pair of edges carries unequal weights in the two directions"
    relates: "prod(sp, sp)"
    realized_by: [evolve, nonrecip]
  - name: "nonreciprocal lattice cross-coupling"
    symbol: crosscoupling_lattice
    variant: lattice
    reading: "each lattice species acts on the other through directed couplings whose reciprocal equality is excluded"
    relates: "prod(sp, sp)"
    realized_by: [evolve_lattice, nonrecip_lattice]

external_systems: []

maturity:
  parameters.U.values: open       # the inquiry deliberately ranges over scalar and vector order parameters
