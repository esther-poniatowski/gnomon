title: "Spatially extended stochastic systems of two species with nonreciprocal couplings"
id: system.nonreciprocal-active-matter
type: target-system
status: provisional
commitment: specified
target_type: no-external-target

identification:
  description: "the class of spatially extended stochastic dynamics of two species whose mutual couplings violate reciprocity, in a continuum formulation by stochastic field equations and in a lattice formulation"
  pointers:
    - "fruchart2021: https://www.nature.com/articles/s41586-021-03375-9"

reference_class:
  name: "spatially extended stochastic models of two species with nonreciprocal cross-couplings"
  projectibility:
    status: not-claimed
  selection_criteria: []

variants:                        # continuum field and lattice realization; the two differ in their position index
  - name: "continuum field"
    symbol: continuum
    differentiation: "Position runs over a region of space, so the state is a field and the dynamics is a stochastic partial differential equation."
  - name: "lattice realization"
    symbol: lattice
    differentiation: "Position runs over the sites of a lattice, so the state is one variable per site."

constituents:
  - name: "species field"
    symbol: sp
    extent: "enum(\"A\", \"B\")"

index_sets:
  - name: "spatial position"
    symbol: x
    variant: continuum
    extent: "regions(vectors(reals, d), L, bgeom)"
    structure: continuum
  - name: "lattice site"
    symbol: q
    variant: lattice
    extent: "sites(d, L, bgeom)"
    structure: discrete-set
  - name: "time"
    symbol: t
    extent: "interval(reals)"
    structure: interval

variables:
  - name: "local state of a species field"
    symbol: u
    variant: continuum
    determined: within
    signature: [sp, x, t]
    values: "U(sp)"
    expression: null             # u declared directly, so no aggregate expression
    shared: false
  - name: "stochastic increment of a species field"
    symbol: W
    variant: continuum
    determined: within
    signature: [sp, x, t]
    values: "U(sp)"
  - name: "local state at a lattice site"
    symbol: v
    variant: lattice
    determined: within
    signature: [sp, q, t]
    values: "U(sp)"
    expression: null
    shared: false
  - name: "stochastic increment at a lattice site"
    symbol: Xi
    notation: '\Xi'
    variant: lattice
    determined: within
    signature: [sp, q, t]
    values: "U(sp)"

parameters:
  - name: "admitted local state space common to the two species"
    symbol: U
    signature: [sp]
    values:
    expression: null
    shared: true
  - name: "spatial dimension"
    symbol: d
    signature: []
    values: "pos(ints)"
    expression: null
  - name: "linear system size"
    symbol: L
    signature: []
    values: "pos(reals)"
    expression: null
  - name: "periodic geometry of the boundary"
    symbol: bgeom
    notation: '\partial\Omega'
    signature: []
    values: "enum(\"periodic\")"
    expression: null
  - name: "operator of the local self-dynamics"
    symbol: F
    variant: continuum
    signature: [sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "linear operator of the cross-coupling"
    symbol: G
    variant: continuum
    signature: [sp, sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "diffusion coefficient of the continuum"
    symbol: D
    variant: continuum
    signature: [sp]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "distribution of the local noise"
    symbol: Q
    variant: continuum
    signature: [sp]
    values: "measures(U(sp))"
    expression: null
    shared: false
  - name: "operator of the lattice self-dynamics"
    symbol: Fl
    notation: 'F_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "linear operator of the lattice cross-coupling"
    symbol: Gl
    notation: 'G_{\mathrm{lat}}'
    variant: lattice
    signature: [sp, sp]
    values: "maps(U(sp), U(sp))"
    expression: null
    shared: false
  - name: "diffusion coefficient on the lattice"
    symbol: Dl
    notation: 'D_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "pos(reals)"
    expression: null
    shared: false
  - name: "noise law on the lattice"
    symbol: Ql
    notation: 'Q_{\mathrm{lat}}'
    variant: lattice
    signature: [sp]
    values: "measures(U(sp))"
    expression: null
    shared: false

external_systems: []

maturity:
  parameters.U.values: open       # ranges deliberately over scalar and vector order parameters
