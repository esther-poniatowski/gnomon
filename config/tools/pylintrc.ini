# ==================================================================================================
# Pylint Configurations for gnomon Package
#
# File: `config/tools/pylintrc.ini`
#
# Usage
# -----
# From the terminal, pass this configuration file to the Pylint linter:
#
# ```sh
# pylint --rcfile=config/tools/pylintrc.ini src/
# ```
#
# In VS Code `settings.json` file, pass the configuration file to the Pylint extension:
#
# ```json
# {
#   "pylint.args": ["--rcfile=${workspaceFolder}/config/tools/pylintrc.ini"],
# }
# ```
#
# Notes
# -----
# Configuration file:
#
# - Pylint supports various configurations files, including `pylintrc` (INI-format), `pylintrc.ini`
#   in the current working directory and `pyproject.toml`.
# - The current file uses the INI format and adds the extension `.ini` for clarity. It is explicitly
#   located in a dedicated `config/tools/` directory to decouple tool configuration from build or
#   packaging metadata.
#
# Scope:
#
# Pylint checks the package, `src/`. Ruff and MyPy check the tests as well; the rules of Pylint that
# remain, such as the docstring of each function, contradict the idioms of pytest.
#
# Rules:
#
# Every message is enabled, except those whose concern another tool of the project owns, so that
# one finding is reported once:
#
# - Black and Ruff own the layout and the imports: the length of lines, the whitespace, the order
#   of the imports and the unused imports.
# - MyPy, in strict mode, owns the types: the members, the subscripts and the calls of a value.
#   The inference of Pylint reports such errors on values that a guard has narrowed.
# - The code compares a count to zero explicitly, which `use-implicit-booleaness-*` contradicts.
#
# A module-level name is part of the interface of its module, so `allow-global-unused-variables`
# admits a name that the module itself does not use. Black chooses the quotes of each string, so
# `check-quote-consistency` is off.
#
# The limits of size and complexity keep the defaults of Pylint, and the package stays within
# them. Any exception is a pragma on its own line, which states its reason.
#
# See Also
# --------
# - [Pylint Documentation](https://pylint.pycqa.org/en/latest/user_guide/run.html#command-line-options)
# - [User Manual](https://docs.pylint.org/)
# ==================================================================================================

[MASTER]
ignore-paths=config,
ignore-patterns=.*conf.*,.*\.ipynb$

[MESSAGES CONTROL]
enable=all
disable=locally-disabled,
        suppressed-message,
        # layout and imports, owned by Black and Ruff
        line-too-long,
        trailing-whitespace,
        missing-final-newline,
        trailing-newlines,
        wrong-import-order,
        ungrouped-imports,
        wrong-import-position,
        unused-import,
        # types, owned by MyPy
        no-member,
        not-callable,
        unsubscriptable-object,
        unsupported-membership-test,
        unsupported-assignment-operation,
        unsupported-delete-operation,
        # explicit comparison of a count to zero
        use-implicit-booleaness-not-comparison-to-zero

[BASIC]
no-docstring-rgx=__.*__
docstring-min-length=2
good-names=_
good-names-rgxs=^[a-zA-Z]$
bad-names=id,
          min,
          max,
          sum,
          apply,
          filter,
          input,
          map,
          raw_input,
          reduce

[VARIABLES]
init-import=yes
allow-global-unused-variables=yes

[FORMAT]
max-line-length=100
ignore-long-lines=^\s*(# )?<?https?://\S+>?

[STRING]
check-quote-consistency=no

[CLASSES]
defining-attr-methods=__init__,__new__
valid-classmethod-first-arg=cls
valid-metaclass-classmethod-first-arg=mcs
exclude-protected=
check-protected-access-in-special-methods=no

[SIMILARITIES]
min-similarity-lines=4
ignore-comments=no
ignore-docstrings=no
ignore-signatures=yes

[TYPECHECK]
ignored-modules=
mixin-class-rgx=.*MixIn.*
