      - data
    output: verdict
    norm: norm.inference-to-the-best-explanation
    mode: abductive
    context: justification
  - id: critique
    family: evaluation
    inputs:
      - {types: [hypothesis, model]}
    output: verdict
    norm: norm.critique
    mode: non-inferential
    context: justification
  - id: admissibility-check
    family: evaluation
    inputs:
      - {types: [hypothesis, model]}
      - question
    output: verdict
    norm: norm.admissibility-check
    mode: non-inferential
    context: justification
  - id: explanation
    family: explanation-and-integration
    inputs:
      - phenomenon
      - model
      - question
    output: explanation
    norm: norm.explanation
    mode: deductive
    context: justification
  - id: unification
    family: explanation-and-integration
    inputs:
      - {type: explanation, several: true}
    output: inter-theory-relation
    norm: norm.unification
    mode: deductive
    context: both
  - id: reduction
    family: explanation-and-integration
    inputs:
      - {type: model, count: 2, role: theories}
    output: inter-theory-relation
    norm: norm.reduction
    mode: deductive
    context: justification
  - id: integration
    family: explanation-and-integration
    inputs:
      - {type: model, several: true, role: fields or levels}
    output: inter-theory-relation
    norm: norm.integration
    mode: non-inferential
    context: both
  - id: belief-revision
    family: revision
    inputs:
      - {types: [verdict, credence, ranking]}
    output: knowledge-state-change
    norm: norm.belief-revision
    mode: non-inferential
    context: justification
  - id: theory-change
    family: revision
    inputs:
      - {type: verdict, several: true}
    output: knowledge-state-change
    norm: norm.theory-change
    mode: non-inferential
    context: justification
  - id: framework-revision
    family: revision
    inputs:
      - {type: verdict, several: true}
    output: knowledge-state-change
    norm: norm.framework-revision
    mode: non-inferential
    context: both
