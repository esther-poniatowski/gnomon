# Registry of the types of epistemic product: the closed list of the inputs and the outputs of
# the epistemic activities. The itinerary check reads this registry, and the overview of the activity
# taxonomy owns the list (`docs/epistemology/processes/activities/epistemic-activities.md`).
#
# The list derives from the taxonomy, not from the records of the framework. When no record kind
# holds a type yet, the type stays in the list, marked `to-create`, so that the records are
# extended to match it.
#
# Each entry states its class, as the inventory of epistemic objects sorts the types
# (docs/epistemology/objects/status/epistemic-objects.md): `claim`, `construct`, `evaluative`,
# `unclassed` (a type not yet classed), or `other`.
# Each entry names the record kinds that hold a product of the type, and, under `fields`, the
# fields that hold it when only a part of a record does: a list for every listed kind, or a mapping
# from a kind to its list. A field path writes `[]` after a list and may end in `=value`, so that
# `laws[].warrant=derived` reads a law marked derived. A record holds the type only when one of its
# fields is filled. Its status states how far the records cover the type:
#   - `exists`: a record kind holds the type in full;
#   - `partial`: a record holds part of the type, and the condition names the missing part;
#   - `to-create`: no record kind holds the type, so an itinerary reaches it only as the output of a step.
# `record: external pointer` marks a type held outside the records and reached by a pointer.
# A `when` mapping states the state in which a record of a listed kind holds the type:
#   - `commitment`: the admitted levels of commitment of the record;
#   - `form`: `schema` when some subject slot of a question holds a placeholder or its request is
#     not fixed, `question` when every slot names a record and the request is fixed;
#   - `status`: the admitted statuses of the record.
# The itinerary check computes the type of a referenced record from its kind, its state and its
# fields. A `note` states in words, for a reader, what the fields hold and what they still lack.

id: registry.product-types
type: product-type-registry

product_types:
  - id: source
    class: other
    record: external pointer
    status: exists
    note: "A pointer to an existing note, publication, model, data set or observation, held by the sources of a problem or question and the pointers of an identification."
  - id: problem
    class: other
    record: [problem]
    status: exists
  - id: question-schema
    class: other
    record: [question]
    when: {form: schema}
    status: exists
  - id: question
    class: other
    record: [question]
    when: {form: question}
    status: exists
  - id: identified-subject
    class: unclassed
    record: [target-system, phenomenon]
    when: {commitment: [identified, specified]}
    status: exists
  - id: concept
    class: construct
    record: [concept]
    status: exists
  - id: classification
    class: construct
    record: [target-system]
    fields: [reference_class]
    status: exists
  - id: measurement-procedure
    class: construct
    record: [target-system]
    fields: ["variables[].scale", "variables[].expression"]
    status: partial
    note: "The scale and the defining expression of a quantity; the procedure that assigns its values has no field."
  - id: design
    class: construct
    record: [design]
    status: exists
  - id: data
    class: unclassed
    record: [phenomenon]
    fields: [data]
    status: partial
    note: "Pointers to the data that establish the phenomenon; the data themselves stay outside the records."
  - id: phenomenon
    class: unclassed
    record: [phenomenon]
    status: exists
  - id: target-specification
    class: construct
    record: [target-system]
    when: {commitment: [specified]}
    status: exists
  - id: admitted-laws
    class: unclassed
    record: [background]
    status: exists
  - id: model
    class: construct
    record: [model]
    status: exists
  - id: binding
    class: unclassed
    record: [binding]
    status: exists
  - id: key
    class: construct
    record: [key]
    status: exists
  - id: consequence
    class: claim
    record: [answer, assessment, model, background]
    fields:
      answer: [aim_block.model_properties]
      assessment: [obligations]
      model: ["laws[].warrant=derived"]
      background: ["laws[].warrant=derived"]
    status: exists
    note: "The consequence or the counterexample that the block of model properties of an answer states, a settled proof obligation, or a law that a model or a background marks derived."
  - id: target-claim
    class: claim
    record: [answer]
    status: exists
  - id: verdict
    class: evaluative
    record: [assessment]
    fields: [tests]
    status: exists
  - id: credence
    class: evaluative
    record: [assessment]
    fields: [credence]
    status: exists
  - id: ranking
    class: evaluative
    record: [assessment]
    fields: ["appraisal[].preferred_over"]
    status: exists
  - id: explanation
    class: claim
    record: [answer]
    fields: [aim_block.explanation]
    status: exists
    note: "An answer whose block of an explanation reads named dependences of its core as explanatory, by the requested relation."
  - id: inter-theory-relation
    class: claim
    record: to-create
    status: to-create
  - id: knowledge-state-change
    class: other
    record: [problem, question, answer, assessment, target-system, phenomenon, background, model, binding, key]
    fields: [status]
    status: partial
    note: "A change of the status of a record, which the itinerary check reads as a difference between the status at the revision before the step and the present status."
