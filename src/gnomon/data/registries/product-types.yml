# Registry of the types of epistemic product: the closed list of the inputs and the outputs of
# the epistemic activities. The itinerary check reads this registry, and the overview of the activity
# taxonomy documents the list (`docs/epistemology/activities/epistemic-activities.md`).
#
# The list derives from the taxonomy, not from the records of the framework. When no record kind
# holds a type yet, the type stays in the list, marked `to-create`, so that the records are
# extended to match it.
#
# Each entry names the record kinds that hold a product of the type, and the field that holds it
# when only a part of a record does. Its status states how far the records cover the type:
#   - `exists`: a record kind holds the type in full;
#   - `partial`: a record holds part of the type, and the condition names the missing part;
#   - `to-create`: no record kind holds the type, so an itinerary reaches it only as the output of a step.
# `record: external pointer` marks a type held outside the records and reached by a pointer.
# A `when` mapping states the state in which a record of a listed kind holds the type:
#   - `commitment`: the admitted levels of commitment of the record;
#   - `slots`: `placeholder` when some subject slot of a question holds a placeholder, `identified`
#     when every slot names a record;
#   - `status`: the admitted statuses of the record.
# The itinerary check computes the type of a referenced record from its kind and its state. A
# `condition` states in words the part of the type that the fields of a record hold.

id: registry.product-types
type: product-type-registry

product_types:
  - id: source
    record: external pointer
    status: exists
    condition: "A pointer to a publication, a data set or an observation, held by the sources of a problem and the pointers of an identification."
  - id: problem
    record: [problem]
    status: exists
  - id: question-schema
    record: [question]
    when: {slots: placeholder}
    status: exists
  - id: question
    record: [question]
    when: {slots: identified}
    status: exists
  - id: identified-subject
    record: [target-system, phenomenon]
    when: {commitment: [identified, specified]}
    status: exists
  - id: concept
    record: to-create
    status: to-create
  - id: classification
    record: [target-system]
    field_path: reference_class
    status: exists
  - id: measurement-procedure
    record: [target-system]
    field_path: "variables[].scale, variables[].expression"
    status: partial
    condition: "The scale and the defining expression of a quantity; the procedure that assigns its values has no field."
  - id: design
    record: to-create
    status: to-create
  - id: data
    record: [phenomenon]
    field_path: data
    status: partial
    condition: "Pointers to the data that establish the phenomenon; the data themselves stay outside the records."
  - id: phenomenon
    record: [phenomenon]
    status: exists
  - id: target-specification
    record: [target-system]
    when: {commitment: [specified]}
    status: exists
  - id: background-model
    record: [background]
    status: exists
  - id: model
    record: [model]
    status: exists
  - id: binding
    record: [binding]
    status: exists
  - id: key
    record: [key]
    status: exists
  - id: consequence
    record: [answer, assessment]
    field_path: "answer: aim_block.model_knowledge; assessment: obligations"
    status: partial
    condition: "The consequence or the counterexample that the block of model knowledge of an answer states, or a settled proof obligation. A consequence derived on the way to another result, and stated by no answer, has no record."
  - id: hypothesis
    record: [answer]
    when: {status: [hypothesized]}
    status: exists
  - id: verdict
    record: [assessment]
    field_path: tests
    status: exists
  - id: credence
    record: [assessment]
    field_path: credence
    status: exists
  - id: ranking
    record: [assessment]
    field_path: "appraisal[].preferred_over"
    status: exists
  - id: explanation
    record: [answer]
    field_path: aim_block.explanation
    status: exists
    condition: "An answer whose block of an explanation reads named dependences of its core as explanatory, by the requested relation."
  - id: inter-theory-relation
    record: to-create
    status: to-create
  - id: knowledge-state-change
    record: [problem, question, answer, assessment, target-system, phenomenon, background, model, binding, key]
    field_path: status
    status: partial
    condition: "A change of the status of a record. A log of the revisions, with their grounds, is still to be created."
