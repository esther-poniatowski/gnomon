# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/views/maturity.schema.yml
title: Maturity of each record
description: 'Generated by `gnomon views`: the maturity of each marked field, and the default of each
  record. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- fields
properties:
  _schema:
    const: gnomon:view.maturity@1
    title: Schema
  id:
    const: view.maturity
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  fields:
    type: array
    x-kind: table
    title: Fields
    description: per record and field, its maturity; the row `(default)` gives the maturity of the unmarked
      fields
    items:
      type: object
      additionalProperties: false
      required:
      - record
      - field
      - maturity
      properties:
        record:
          type: string
          x-kind: label
          title: Record
        field:
          type: string
          x-kind: label
          title: Field
        maturity:
          type: string
          x-kind: label
          title: Maturity
