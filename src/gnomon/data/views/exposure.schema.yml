# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/views/exposure.schema.yml
title: Exposure of each answer to revisable laws
description: 'Generated by `gnomon views`: the laws marked posited, fitted or measured among the grounds
  of each answer, and the posits, the warrants and the operations through which a derivation cited by
  the answer exposes it, and the undischarged presuppositions of its claim. A view is computed from the
  records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- exposures
properties:
  _schema:
    const: gnomon:view.exposure@1
    title: Schema
  id:
    const: view.exposure
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  exposures:
    type: array
    x-kind: table
    title: Exposures
    description: per answer, each law of its grounds that exposes it, its warrant, and whether it exposes
      it directly or through a descent not yet recorded; then each unit of a cited derivation that exposes
      it, with its reason and the derivation through which it does
    items:
      type: object
      additionalProperties: false
      required:
      - answer
      - law
      - warrant
      - via
      properties:
        answer:
          type: string
          x-kind: label
          title: Answer
        law:
          type: string
          x-kind: label
          title: Law
        warrant:
          type: string
          x-kind: label
          title: Warrant
        via:
          type: string
          title: Via
