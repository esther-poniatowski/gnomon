# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/views/question-tree.schema.yml
title: Question tree
description: 'Generated by `gnomon views`: the problems, the questions, the answers, the assessments and
  the designs of a project, as nodes and edges. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- nodes
- edges
properties:
  _schema:
    const: gnomon:view.question-tree@1
    title: Schema
  id:
    const: view.question-tree
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  nodes:
    type: array
    x-kind: table
    title: Nodes
    description: per record of the tree, its kind, title, status and depth
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - title
      - status
      - depth
      properties:
        id:
          type: string
          x-kind: label
          title: Identifier
        kind:
          type: string
          x-kind: label
          title: Kind
        title:
          type: string
          title: Title
        status:
          type: string
          x-kind: label
          title: Status
        depth:
          type: integer
          title: Depth
  edges:
    type: array
    x-kind: table
    title: Edges
    description: each record governed by another, for a renderer of trees
    items:
      type: object
      additionalProperties: false
      required:
      - parent
      - child
      properties:
        parent:
          type: string
          x-kind: label
          title: Parent
        child:
          type: string
          x-kind: label
          title: Child
