      name: the formula of the first argument
    - value: product
      name: the sum of the exponents of the arguments
    - value: derivative
      name: the first argument divided by the second
    - value: second-derivative
      name: the first argument divided by the square of the second
    - value: derivative-at
      name: the first argument divided by the second, at a point of the formula of the second
