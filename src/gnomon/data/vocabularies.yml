      name: the formula of the result stays undecided, as a declared waiver
  problem:
    .status:
    - value: posed
      name: the demand and constraints are stated, and no constraint has changed since
    - value: refined
      name: constraints were added or revised since the problem was stated
    - value: solved
      name: the records show that the demand is met
    - value: dissolved
      name: accepted knowledge denies a presupposition of the associated question
    - value: abandoned
      name: the researcher stops the inquiry with the problem still standing
    .kind:
    - value: empirical
      name: the problem concerns the objects of a domain
    - value: conceptual
      name: the problem concerns the consistency of a theory or its fit with other theories
    .result_type:
    - value: phenomenon
      name: a behavior of the target, detected from data
      admits: [exploration, description]
    - value: consequence
      name: a statement derived from a model or from admitted laws
      admits: [model-properties, modal-knowledge]
    - value: target-claim
      name: a claim about the target, as opposed to a model
      admits: [prediction, modal-knowledge]
    - value: model
      name: a candidate representation of the target
      admits: [description, explanation]
    - value: explanation
      name: named factors account for a phenomenon by the requested relation
      admits: [explanation]
    - value: classification
      name: a partition of systems into classes, with its criteria
      admits: [exploration, description]
    - value: concept
      name: a term with its definition or its explication
      admits: [explication]
    - value: measurement-procedure
      name: a procedure assigning values to a quantity on a stated scale
      admits: [explication]
    - value: design
      name: a plan of observations or runs, a method or a scheme
