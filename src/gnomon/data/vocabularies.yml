# The closed vocabularies of the inquiry records, keyed by the block that encloses each field
# and the field itself. A key opening with a dot names a field of the record itself.
#
# Source of truth for the checkers. A closed field holds one of its listed values, or stays empty
# while it is not filled. The requirement registry decides whether an empty field is a gap.
# A key repeats across blocks only where it carries the same vocabulary. The template comments
# document these vocabularies and are checked against this file, so no check reads a document.
# A value is admitted for a distinction that the assertions of the records draw, not for the
# needs of the first cases: a value that absorbs most entries draws no distinction, and hides
# the claims of the entries that it labels.
#
# Each epistemic aim of a question also states its category, a token compared with the note on
# epistemic aims (`docs/epistemology/objects/task/epistemic-aim.md`), which owns the answer conditions of
# each aim. The category of an exploration depends on the origin of its equivalence criterion, so
# it is keyed by that origin.
# The kind `comparison` has no template: a comparison is computed from a binding, and its
# vocabulary lists the values of the calibration treatment that the computation reports.

