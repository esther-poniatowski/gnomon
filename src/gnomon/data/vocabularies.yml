    - value: property
      name: a feature that a bearer possesses, represented or not
    - value: process
      name: a change along a course, holding over segments, never at a point
  design:
    .status:
    - value: provisional
      name: the record is written and still under revision
    - value: stabilized
      name: the inquiry expects no further revision of the record
    - value: retracted
      name: the record is withdrawn, with all its specifications
    .kind:
    - value: experiment
