# The closed vocabularies of the inquiry records. A key names the top-level block of a record and
# the field, as `laws.role`; when two fields of one block share a name, the key adds the field that
# encloses each of them, as `posits.kind` and `posits.origin.kind`. A key opening with a dot names a
# field of the record itself. The key only names the vocabulary: the base schema of each record type
# binds a closed field to its vocabulary through the keyword `x-vocabulary`, at the path of the
# field.
#
# Source of truth for the checkers. A closed field holds one of its listed values, or stays empty
# while it is not filled. The requirement registry decides whether an empty field is a gap.
# A key repeats across blocks only where it carries the same vocabulary. The template comments
# document these vocabularies and are checked against this file, so no check reads a document.
# A value is admitted for a distinction that the assertions of the records draw, not for the
# needs of the first cases: a value that absorbs most entries draws no distinction, and hides
# the claims of the entries that it labels.
#
# Each epistemic aim of a question also states its category, a token compared with the note on
# epistemic aims (`docs/epistemology/objects/task/epistemic-aim.md`), which owns the answer conditions of
# each aim. The category of an exploration depends on the origin of its equivalence criterion, so
# it is keyed by that origin.
# Each type of result of a problem lists under `admits` the aims of the questions that may serve
# it, as the demand table of the note on the types of problem states
# (`docs/epistemology/objects/problem/problem-types.md`); an empty list admits no aim.
# The kind `comparison` has no template: a comparison is computed from a binding, and its
# vocabulary lists the values of the calibration treatment that the computation reports.

id: registry.vocabularies
type: vocabulary-registry
vocabularies:
  answer:
    grounds.role:
    - value: assumption
      name: a premise asserted true of the target
    - value: idealization
      name: a premise known false of the target, which licenses the derivation
    - value: condition
      name: a restriction under which the claim holds
    - value: datum
      name: evidence drawn from a version of recorded or derived data
    - value: warrant
      name: a law or an argued pair licensing the step to the claim
    - value: criterion
      name: a standard fixed by the question, such as a tolerance
    grounds.motive:
    - value: tractability
      name: the undistorted system admits no analysis
    - value: isolation
      name: it removes a factor judged irrelevant
    - value: limit
      name: it exposes the behavior of a limit system
    grounds.removable:
    - value: controlled
      name: a correction to the idealized result is known
    - value: ineliminable
      name: the model cannot be stated without it
    - value: unknown
      name: neither a correction nor the ineliminability of the distortion is known
    dependence.kind:
    - value: minimal-set
      name: grounds that suffice for the claim
    - value: sensitivity
      name: an analysis over one ground
    - value: robustness
      name: an analysis across models that share the claimed structure
    route.kind:
    - value: derivation
      name: a deduction in which some move has an inexact warrant or some posit lacks an exact confirmation
    - value: proof
      name: a deduction in which every move has an exact warrant and every posit an exact confirmation
    - value: simulation
      name: a numerical computation of the trajectories of a model
    - value: estimation
      name: values inferred from data by the estimator that the phenomenon states
    - value: measurement
      name: values assigned to a property, preserving its empirical relations
    route.family_fidelity:
    - value: per-member
      name: one comparison per member, each of which must pass
    - value: ensemble
      name: one comparison of the ensemble of the family
    .status:
    - value: entertained
      name: put forward as a candidate and not yet adopted for evaluation
    - value: hypothesized
      name: held provisionally while it is tested
    - value: accepted
      name: admitted into the accepted knowledge by an act of the researcher
    - value: retracted
      name: withdrawn by a decision of the researcher
    .support:
    - value: unsupported
      name: nothing supports the claim yet, neither a proof nor data nor an informal argument
    - value: informal
      name: support short of proof or empirical test, such as toy simulations
    - value: formally-proven
      name: a proof derives the claim from its stated premises
    - value: empirically-supported
      name: the claim passed a test against data on the target
    uncertainty.form:
    - value: interval
      name: "a range that contains the value with a stated probability, such as 40 \xB1 3 Hz at 95 %"
    - value: distribution
      name: a probability distribution over the value
    - value: bound
      name: limits that the value or its error does not exceed, stated without a probability
    .modal_strength:
    - value: actual
      name: the claim holds of the target system
    - value: possible
      name: the claim is consistent with the admitted laws and the domain
    - value: necessary
      name: no alternative consistent with the admitted laws produces a foil
    erotetic_relation.value:
    - value: complete
      name: a direct answer, conclusive under the answer conditions of the aim
    - value: partial
      name: narrows the direct answers without being conclusive
    - value: corrective
      name: shows that a presupposition of the question is false
    - value: reformulating
      name: answers a revised question, which it names
    use.value:
    - value: tool
      name: the model performs a stated task
    - value: proof-of-principle
      name: the model shows that a behavior can arise
    - value: conceptual-exploration
      name: the model serves to explore a class of models
    - value: understanding
      name: the model affords a grasp of explanatory, structural or modal relations
    aim_block.origin:
    - value: input
      name: fixed by the question
    - value: output
      name: produced by the answer
    aim_block.detection:
    - value: pass
      name: the pattern meets the criterion and counts as a phenomenon
    - value: fail
      name: the pattern does not meet the criterion
    - value: pending
      name: the criterion has not yet been applied to the pattern
    aim_block.relation:
    - value: causal-intervention
      name: the explanandum changes when a factor is set by intervention
    - value: causal-mechanistic
      name: earlier entities outside the system produce the phenomenon by interactions
    - value: constitutive
      name: organized parts and activities of the system compose the phenomenon
    - value: functional
      name: a part contributes to a capacity or was selected for its effects
    - value: nomological
      name: the explanandum follows from a law
    - value: statistical
      name: the explanandum falls under a probabilistic regularity
    - value: mathematical
      name: a mathematical fact proves the explanandum or excludes its alternatives
    aim_block.factor:
    - value: condition
      name: on a quantity
    - value: structural-property
      name: of a structure, such as sparsity or low rank
    - value: law-property
      name: of a law, such as invariance, additivity or factorization
    - value: organization
      name: of the arrangement, such as a feedback loop or a modular composition
    aim_block.target_status:
    - value: denoting
      name: the factor denotes a quantity or a part of the target
    - value: coarse-graining
      name: the factor describes a target feature at a stated level
    - value: limit-construct
      name: the factor holds only in a limit system
    - value: structural-constraint
      name: the factor is a symmetry or bound that the target satisfies
    aim_block.modality:
    - value: possible
      name: the property holds in some admitted alternative, shown by a witness
    - value: impossible
      name: the property holds in no admitted alternative, shown by proof
    - value: necessary
      name: the property holds in every admitted alternative, shown by proof
    aim_block.form:
    - value: derived-law
      name: a law that follows from the laws of the model
    - value: regime
      name: a qualitative behavior of the model over a range of parameters
    - value: limit
      name: the behavior of the model in a limit system
    - value: structural-property
      name: a property of the model structure, such as low rank
    - value: counterexample
      name: an instance that falsifies a stated property of the model
    relations.relation:
    - value: supports
      name: its claim is a ground of the other answer
    - value: presupposes
      name: it is admissible only if the other answer is true
    - value: tests
      name: its claim, compared with the target, follows from the other
    - value: defeats
      name: its claim, once accepted, denies a ground of the other or its application
    - value: revises
      name: it replaces the other answer, which stays unchanged
  assessment:
    .status:
    - value: provisional
      name: the record is written and still under revision
    - value: stabilized
      name: the inquiry expects no further revision of the record
    - value: retracted
      name: the record is withdrawn, with all its specifications
    obligations.verdict:
    - value: pending
      name: no derivation or counterexample settles the obligation yet
    - value: pass
      name: a derivation establishes the implication
    - value: fail
      name: a counterexample shows that the implication does not hold
    - value: not-applicable
      name: no test applies to the obligation, as for a corrective answer
    appraisal.virtue:
    - value: unification
      name: the account explains many phenomena through few common principles
    - value: generality
      name: the explanatory structure extends across cases or parameter regimes
    - value: robustness
      name: conclusions survive changes of parameters, assumptions or representation beyond the declared idealizations
    - value: intelligibility
      name: consequences can be recognized without the full calculation
    - value: structural-transparency
      name: the representation makes components, relations and dependencies salient
    - value: economy
      name: the purpose is achieved without unnecessary complexity
    - value: tractability
      name: the model can be analyzed or computed with available resources
  phenomenon:
    .status:
    - value: provisional
      name: the record is written and still under revision
    - value: stabilized
      name: the inquiry expects no further revision of the record
    - value: retracted
      name: the record is withdrawn, with all its specifications
    .commitment:
    - value: identified
      name: a definite description and pointers fix the referent
    - value: specified
      name: the record writes its observables and manifestations, and their symbols resolve
    .category:
    - value: particular-occurrence
      name: one token of a state, a process or an event
    - value: regularity
      name: an invariant across instances, required to be stable
    - value: capacity
      name: a disposition to yield outputs of a class given inputs of a class
    - value: structural-property
      name: a property of a structure, holding at each point of the course
    .occurrence:
    - value: state
      name: holds at every point of a segment, without change
    - value: process
      name: holds on every sub-segment longer than the grain, at no point
    - value: event
      name: holds of a segment and of none of its parts
    - value: not-applicable
      name: no occurrence class, as for a regularity or a capacity
    index_sets.structure:
    - value: evolution
      name: the index along which the state evolves, such as time or a training step
    - value: continuum
      name: any other continuous index, such as space, a lag or a horizon
    - value: discrete-set
      name: any other countable index, such as samples, sites or members
    observables.scale:
    - value: nominal
      name: values are labels, compared only for identity
    - value: ordinal
      name: values are ordered, so ranks carry meaning
    - value: interval
      name: an arbitrary zero, so differences carry meaning
    - value: ratio
      name: a natural zero, so ratios of values carry meaning
    - value: absolute
      name: a count, which admits no rescaling at all
    - value: not-applicable
      name: the values are maps or measures, to which no scale type applies
    observables.selects:
    - value: unique
      name: the record presupposes exactly one value satisfying the condition
    - value: any
      name: the claim holds of each value satisfying the condition
    - value: all
      name: the quantity is the set of values satisfying the condition
    manifestations.selects:
    - value: unique
      name: the record presupposes exactly one value satisfying the condition
    - value: any
      name: the claim holds of each value satisfying the condition
    - value: all
      name: the quantity is the set of values satisfying the condition
    observables.censoring:
    - value: right
      name: the event had not occurred by the horizon
    - value: left
      name: the event occurred before the first observation, at an unknown time
    - value: interval
      name: the event occurred between two observations, at an unknown time
    - value: none
      name: the time of the event is recorded
    manifestations.form:
    - value: value
      name: an observable equals a stated label or number
    - value: dependence
      name: an observable varies with a condition or another quantity
    - value: functional-form
      name: an observable equals a stated expression in its indices
    - value: scaling
      name: one side varies as the other up to a prefactor
    - value: relation
      name: an implication or another logical link between conditions
    scope_over_instances.source:
    - value: class-member
      name: instances are distinct members of the reference class
    - value: realization
      name: repeated runs of one system, such as trials or disorder samples
    - value: random-parameters
      name: instances are draws of the parameter values
    - value: random-structure
      name: instances are draws of the structure, such as an interaction architecture
    - value: scenario
      name: instances are prescribed scenarios, such as emission pathways
    scope_over_instances.quantification:
    - value: single
      name: the claim holds of one fixed instance
    - value: typical
      name: the claim holds of one representative instance
    - value: ensemble-summary
      name: the claim states one summary over instances, such as a mean
    - value: ensemble-distribution
      name: the claim states the distribution of a quantity over instances
    - value: universal
      name: the claim holds of every member of the admitted class
    .evidential_status:
    - value: established
      name: the behavior is shown across data sets or methods
    - value: reported
      name: one data set or one study shows the behavior
    - value: predicted
      name: a derivation asserts the behavior of a target with actual members, awaiting detection
    - value: derived
      name: a derivation establishes the behavior of a model or a target without actual members
    - value: absent
      name: a closed search found no instance
    - value: disproved
      name: a counterexample or a contradiction is established
    - value: undecided
      name: the occurrence is an open question that the inquiry tracks
    data_model.kind:
    - value: instrument-model
      name: how the apparatus turns the measured quantity into raw records
    - value: background-simulation
      name: a simulation of the records that processes other than the behavior would produce
    - value: assimilation-model
      name: combines records with a simulation to fill their gaps
    - value: reconstruction
      name: an inference of a quantity that no apparatus recorded, from records of other quantities
    observation_error.form:
    - value: distribution
      name: a probability law of the error, such as a Gaussian
    - value: bound
      name: a maximal size that the error does not exceed
  question:
    presuppositions.part:
    - value: existence
      name: a result of the demanded type exists
    - value: topic
      name: the fact in question holds
    answerability.condition:
    - value: definiteness
      name: each term has a definition or a criterion adequate to its use
    - value: answer-type
      name: every component of the type of the direct answers is fixed
    - value: soundness
      name: the presuppositions of the question are true
    - value: candidates
      name: at least one proposed answer passes the admissibility tests
    - value: discrimination
      name: a quantity takes different values under the candidates and their alternatives
    - value: access
      name: an available procedure applies to the quantity or the demanded result
    - value: bridging
      name: an inference stated in advance links the quantity to the answer
    - value: representation
      name: the model used for access represents the target to the required accuracy
    answerability.route:
    - value: selection
      name: a discriminating value singles out one proposed candidate
    - value: construction
      name: a named procedure would yield a direct answer when run
    - value: both
      name: the state holds on each of the two routes
    answerability.state:
    - value: established
      name: the records show that the condition holds
    - value: refuted
      name: the records or the literature show that the condition fails
    answerability.refutation:
    - value: outright
      name: an argument of impossibility shows that the condition fails
    - value: lack-of-means
      name: every means considered was tried and failed
    .status:
    - value: posed
      name: the question is stated and not yet revised
    - value: refined
      name: the question was revised since it was first stated
    - value: answered
      name: acts of the researcher meet the demand of its minimal problem
    - value: dissolved
      name: an accepted answer denies a presupposition of the question
    - value: abandoned
      name: the researcher stops the inquiry with the question unanswered
    .request:
    - value: one
      name: one result suffices, with no claim of completeness
    - value: all
      name: every result is required, with a claim of completeness
    - value: over-a-parameter
      name: one result for each value of a parameter
    - value: decision
      name: whether each candidate already proposed meets the constraints
    links.relation:
    - value: subquestion-of
      name: a part of an answer to the linked question answers this one
    - value: explanans-from
      name: each answer states an explanans factor over the phenomenon of the linked question
    - value: presupposes
      name: a true direct answer requires one to the linked question
    - value: enables
      name: an answer establishes a condition of answerability of the linked question
    subject.placeholder:
    - value: system
      name: the slot awaits a target-system record
    - value: phenomenon
      name: the slot awaits a record of a behavior of the target
    subject.locus:
    - value: other-outcome
      name: same system and conditions, another value of the phenomenon
    - value: other-system
      name: another system, in which the phenomenon is absent
    - value: other-condition
      name: same system, under a different setting or intervention
    - value: none
      name: the question states no contrast
    subject.foil_status:
    - value: observed
      name: the foil case occurred and has been recorded
    - value: counterfactual
      name: the foil case never occurred and must first be produced
    - value: not-applicable
      name: the question states no foil set
    subject.restriction:
    - value: clamped
      name: a fixed value replaces the rule that determines the variable
    - value: restricted
      name: the variable is held within a stated set of values, by no more specific mode
    - value: initial
      name: only the initial values of the variable are restricted
    - value: stationary
      name: the variable is held to courses whose law is invariant under shifts along the course
    - value: without-event
      name: the variable is held to courses on which a stated event does not occur
    task.epistemic_aim:
    - value: description
      name: what structure the target system has
      category: answer-content
    - value: exploration
      name: what happens in the system as conditions vary
      category:
        input: answer-content
        output: conceptual-work
    - value: prediction
      name: what will occur under specified conditions
      category: answer-content
    - value: explanation
      name: why or how the phenomenon occurs
      category: answer-content
    - value: modal-knowledge
      name: what is possible, impossible, necessary or contingent
      category: answer-content
    - value: model-properties
      name: what follows from a theory or a model
      category: answer-content
    - value: explication
      name: which criterion should define a term
      category: conceptual-work
    task.requested_relation:
    - value: causal-intervention
      name: the explanandum changes when a factor is set by intervention
    - value: causal-mechanistic
      name: earlier entities outside the system produce the phenomenon by interactions
    - value: constitutive
      name: organized parts and activities of the system compose the phenomenon
    - value: functional
      name: a part contributes to a capacity or was selected for its effects
    - value: nomological
      name: the explanandum follows from a law
    - value: statistical
      name: the explanandum falls under a probabilistic regularity
    - value: mathematical
      name: a mathematical fact proves the explanandum or excludes its alternatives
    - value: not-applicable
      name: the answer relates no explanans to the explanandum
    task.function_sense:
    - value: causal-role
      name: the contribution of a part to a capacity of the system
    - value: etiological
      name: the effects for which the part was selected
    task.modal_strength:
    - value: actual
      name: the claim holds of the target system
    - value: possible
      name: the claim is consistent with the admitted laws and the domain
    - value: necessary
      name: no alternative consistent with the admitted laws produces a foil
    task.substrate:
    - value: specific
      name: explanans variables belong to the particular parts of one realization
    - value: independent
      name: explanans variables are shared by every realization of the system
    - value: mapping
      name: how the variables of the parts realize variables shared by all realizations
    task.standard:
    - value: qualitative
      name: agreement in kind with the target, with no tolerance
    - value: order-of-magnitude
      name: the larger of the two values is at most ten times the smaller
    - value: numeric-bound
      name: a stated metric of the difference must not exceed a bound
    - value: structural-only
      name: only structures of the target must correspond, with no values
    - value: not-applicable
      name: the answer is compared with no data of the target
    virtues.standing:
    - value: constitutive
      name: the product test applies it
    - value: preferred
      name: appraisal ranks on it
    virtues.virtue:
    - value: unification
      name: the account explains many phenomena through few common principles
    - value: generality
      name: the explanatory structure extends across cases or parameter regimes
    - value: robustness
      name: conclusions survive changes of parameters, assumptions or representation beyond the declared idealizations
    - value: intelligibility
      name: consequences can be recognized without the full calculation
    - value: structural-transparency
      name: the representation makes components, relations and dependencies salient
    - value: economy
      name: the purpose is achieved without unnecessary complexity
    - value: tractability
      name: the model can be analyzed or computed with available resources
  target-system:
    .status:
    - value: provisional
      name: the record is written and still under revision
    - value: stabilized
      name: the inquiry expects no further revision of the record
    - value: retracted
      name: the record is withdrawn, with all its specifications
    .commitment:
    - value: identified
      name: a definite description and pointers fix the referent
    - value: specified
      name: the record writes its declarations, and their symbols resolve
    .target_type:
    - value: particular
      name: one existing system, such as a recorded slice
    - value: actual-systems
      name: a class whose members exist, such as mouse V1 circuits
    - value: possible-systems
      name: a class of systems whose members need not exist
    - value: hypothetical
      name: one system that does not exist, such as an altered cortex
    - value: no-external-target
      name: the model class itself is the object of study
    reference_class.status:
    - value: assumed
      name: the projection is adopted without a check that could refute it
    - value: checked
      name: the projection passed a check on further members or on a shared mechanism
    - value: not-claimed
      name: no claim is carried from some members to the whole class
    index_sets.structure:
    - value: evolution
      name: the index along which the state evolves, such as time or a training step
    - value: continuum
      name: any other continuous index, such as space, a lag or a horizon
    - value: discrete-set
      name: any other countable index, such as samples, sites or members
    variables.determined:
    - value: within
      name: its value is fixed inside the system
    - value: outside
      name: its value varies but is set beyond the system
    variables.scale:
    - value: nominal
      name: values are labels, compared only for identity
    - value: ordinal
      name: values are ordered, so ranks carry meaning
    - value: interval
      name: an arbitrary zero, so differences carry meaning
    - value: ratio
      name: a natural zero, so ratios of values carry meaning
    - value: absolute
      name: a count, which admits no rescaling at all
    - value: not-applicable
      name: the values are maps or measures, to which no scale type applies
    variables.selects:
    - value: unique
      name: the record presupposes exactly one value satisfying the condition
    - value: any
      name: the claim holds of each value satisfying the condition
    - value: all
      name: the quantity is the set of values satisfying the condition
    parameters.scale:
    - value: nominal
      name: values are labels, compared only for identity
    - value: ordinal
      name: values are ordered, so ranks carry meaning
    - value: interval
      name: an arbitrary zero, so differences carry meaning
    - value: ratio
      name: a natural zero, so ratios of values carry meaning
    - value: absolute
      name: a count, which admits no rescaling at all
    - value: not-applicable
      name: the values are maps or measures, to which no scale type applies
    parameters.selects:
    - value: unique
      name: the record presupposes exactly one value satisfying the condition
    - value: any
      name: the claim holds of each value satisfying the condition
    - value: all
      name: the quantity is the set of values satisfying the condition
    external_systems.role:
    - value: evolution
      name: how the state changes along the course
    - value: input-output
      name: how one quantity is determined by others at the same point
    - value: measurement
      name: how an instrument registers the state
    - value: state-constraint
      name: which states may hold together, including at the start and at the boundary
    - value: distribution
      name: the law of a random quantity
    - value: admissibility
      name: a restriction on the parameters or the forms that a member may take
  background:
    .status:
    - value: provisional
      name: the record is written and still under revision
    - value: stabilized
      name: the inquiry expects no further revision of the record
    - value: retracted
      name: the record is withdrawn, with all its specifications
    laws.role:
    - value: evolution
      name: how the state changes along the course
    - value: input-output
      name: how one quantity is determined by others at the same point
    - value: measurement
      name: how an instrument registers the state
    - value: state-constraint
      name: which states may hold together, including at the start and at the boundary
    - value: distribution
      name: the law of a random quantity
    - value: admissibility
      name: a restriction on the parameters or the forms that a member may take
    laws.warrant:
    - value: derived
      name: from other admitted laws, in a limit or not, the range of the law stating the limit
