                  - &id009
                    - SYMBOL
                  items:
                    examples: *id009
                procedure:
                  description: 'only content beyond the chain `bears_on`, `through`, `produces`


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
