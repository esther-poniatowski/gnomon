# Generated by `gnomon schemas` from `answer.base.schema.yml` and the vocabulary registry. Edit those, not this file.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/answer.contract.schema.yml
title: Answer record contract
description: The record type `answer`, bound to `gnomon:answer@3`, with its closed vocabularies.
allOf:
- $ref: https://github.com/esther-poniatowski/gnomon/schemas/answer.base.schema.yml
required:
- _schema
properties:
  _schema:
    const: gnomon:answer@3
    title: Schema
    description: The logical identifier of the contract that the record follows.
  type:
    const: answer
    examples:
    - answer
  id:
    pattern: ^ans\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
    examples:
    - ans.topic.name
  title:
    examples:
    - SHORT NAME OF THE CANDIDATE ANSWER
  answers:
    examples:
    - quest.TOPIC.NAME
  sources:
    description: 'per source, a provenance pointer to existing material from which the answer was adopted;
      the content stays external and the pointer makes no evidential claim


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    items:
      examples:
      - POINTER TO AN EXISTING NOTE, PUBLICATION, MODEL OR DATA SET
  claim:
    description: '"[the claim of the answer]", as a reading, and, once formalized, an expression over
      declared symbols


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    propertyNames:
      enum:
      - reading
      - expression
      - caveat
      - realizations
      - presuppositions
      - interventions
    properties:
      reading:
        description: 'the claim in words


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - THE CLAIM IN WORDS
      expression:
        description: 'empty while the claim is not formalized, with a caveat naming the gap


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - EXPRESSION OVER DECLARED SYMBOLS
      caveat:
        description: 'the content of the claim that the record leaves unstated, and the reason for the
          omission


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE OMISSION
      realizations:
        description: 'fill when the question bounds the explanans to the link between two substrates;
          one entry per role


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        items:
          propertyNames:
            enum:
            - id
            - realizes
            - by
            - reading
          properties:
            id:
              description: 'a name of the realization, unique within the answer


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
              examples:
              - MAPPING
            realizes:
              description: 'a role, declared by the model independently of any substrate


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
              examples:
              - SYMBOL
            by:
              description: 'an expression over the symbols specific to the substrate that realizes the
                role


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
              examples:
              - EXPRESSION OVER THE SYMBOLS SPECIFIC TO THE SUBSTRATE
            reading:
              description: 'only content beyond the expression of `by`


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
              examples:
              - THE STRUCTURE THAT THE MAPPING PRESERVES
      presuppositions:
        description: 'optional; one entry per commitment that the claim takes for granted beyond the presuppositions
          of its question and the existence that the conditions of its quantities presuppose


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        items:
          propertyNames:
            enum:
            - id
            - reading
            - expression
            - held_by
          properties:
            id:
              description: 'A descriptive identifier of the presupposition, unique within the record.


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
            reading:
              description: 'The commitment that the claim and every other direct answer of its question
                take for granted.


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
            expression:
              description: 'The presupposition in the expression syntax, over declared symbols.


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
              examples:
              - EXPRESSION OVER DECLARED SYMBOLS
            held_by:
              description: 'The law of a background or of a model, or the consequence of a derivation,
                that establishes the presupposition; empty while it is undischarged. A presupposition
                that another answer establishes is a relation `presupposes` to that answer.


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
      interventions:
        description: 'For a counterfactual claim, the admissible interventions, each named by an experiment
          or a simulation run whose protocol states it, or by the parameter or the variable of a model
          that it sets; naming them marks the claim as counterfactual.


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        items:
          examples:
          - REFERENCE
  grounds:
    description: 'what the claim depends on: per ground, its content, its *role*: `assumption` · `idealization`
      · `condition` · `datum` · `warrant` · `criterion`, and the record that holds it. A ground with the
      role `idealization` also states the distortion that it introduces, its motive (tractability, isolation
      or limit), the gain that it provides, the range over which it holds, and whether it is removable
      (controlled, ineliminable or unknown)


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    items:
      propertyNames:
        enum:
        - id
        - role
        - content
        - record
        - version
        - distortion
        - motive
        - gain
        - range
        - removable
      properties:
        id:
          description: 'a name of the ground, unique within the answer


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - GROUND
        role:
          description: 'the part that the ground plays for the claim: an assumption, an idealization,
            a condition, a datum, a warrant or a criterion


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          enum:
          - assumption
          - idealization
          - condition
          - datum
          - warrant
          - criterion
          - null
        content:
          description: 'the ground in words


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - THE GROUND IN WORDS
        record:
          description: 'the record or the unit that holds the ground: a law of the model or of the background,
            or an argued pair of a binding, for a warrant; a restriction of the domain; a criterion of
            the question; a phenomenon for a datum


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - RECORD.UNIT
        version:
          description: 'datum only: the version of the data


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - VERSION
        distortion:
          description: 'idealization only, as are the four keys below


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - THE DISTORTION OF THE TARGET THAT THE IDEALIZATION INTRODUCES
        motive:
          description: 'for an idealization, the reason for making it: tractability, isolation or a limit


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          enum:
          - tractability
          - isolation
          - limit
          - null
        gain:
          description: 'for an idealization, the derivation that it makes possible, or the factor that
            it exposes


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - THE DERIVATION THAT THE IDEALIZATION MAKES POSSIBLE, OR THE FACTOR THAT IT EXPOSES
        range:
          description: 'for an idealization, an expression over declared symbols satisfied wherever the
            idealization holds


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - EXPRESSION OVER DECLARED SYMBOLS, SATISFIED WHEREVER THE IDEALIZATION HOLDS
        removable:
          description: 'for an idealization, whether its distortion can be removed: controlled, ineliminable
            or unknown


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          enum:
          - controlled
          - ineliminable
          - unknown
          - null
  abstractions:
    description: 'per factor, the factor left out


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    items:
      propertyNames:
        enum:
        - id
        - factor
      properties:
        id:
          description: 'a name of the abstraction, unique within the answer


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - ABSTRACTION
        factor:
          description: 'the factor that the abstraction leaves out


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - THE FACTOR LEFT OUT
  dependence:
    description: 'how the claim depends on its grounds: per entry, a minimal set of grounds that suffices
      for the claim; the result of a sensitivity analysis over one ground [saltelli2008]; or the result
      of a robustness analysis across models that share the claimed structure [weisberg2006]


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    items:
      propertyNames:
        enum:
        - kind
        - grounds
        - models
        - result
      properties:
        kind:
          description: 'the form of the dependence: a minimal set of grounds, a sensitivity analysis or
            a robustness analysis


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          enum:
          - minimal-set
          - sensitivity
          - robustness
          - null
        grounds:
          description: 'grounds of this answer, by identifier


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - &id001
            - GROUND
          items:
            examples: *id001
        models:
          description: 'robustness only: the models compared


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - &id002
            - mod.TOPIC.NAME
          items:
            examples: *id002
        result:
          description: 'omit for a minimal sufficient set


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - THE RESULT OF THE ANALYSIS
  route:
    description: '`derivation` · `proof` · `simulation` · `estimation` · `measurement`, the records on
      which it runs (the target, one model, or a family of models), and a pointer to the derivation, the
      code or the data


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    propertyNames:
      enum:
      - kind
      - runs_on
      - family_fidelity
      - derivations
      - pointer
    properties:
      kind:
        description: 'how the answer is obtained: a derivation, a proof, a simulation, an estimation or
          a measurement


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        enum:
        - derivation
        - proof
        - simulation
        - estimation
        - measurement
        - null
      runs_on:
        description: 'the target system, one model, or every model of a family, by identifier


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - &id003
          - RECORD
        items:
          examples: *id003
      family_fidelity:
        description: 'fill for a family of models only


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        enum:
        - per-member
        - ensemble
        - null
      derivations:
        description: 'for a derivation or a proof; the derivation records on which the claim rests


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - &id004
          - derivation.TOPIC.NAME
        items:
          examples: *id004
      pointer:
        description: 'a pointer to the code, the data or a published derivation; a recorded derivation
          is named in `derivations`, and its internal steps stay in it


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - POINTER TO THE CODE, THE DATA OR A PUBLISHED DERIVATION
  domain:
    description: 'the systems and the conditions over which the claim holds


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
  variant:
    description: 'the variant of the target that the answer accounts for, and one further variant for
      each of its parts with a narrower scope


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
  status:
    description: 'the attitude taken toward the answer: entertained · hypothesized · accepted · retracted


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    enum:
    - entertained
    - hypothesized
    - accepted
    - retracted
    - null
  support:
    description: 'the kind of evidence for the answer as a whole: unsupported · informal · formally-proven
      · empirically-supported


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    enum:
    - unsupported
    - informal
    - formally-proven
    - empirically-supported
    - null
  uncertainty:
    description: 'the uncertainty of each value, as an interval, a distribution or a bound


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    items:
      propertyNames:
        enum:
        - of
        - form
        - expression
      properties:
        of:
          description: 'the symbol of the value whose uncertainty the entry states


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - SYMBOL
        form:
          description: 'the form of the uncertainty, told apart by the probability that it states


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          enum:
          - interval
          - distribution
          - bound
          - null
        expression:
          description: 'an expression over declared symbols stating the uncertainty


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - EXPRESSION OVER DECLARED SYMBOLS
  modal_strength:
    description: 'the strength that the answer claims: actual · possible · necessary


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    enum:
    - actual
    - possible
    - necessary
    - null
  erotetic_relation:
    description: 'how the answer stands to its question: `complete` · `partial` · `corrective` · `reformulating`,
      with the presupposition that a corrective answer denies, or the revised question that a reformulating
      answer answers


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    propertyNames:
      enum:
      - value
      - denies
      - revised_question
    properties:
      value:
        description: 'how the answer stands to its question: complete, partial, corrective or reformulating


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        enum:
        - complete
        - partial
        - corrective
        - reformulating
        - null
      denies:
        description: 'corrective only


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - THE PRESUPPOSITION OF THE QUESTION THAT THE ANSWER SHOWS FALSE
      revised_question:
        description: 'reformulating only: the question that the answer answers and is assessed against


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - quest.TOPIC.NAME
  binding:
    description: 'the record through which the claim bears on the target: per model, the identifier and
      the version of one binding of that model to the phenomenon of the question


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    items:
      propertyNames:
        enum:
        - record
        - version
      properties:
        record:
          description: 'the identifier of one binding of the model to the phenomenon of the question


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - bind.TOPIC.NAME
        version:
          description: 'the version of that binding on which the claim rests


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
          examples:
          - VERSION
  use:
    description: 'the purpose of an answer whose claim bears on no target: a use such as `tool`, `proof-of-principle`,
      `conceptual-exploration` or `understanding`, with the property that the model must have for that
      use


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    propertyNames:
      enum:
      - value
      - property
    properties:
      value:
        description: 'a new use enters the vocabulary registry first


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        enum:
        - tool
        - proof-of-principle
        - conceptual-exploration
        - understanding
        - null
      property:
        description: 'the property that the model must have for the declared use


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        examples:
        - THE PROPERTY THAT THE MODEL MUST HAVE FOR THAT USE
  aim_block:
    description: 'the block of the aim of the question


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
    propertyNames:
      enum:
      - description
      - exploration
      - prediction
      - explanation
      - modal_knowledge
      - model_properties
    properties:
      description:
        description: 'the block for the aim `description`: the values or the characterization of the observables
          and the features of the phenomenon


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        propertyNames:
          enum:
          - values
        properties:
          values:
            description: 'one entry per observable or feature that the request covers, per source of variation


              [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
            items:
              propertyNames:
                enum:
                - of
                - across
                - data_version
                - value
              properties:
                of:
                  description: 'the observable or the feature whose value the entry states


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - phen.TOPIC.NAME.SYMBOL
                across:
                  description: 'the source of variation of the phenomenon whose quantification the value
                    takes; omit for a single instance


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - SYMBOL
                data_version:
                  description: 'for a value that the estimator of the phenomenon computes: the version
                    of the data on which it runs


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - VERSION
                value:
                  description: 'only for a characterization that no estimator computes


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - EXPRESSION OVER DECLARED SYMBOLS
      exploration:
        description: 'the block for the aim `exploration`: the space explored, its equivalence criterion,
          and the classes found


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
        propertyNames:
          enum:
          - space
          - criterion
          - classes
        properties:
          space:
            description: 'the observables and the varied factors


              [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
            propertyNames:
              enum:
              - origin
              - observables
              - varied
            properties:
              origin:
                description: 'whether the space is an input fixed by the question or an output produced
                  by the answer


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                enum:
                - input
                - output
                - null
              observables:
                description: 'of the phenomenon


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                examples:
                - &id005
                  - SYMBOL
                items:
                  examples: *id005
              varied:
                description: 'the factors varied across the space, each with its range


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                items:
                  propertyNames:
                    enum:
                    - factor
                    - range
                  properties:
                    factor:
                      description: 'the symbol of the varied factor


                        [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                      examples:
                      - SYMBOL
                    range:
                      description: 'a set expression over declared symbols giving the range of the factor


                        [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                      examples:
                      - SET EXPRESSION OVER DECLARED SYMBOLS
          criterion:
            description: 'the equivalence criterion that partitions the space


              [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
            propertyNames:
              enum:
              - origin
              - expression
              - reading
            properties:
              origin:
                description: 'whether the criterion is an input fixed by the question or an output produced
                  by the answer


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                enum:
                - input
                - output
                - null
              expression:
                description: 'an expression over declared symbols stating the equivalence criterion


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                examples:
                - EXPRESSION OVER DECLARED SYMBOLS
              reading:
                description: 'the criterion in words


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                examples:
                - THE CRITERION IN WORDS
          classes:
            description: 'one entry per class found


              [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
            items:
              propertyNames:
                enum:
                - id
                - pattern
                - reading
                - detection
              properties:
                id:
                  description: 'a name of the class, unique within the answer


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - CLASS
                pattern:
                  description: 'an expression over declared symbols stating the pattern of the class


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - EXPRESSION OVER DECLARED SYMBOLS
                reading:
                  description: 'the pattern in words


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - THE PATTERN IN WORDS
                detection:
