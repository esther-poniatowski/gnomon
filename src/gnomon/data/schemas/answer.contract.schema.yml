                  - SYMBOL
                separates:
                  description: 'foils ruled out, by their symbols in the foil set; empty where the contrast
                    has no locus


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
                  examples:
                  - &id008
                    - SYMBOL
                  items:
                    examples: *id008
                appeals_to:
                  description: 'external systems drawn on, by declared symbol; empty when none


                    [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/answer.md).'
