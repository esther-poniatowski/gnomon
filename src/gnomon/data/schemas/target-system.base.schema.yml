          title: Differentiation
          description: The differentiation of the record.
        caveat:
          type:
          - string
          - 'null'
          x-template: '"THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE OMISSION"'
          x-kind: markdown-line
          title: Caveat
          description: The caveat of the record.
    x-comment: forms of a member that differ in their declarations; empty when a single form covers every
      member
    title: Variants
    description: per variant, a name and a symbol. An entry carried by only some members names its variant
      (e.g. a declaration, a law, a relation, an external system). An unmarked entry holds for the whole
      class
    examples:
    - consumer models with explicit resource pools or with direct interaction coefficients; lattice and
      continuum realizations of one field theory
