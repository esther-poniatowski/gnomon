    x-comment: the variables shared with these systems form the target's boundary
    title: External systems
    description: 'per external system, its symbol, its class, the variables that it shares and its constraints.
      A constraint restricts the shared variables beyond their declared value sets. Each constraint takes
      the fields of a law: its name, the places that its claim ranges over, its role among the six of
      a law, its expression and a reading. The field is never left empty: the list `[]` states that the
      external system imposes no constraint'
    examples:
