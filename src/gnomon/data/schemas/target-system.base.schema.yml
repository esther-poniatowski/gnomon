$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/target-system.base.schema.yml
title: Target system record
description: The fields of a target-system record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 1
x-header:
- 'specification: `docs/specification/target-system.md`; one file per target system'
- 'symbols and expressions: `docs/specification/expressions.md`'
- 'the admitted laws, their closure and the organization: `background.yml`, one or more records per target'
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
- specifications follow the order of the specification note
properties:
  title:
    type:
    - string
    - 'null'
    x-template: '"NAME OF THE SYSTEM"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  id:
    type:
    - string
    - 'null'
    x-template: system.TOPIC
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: target-system
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: provisional
    x-vocabulary: .status
    title: Status
    description: The status of the record.
  commitment:
    x-vocabulary: .commitment
    type:
    - string
    - 'null'
    title: Commitment
    description: 'how far the record fixes the target `identified`: a definite description and pointers
      fix the referent · `specified`: the declarations are written and their symbols resolve'
    examples:
    - the networks of a benchmark named before any quantity is declared (identified); the same class with
      its units, quantities and value sets declared (specified)
  target_type:
    x-vocabulary: .target_type
    type:
    - string
    - 'null'
    title: Target type
    description: particular system · class of actual systems · class of possible systems · hypothetical
      system · no external target (the model class itself)
    examples:
    - this recorded slice (particular); layer 2/3 circuits of mouse V1 (actual class); all balanced excitatory–inhibitory
      networks (possible class); a cortex without inhibitory neurons (hypothetical); the Wilson–Cowan
      model (no external target)
  identification:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      description:
        type:
        - string
        - 'null'
        x-template: '"A DEFINITE DESCRIPTION THAT PICKS OUT THE SYSTEM OR THE CLASS OF SYSTEMS"'
        x-kind: markdown-line
        title: description
        description: a noun phrase that picks out one system or one class of systems
        examples:
        - the four tipping elements of the actual Earth system named by the record
      pointers:
        type:
        - array
        - 'null'
        items:
          type:
          - string
          - 'null'
          x-template: '"POINTER TO A DATA SET, A RESULT OR A PUBLICATION THAT FIXES THE REFERENT"'
        title: pointers
        description: per pointer, a data set, a result or a publication
        examples:
        - the article that defines the model class; a recording session
    x-comment: fixes the referent before any quantity is declared
    title: Identification
    description: what fixes the referent before any quantity is declared a definite description, with
      pointers to the data, the results or the publications that fix the referent
    examples:
    - the networks of the mixture-encoding benchmark, a class of possible systems that encompasses artificial
      and biological networks
  reference_class:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      name:
        type:
        - string
        - 'null'
        x-template: '"KIND OF SYSTEM"'
        x-kind: markdown-line
        title: Name
        description: The name of the record.
      projectibility:
        type:
        - object
        - 'null'
        properties:
          status:
            x-vocabulary: reference_class.status
            type:
            - string
            - 'null'
            title: Status
            description: The status of the record.
          evidence:
            type:
            - string
            - 'null'
            x-template: '"THE TEST OR THE ARGUMENT THAT SUPPORTS PROJECTING THE CLAIM ONTO THE CLASS"'
            x-kind: markdown-line
            x-comment: omit when the status is `not-claimed`
            title: Evidence
            description: omit when the status is `not-claimed`
        x-comment: whether a claim about some members can be projected onto the class
        title: projectibility
        description: whether a claim about some members holds of the class assumed · tested · not-claimed,
          with the evidence for an assumed or a tested projection
        examples:
        - delayed generalization reported across several architectures (assumed); a theorem that quantifies
          over every member (not claimed)
      selection_criteria:
        type:
        - array
        - 'null'
        items:
          type: object
          properties:
            name:
              type:
              - string
              - 'null'
              x-template: '"NAME OF THE CRITERION"'
              x-kind: markdown-line
              title: Name
              description: The name of the record.
            expression:
              type:
              - string
              - 'null'
              x-template: '"EXPRESSION OVER DECLARED SYMBOLS THAT A MEMBER SATISFIES"'
              x-kind: text
              title: Expression
              description: The expression of the record.
            justification:
              type:
              - string
              - 'null'
              x-template: '"THE REASON FOR THIS SELECTION"'
              x-kind: markdown-line
              x-comment: also state how the selection affects the inferences the population supports
              title: Justification
              description: also state how the selection affects the inferences the population supports
        x-comment: fill only when membership depends on an outcome of the dynamics; put a restriction
          on prior values in the domain of the question that imposes it, since other questions may leave
          them free
        title: selection criteria
        description: per criterion, the expression that a member satisfies, with a justification. The
          justification gives the reason for imposing the criterion and the inferences that it changes
          about the class
        examples:
        - convergence for trained networks
    x-comment: name only; the remaining specifications of the record generate the class
    title: Reference class
    description: a name, "[kind]", for the class that the other specifications generate
    examples:
    - excitatory–inhibitory networks with $10^3$–$10^5$ neurons and sparse random connectivity (formal);
      the members that reached zero training error (formal, with a selection criterion); layer 2/3 of
      adult mouse V1 (empirical)
  variants:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          x-template: '"NAME OF THE VARIANT"'
