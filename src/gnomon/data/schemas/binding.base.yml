$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/binding.base.yml
title: Binding record
description: The fields of a binding record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 1
x-header:
- 'specification: `docs/specification/binding.md`; one file per binding of one model to one phenomenon'
- a binding records the inferences from the model to the target that its asserter licenses; the answers
  that rest on the model cite it
- 'the maps that carry one side onto the other: `key.yml`, referenced by identifier and version'
- a change of a pair, a key, the domain or the discrepancy commits a new version; earlier versions and
  their comparisons stay unchanged
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
- specifications follow the order of the specification note
properties:
  _schema:
    type: string
    x-template: gnomon:binding@1
    x-kind: label
    title: Schema
    description: The logical identifier of the contract that the record follows.
  title:
    type:
    - string
    - 'null'
    x-template: '"SHORT NAME OF THE BINDING"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  id:
    type:
    - string
    - 'null'
    x-template: bind.TOPIC.NAME
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: binding
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: provisional
    x-vocabulary: .status
    title: Status
    description: The status of the record.
  model:
    x-blank: true
    type:
    - string
    - 'null'
    x-template: mod.TOPIC.NAME
    x-kind: label
    x-comment: the model in use
    title: Model
    description: the model in use the identifier of one model record
    examples:
    - the rate model of an excitatory and an inhibitory population
  target:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      phenomenon:
        type:
        - string
        - 'null'
        x-template: phen.TOPIC.NAME
        x-kind: label
        x-comment: the phenomenon that the binding denotes
        title: Phenomenon
        description: the phenomenon that the binding denotes
      level:
        x-vocabulary: target.level
        type:
        - string
        - 'null'
        title: Level
        description: The level of the record.
    title: Target
    description: 'the denotation of the phenomenon, and the level at which the model is compared the identifier
      of one phenomenon, and the target level: `phenomenon`, when the model is compared with the observables
      that the phenomenon estimates; `data`, when it is compared with a version of the data through an
      observation operator'
    examples:
    - the gamma oscillations of the network (phenomenon); the recorded local field potentials, version
      3 (data)
  asserter:
    x-blank: true
    type:
    - string
    - 'null'
    x-template: '"THE PERSON, THE GROUP OR THE PUBLICATION THAT LICENSES THE INFERENCES"'
    x-kind: markdown-line
    title: Asserter
    description: the agent who licenses the inferences a person, a group or a publication
    examples:
    - the authors of the answer; the publication that proposed the model
  feature_pairs:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          x-template: PAIR
          x-kind: label
          title: Id
          description: The id of the record.
        type:
          x-vocabulary: feature_pairs.type
          type:
          - string
          - 'null'
          title: Type
          description: The type of the record.
        mode:
          x-vocabulary: feature_pairs.mode
          type:
          - string
          - 'null'
          title: Mode
          description: The mode of the record.
        exemplified:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER THE SYMBOLS OF THE MODEL"'
          x-kind: text
          title: Exemplified
          description: The exemplified of the record.
        imputed:
          type:
          - string
          - 'null'
          x-template: phen.TOPIC.NAME.SYMBOL
          x-kind: label
          x-comment: the feature of the target, by the symbol that the phenomenon declares; for a component
            pair, the constituent that the target system declares or the part that the admissible explanans
            admits
          title: Imputed
          description: the feature of the target, by the symbol that the phenomenon declares; for a component
            pair, the constituent that the target system declares or the part that the admissible explanans
            admits
        key:
          type:
          - string
          - 'null'
          x-template: key.TOPIC.NAME
          x-kind: label
          x-comment: computed pairs only
          title: Key
          description: computed pairs only
        key_version:
          type:
          - string
          - 'null'
          x-template: VERSION
          x-kind: label
          title: Key version
          description: The key version of the record.
    x-comment: one entry per feature that the model exemplifies and that is imputed to the target
    title: Feature pairs
    description: 'per pair, a feature that the model exemplifies and the feature of the target to which
      it is imputed, typed: `quantity` · `pattern` · `regime` · `invariance-class` (an invariance or a
      universality class) · `modal-profile` · `component` (a unit of the model and the constituent or
      the admissible part of the target that it denotes); the mode of the pair, `computed` or `argued`;
      and, for a computed pair, the key that carries the one onto the other'
    examples:
    - the model frequency and the peak of the measured spectrum (quantity); the oscillating regime of
      the model and the synchronous regime of the network (regime); the scaling exponents shared by a
      universality class (invariance class)
  condition_pairs:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          x-template: PAIR
          x-kind: label
          title: Id
          description: The id of the record.
        model_condition:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER THE SYMBOLS OF THE MODEL"'
          x-kind: text
          title: Model condition
          description: The model condition of the record.
        target_condition:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER THE SYMBOLS OF THE TARGET"'
          x-kind: text
          title: Target condition
          description: The target condition of the record.
        key:
          type:
          - string
          - 'null'
          x-template: key.TOPIC.NAME
          x-kind: label
          title: Key
          description: The key of the record.
        key_version:
          type:
          - string
          - 'null'
          x-template: VERSION
          x-kind: label
          title: Key version
          description: The key version of the record.
        calibration:
          type:
          - boolean
          - 'null'
          x-template: 'false'
          x-comment: true for a parameter of the model fitted to the data
          title: Calibration
          description: true for a parameter of the model fitted to the data
    x-comment: fill when a condition of the model stands for a condition of the target; one entry per
      pair
    title: Condition pairs
    description: per pair, a condition of the model, the condition of the target that it stands for, and
      the key; a parameter fitted to the data is marked as a *calibration parameter*
    examples:
    - the external drive of the model and the stimulus contrast; the coupling strength (calibration parameter)
  domain:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        region:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          title: Region
          description: The region of the record.
        kind:
          x-vocabulary: domain.kind
          type:
          - string
          - 'null'
          title: Kind
          description: The kind of the record.
    x-comment: the conditions of the target over which the pairs are asserted; one entry per region
    title: Domain of comparison
    description: the conditions of the target over which the pairs are asserted, each region marked as
      *interpolation*, within the range of the calibration data, or *extrapolation*, outside it
    examples:
    - contrasts from 10 % to 80 % (interpolation); a contrast of 100 % (extrapolation)
  structural_discrepancy:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        pairs:
          type:
          - array
          - 'null'
          x-template: '[PAIR]'
          x-comment: the feature pairs that the discrepancy concerns
          title: Pairs
          description: the feature pairs that the discrepancy concerns
        form:
          x-vocabulary: structural_discrepancy.form
          type:
          - string
          - 'null'
          title: Form
          description: The form of the record.
        expression:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          title: Expression
          description: The expression of the record.
        reading:
          type:
          - string
          - 'null'
          x-template: '"THE SYSTEMATIC DIFFERENCE BETWEEN THE MODEL AT ITS BEST PARAMETERS AND THE TARGET"'
          x-kind: markdown-line
          x-comment: a discrepancy model fitted to data counts as calibration on those data
          title: Reading
          description: a discrepancy model fitted to data counts as calibration on those data
    x-comment: fill at quantitative grain; one entry per discrepancy model or bound
    title: Structural discrepancy
    description: the model of the systematic difference between the output of the model at its best parameters
      and the value of the target, or a stated bound on it [kennedyohagan2001]; a discrepancy model fitted
      to data counts as calibration on those data, and the calibration provenance records it
    examples:
    - a Gaussian process over the contrast; a bound of 5 Hz on the frequency
  calibration_provenance:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        parameter:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          x-comment: a parameter of the model
          title: Parameter
          description: a parameter of the model
        data_version:
          type:
          - string
          - 'null'
          x-template: VERSION
          x-kind: label
          x-comment: the version of the data that fitted the parameter
          title: Data version
          description: the version of the data that fitted the parameter
        method:
          type:
          - string
          - 'null'
          x-template: '"THE METHOD OF FITTING"'
          x-kind: markdown-line
          title: Method
          description: The method of the record.
        identifiable:
          type:
          - boolean
          - 'null'
          x-template: 'false'
          x-comment: true when the data identify the parameter apart from the structural discrepancy
          title: Identifiable
          description: true when the data identify the parameter apart from the structural discrepancy
    x-comment: fill when a pair carries a calibration parameter; one entry per calibration parameter
    title: Calibration provenance
    description: per calibration parameter, the version of the data that fitted it, the method of fitting,
      and whether the parameter is identifiable under the structural discrepancy [brynjarsdottir2014]
    examples:
    - the coupling strength, fitted by least squares to the session of day 1, not identifiable apart from
      the discrepancy
  grain:
    x-blank: true
    x-vocabulary: .grain
    type:
    - string
    - 'null'
    title: Grain
    description: '`quantitative`, when the pairs are compared by a metric · `qualitative`, when they are
      compared by a match of patterns or regimes'
    examples:
    - —
  version:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      label:
        type:
        - string
        - 'null'
        x-template: VERSION
        x-kind: label
        x-comment: a version identifier
        title: Label
        description: a version identifier
      committed:
        type:
        - string
        - 'null'
        x-template: '"TIME AT WHICH THIS VERSION WAS COMMITTED"'
        x-kind: markdown-line
        title: Committed
        description: The committed of the record.
    title: Version
    description: a version identifier, and the time at which the binding was committed
    examples:
    - version 2, committed before the recordings of version 3
  maturity:
    x-blank: true
    type:
    - object
    - 'null'
    additionalProperties:
      x-template-key: FIELD.PATH
      x-template: open
    x-comment: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out'
    title: Maturity
    description: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out'
