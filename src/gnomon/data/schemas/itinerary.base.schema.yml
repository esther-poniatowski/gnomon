$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/itinerary.base.schema.yml
title: Itinerary record
description: The fields of a itinerary record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 1
x-header:
- 'specification: `docs/specification/itinerary.md`; one file per itinerary of inquiry'
- 'activities: `src/gnomon/data/registries/activities.yml`; product types: `src/gnomon/data/registries/product-types.yml`'
- each step instantiates one registered activity; its inputs and its output take the types fixed by the
  activity
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
properties:
  title:
    type:
    - string
    - 'null'
    x-template: '"SHORT NAME OF THE ITINERARY"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  id:
    type:
    - string
    - 'null'
    x-template: itin.TOPIC.NAME
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: itinerary
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: planned
    x-vocabulary: .status
    title: Status
    description: The status of the record.
  addresses:
    type:
    - string
    - 'null'
    x-template: prob.TOPIC.NAME
    x-kind: label
    x-comment: a problem, or a question `quest.TOPIC.NAME`
    title: Addresses
    description: the identifier of one problem record or of one question record
    examples:
    - the problem of the delay before generalization
  steps:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          x-template: STEP
          x-kind: label
          title: id
          description: a name unique within the itinerary, by which a later step refers to the output
            of this one
          examples:
          - '`pose`; `test`'
        activity:
          type:
          - string
          - 'null'
          x-template: ACTIVITY
          x-kind: label
          x-comment: an identifier of the activity registry
          title: activity
          description: the identifier of one activity of the registry
          examples:
          - '`abduction`; `testing`'
        inputs:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              type:
                type:
                - string
                - 'null'
                x-template: PRODUCT-TYPE
                x-kind: label
                x-comment: an identifier of the product-type registry
                title: Type
                description: an identifier of the product-type registry
              ref:
                type:
                - string
                - 'null'
                x-template: RECORD-OR-STEP
                x-kind: label
                x-comment: a record identifier, the identifier of the step that produces the input, or
                  a pointer for a `source`
                title: Ref
                description: a record identifier, the identifier of the step that produces the input,
                  or a pointer for a `source`
              as_of:
                type:
                - string
                - 'null'
                x-template: REVISION
                x-kind: label
                x-comment: optional; the revision of the repository at which the step read the record;
                  omit to read the record in its present state
                title: As of
                description: the revision of the repository at which the step read the record
          x-comment: one entry per input of the activity
          title: inputs
          description: 'per input, its product type and a reference: a record identifier, the full identifier
            of the step that produces the input, or a pointer for a `source`'
          examples:
          - a `target-claim` produced by the step `itin.grokking.explain-delay.propose`; the `data` of
            a phenomenon record
        output:
          type:
          - object
          - 'null'
          properties:
            type:
              type:
              - string
              - 'null'
              x-template: PRODUCT-TYPE
              x-kind: label
              title: Type
              description: The type of the record.
            ref:
              type:
              - string
              - 'null'
              x-template: RECORD
              x-kind: label
              x-comment: the record that holds the product; omit until that record exists
              title: Ref
              description: the record that holds the product; omit until that record exists
            before:
              type:
              - string
              - 'null'
              x-template: REVISION
              x-kind: label
              x-comment: for a knowledge-state-change only, the revision of the repository before the change
              title: Before
              description: for a knowledge-state-change only, the revision of the repository before the change
          title: output
          description: the product type of the product, and the record that holds the product, given while
            that record holds the output type
          examples:
          - a `verdict` held by an assessment record
        norm:
          type:
          - object
          - 'null'
          properties:
            test:
              type:
              - string
              - 'null'
              x-template: norm.ACTIVITY
              x-kind: label
              x-comment: the test named by the activity registry for this activity
              title: Test
              description: the test named by the activity registry for this activity
            verdict:
              type:
              - string
              - 'null'
              x-template: pending
              x-vocabulary: steps.verdict
              title: Verdict
              description: The verdict of the record.
            evidence:
              type:
              - string
              - 'null'
              x-template: '"WHY THE PRODUCT MEETS THE NORM OR FAILS IT"'
              x-kind: markdown-line
              x-comment: fill with a verdict pass or fail, from the content of the products
              title: Evidence
              description: why the product meets the norm or fails it
            judged:
              type:
              - string
              - 'null'
              x-template: DATE
              x-kind: label
              x-comment: fill with a verdict pass or fail; the date of the last judgment, written YYYY-MM-DD
              title: Judged
              description: the date of the last judgment of the verdict
          title: norm
          description: 'the test named by the registry for the activity, written `norm.<activity>`, its
            verdict: pass · fail · pending, and, once judged, the evidence and the date of the judgment'
          examples:
          - '`norm.testing`, pending until the assessment is stabilized'
        rationale:
          type:
          - object
          - 'null'
          properties:
            serves:
              type:
              - string
              - 'null'
              x-template: quest.TOPIC.NAME
              x-kind: label
              x-comment: the question that the step serves, or the problem for a step that precedes any question
              title: Serves
              description: the question that the step serves, or the problem
            acts_on:
              type:
              - string
              - 'null'
              x-vocabulary: steps.acts_on
              title: Acts on
              description: The condition or the act on which the step acts.
          title: rationale
          description: 'the question that the step serves, or its problem, and the object on which the
            step acts: one of the eight conditions for obtaining an answer, the obtaining of the answer,
            or its evaluation'
          examples:
          - '`quest.grokking.explain_delay`, acting on the candidates'
        branch:
          type:
          - object
          - 'null'
          properties:
            condition:
              type:
              - string
              - 'null'
              x-template: '"THE CONDITION UNDER WHICH THE STEP IS TAKEN"'
              x-kind: markdown-line
              title: Condition
              description: the condition under which the step is taken
            otherwise:
              type:
              - string
              - 'null'
              x-template: STEP
              x-kind: label
              x-comment: the step taken when the condition fails, which produces the same output type
              title: Otherwise
              description: the step taken when the condition fails, which produces the same output type
          x-comment: optional; a step taken under a condition, with its alternative
          title: branch
          description: the condition under which the step is taken, and the step of the same output type
            taken otherwise
          examples:
          - a simulation taken when no closed form is found, otherwise the derivation
        iterate:
          type:
          - object
          - 'null'
          properties:
            until:
              type:
              - string
              - 'null'
              x-template: '"THE CRITERION THAT ENDS THE REPETITION"'
              x-kind: markdown-line
              title: Until
              description: the criterion that ends the repetition
          x-comment: optional; a step repeated on its own output until the criterion holds
          title: iterate
          description: the criterion that ends the repetition of a step that takes its own output type
            as input
          examples:
          - a fitting repeated until the residuals fall below the tolerance of the question
        revises:
          type:
          - object
          - 'null'
          properties:
            record:
              type:
              - string
              - 'null'
              x-template: RECORD
              x-kind: label
              title: Record
              description: the record that the step revises
            kind:
              x-vocabulary: steps.kind
              type:
              - string
              - 'null'
              title: Kind
              description: The kind of the revision.
            reviews:
              type:
              - array
              - 'null'
              items:
                type: object
                properties:
                  dependent:
                    type:
                    - string
                    - 'null'
                    x-template: RECORD
                    x-kind: label
                    title: Dependent
                    description: a record that the revision flags
                  state:
                    x-vocabulary: steps.state
                    type:
                    - string
                    - 'null'
                    title: State
                    description: The state of the review.
              x-comment: one entry per flagged dependent that the researcher has reviewed
              title: Reviews
              description: one entry per flagged dependent that the researcher has reviewed
          x-comment: optional; a step that revises a record, with the kind of the revision
          title: revises
          description: 'the record that the step revises, the kind of the revision, and the review of each
            flagged dependent: pending · revised · unaffected · retracted'
          examples:
          - the retraction of a background law, with the answers resting on it reviewed one by one
        mode:
          x-vocabulary: steps.mode
          type:
          - string
          - 'null'
          title: mode
          description: deductive · inductive · abductive · analogical · error-statistical · model-based
            · non-inferential, equal to the mode of the activity
          examples:
          - '`abductive` for the step that proposes a candidate answer'
    x-comment: one entry per activity instance; the steps may be listed in any order, and their references
      form an acyclic graph
    title: Steps
    description: one entry per activity instance, listed in any order
    examples:
    - posing the problem, formulating the question, testing the candidate answer
