# Retained version 1 contract for background. Do not edit.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/compatibility/background.v1.contract.schema.yml
title: Background record contract
description: The record type `background`, bound to `gnomon:background@1`, with its closed vocabularies.
allOf:
- $ref: https://github.com/esther-poniatowski/gnomon/schemas/compatibility/background.v1.base.schema.yml
required:
- _schema
properties:
  _schema:
    const: gnomon:background@1
    title: Schema
    description: The logical identifier of the contract that the record follows.
  type:
    const: background
  id:
    pattern: ^bg\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
  status:
    enum:
    - provisional
    - stabilized
    - retracted
    - null
  laws:
    items:
      propertyNames:
        enum:
        - name
        - symbol
        - variant
        - signature
        - role
        - expression
        - reading
        - warrant
        - requires
        - rests_on
        - origin
        - range
      properties:
        role:
          enum:
          - evolution
          - input-output
          - measurement
          - state-constraint
          - distribution
          - admissibility
          - null
        warrant:
          enum:
          - derived
          - posited
          - fitted
          - measured
          - computed
          - null
  closure:
    enum:
    - complete
    - partial
    - null
  organization:
    items:
      propertyNames:
        enum:
        - name
        - symbol
        - variant
        - reading
        - relates
        - among
        - realized_by
x-identifier: id
propertyNames:
  enum:
  - _schema
  - title
  - id
  - type
  - status
  - describes
  - laws
  - closure
  - organization
  - maturity
