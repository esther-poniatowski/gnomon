          - array
          - 'null'
          x-template: '[SYMBOL]'
          x-comment: other sources held fixed while this one varies
          title: Conditional on
          description: other sources held fixed while this one varies
        differentiation:
          type:
          - string
          - 'null'
          x-template: '"THE CONSEQUENCE OF THE VARIATION FOR THE CLAIM"'
          x-kind: markdown-line
          x-comment: only content beyond the name
          title: Differentiation
          description: only content beyond the name
    x-comment: one entry per source of variation across instances; empty when the phenomenon occurs once
    title: Scope over instances (index $k$)
    description: 'an instance is a member of the reference class of $S$, or one realization of a system (a trial, a random initialization, a disorder sample); per source of variation, the declared quantities that it varies and the other sources held fixed meanwhile. Each entry also records its source: class member · realization · parameter draw · structure draw · scenario. It records its quantification as well: single instance · typical instance · ensemble summary · ensemble distribution · universal, meaning every member of the admitted class'
    examples:
    - the initialization draw, conditional on a fixed training specification (ensemble distribution);
      every model of the admitted class (universal)
