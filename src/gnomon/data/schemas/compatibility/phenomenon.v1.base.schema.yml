$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/compatibility/phenomenon.v1.base.schema.yml
title: Phenomenon record
description: The fields of a phenomenon record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 1
x-header:
- 'specification: `docs/specification/phenomenon.md`; one file per phenomenon of one target system'
- 'symbols and expressions: `docs/specification/expressions.md`'
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
- specifications follow the order of the specification note
- 'exploratory question: leave the statement, the category, the occurrence and the evidential status empty,
  since the inquiry produces them; fill the candidate observables, the varied indices and the detection
  criterion'
properties:
  title:
    type:
    - string
    - 'null'
    x-template: '"SHORT NAME OF THE PHENOMENON"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  statement:
    type:
    - string
    - 'null'
    x-template: '"THE PHENOMENON IN WORDS: THE BEARER AND ITS BEHAVIOR"'
    x-kind: markdown-line
    x-comment: 'a reading only: the signatures fix the bearer, the manifestations fix the behavior'
    title: Statement
    description: '"[bearer of the phenomenon] [its behavior]", as a reading'
    examples:
    - '"the excitatory population oscillates at gamma frequency"'
  id:
    type:
    - string
    - 'null'
    x-template: phen.TOPIC.NAME
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: phenomenon
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: provisional
    x-vocabulary: .status
    title: Status
    description: the maturity of the phenomenon record, taken by every field that the block `maturity` leaves unmarked
  commitment:
    x-vocabulary: .commitment
    type:
    - string
    - 'null'
    title: Commitment
    description: 'how far the record fixes the phenomenon: `identified`: a definite description and pointers fix the referent · `specified`: the observables and the manifestations are written, and their symbols resolve'
    examples:
    - the geometry of the fixed points of the benchmark networks, named before any kernel is written (identified);
      the same geometry stated by a kernel over the inputs (specified)
  target_system:
    type:
    - string
    - 'null'
    x-template: system.TOPIC
    x-kind: label
    title: Target system
    description: the identifier of the target system whose behavior the phenomenon states
  identification:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      description:
        type:
        - string
        - 'null'
        x-template: '"A DEFINITE DESCRIPTION THAT PICKS OUT THE BEHAVIOR"'
        x-kind: markdown-line
        title: description
        description: a noun phrase that picks out one behavior of the target
        examples:
        - the stationary localized states of the equation, with the branches that organize them
      pointers:
        type:
        - array
        - 'null'
        items:
          type:
          - string
          - 'null'
          x-template: '"POINTER TO A DATA SET, A RESULT OR A PUBLICATION THAT FIXES THE REFERENT"'
        title: pointers
        description: per pointer, a data set, a result or a publication
        examples:
        - the article that reports the phenomenon; a figure of a simulation study
    x-comment: fixes the referent before any observable is declared
    title: Identification
    description: 'what fixes the referent before any observable is declared: a definite description of the behavior, with pointers to the data, the results or the publications that report it'
    examples:
    - the delay between fitting and generalization reported for networks trained on algorithmic tasks
  category:
    x-blank: true
    x-vocabulary: .category
    type:
    - string
    - 'null'
    title: Category
    description: particular occurrence · regularity (effect) · capacity · structural property
    examples:
    - the burst recorded at $t=12$ s (particular occurrence); gamma power increases with stimulus contrast
      (regularity); gating inputs by context (capacity); a low-dimensional representation (structural
      property)
  course:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      index:
        type:
        - string
        - 'null'
        x-template: SYMBOL
        x-kind: label
        x-comment: 'an index set of the target or of this record that orders states in time: time or a training step'
        title: index
        description: 'the symbol of an index set of the target or of this record that orders states in
          time: time or a training step'
        examples:
        - the training step; the time
      grain:
        type:
        - string
        - 'null'
        x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
        x-kind: text
        x-comment: shortest length of a segment of the course; a predicate of the behavior is evaluated
          only on segments at least this long
        title: grain
        description: an expression giving the shortest segment on which a predicate of the behavior is
          evaluated
        examples:
        - one training step; one turnover time of the largest eddies
      varies:
        type:
        - array
        - 'null'
        x-template: '[SYMBOL]'
        x-comment: parameters of the target that change along this course; empty when none does
        title: varies
        description: the symbols of those parameters
        examples:
        - the weights of a network along training
    x-comment: the ordered index along which the behavior unfolds
    title: Course
    description: 'the ordered index along which the behavior unfolds: an index, a grain and the parameters of the target that vary along the course'
    examples:
    - the training steps of a network; the time of a flow
  occurrence:
    x-blank: true
    x-comment: '`not-applicable` for a regularity or a capacity, `state` for a structural property'
    x-vocabulary: .occurrence
    type:
    - string
    - 'null'
    title: Occurrence
    description: 'the class of the occurrences that the phenomenon concerns: state · process · event for a particular occurrence, state for a structural property, not-applicable for a regularity or a capacity'
    examples:
    - the network sits at its fixed point (state); the turbulent flow (process); the first crossing of
      a loss threshold (event)
  index_sets:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          x-template: '"NAME OF THE SET"'
          x-kind: markdown-line
          title: Name
          description: the words that designate the index set
        symbol:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          title: Symbol
          description: the symbol of the index set, unique within the record
        notation:
          type:
          - string
          - 'null'
          x-template: '''LATEX FORM OF THE SYMBOL'''
          x-kind: label
          x-comment: only when the LaTeX form differs from the symbol
          title: Notation
          description: only when the LaTeX form differs from the symbol
        variant:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          x-comment: variant carrying the entry; omit when every member of the class carries it
          title: Variant
          description: variant carrying the entry; omit when every member of the class carries it
        extent:
          type:
          - string
          - 'null'
          x-template: '"SET EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          title: Extent
          description: a set expression over declared symbols naming the members of the index set
        structure:
          x-vocabulary: index_sets.structure
          type:
          - string
          - 'null'
          title: Structure
          description: 'the role of the index set: the index along which the state evolves, or another index, continuous or countable'
        dimensional_formula:
          type:
          - string
          - 'null'
          x-template: '"MONOMIAL OVER BASE DIMENSIONS"'
          pattern: '^(1|(1 */ *)?[A-Za-z][A-Za-z0-9_]*(\^(-?[0-9]+|\(-?[0-9]+(/[0-9]+)?\)))?(( *[*/] *| +)[A-Za-z][A-Za-z0-9_]*(\^(-?[0-9]+|\(-?[0-9]+(/[0-9]+)?\)))?)*)$'
          x-kind: label
          x-comment: optional; the formula of the coordinate that the set indexes, such as L or T
          title: dimensional formula
          description: optional; the dimensional formula of the coordinate that the index set collects,
            such as L for a spatial domain or T for a time axis, so that a derivative along the index is
            checked
          examples:
          - '`L` for a spatial domain; `T` for a time axis'
    x-comment: only sets the observables introduce beyond those the target declares
    title: Index sets
    description: '"[symbol]", with the set expression that it collects and its structure: continuum ·
      discrete set · interval'
    examples:
    - the separation and the lag of a correlation; the order of a structure function; a prediction horizon
  observables:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        reference:
          type:
          - string
          - 'null'
          x-template: system.TOPIC.SYMBOL
          x-kind: label
          x-comment: for an observable the target already declares as a quantity, give only this reference
          title: Reference
          description: for an observable the target already declares as a quantity, give only this reference
        name:
          type:
          - string
          - 'null'
          x-template: '"NAME OF THE OBSERVABLE"'
          x-kind: markdown-line
          title: Name
          description: the words that designate the observable
        symbol:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          title: Symbol
          description: the symbol of the observable, unique within the record
        notation:
          type:
          - string
          - 'null'
          x-template: '''LATEX FORM OF THE SYMBOL'''
          x-kind: label
          x-comment: only when the LaTeX form differs from the symbol
          title: Notation
          description: only when the LaTeX form differs from the symbol
        variant:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          x-comment: symbol of the target variant carrying the entry; omit when every member of the class
            carries it
          title: Variant
          description: symbol of the target variant carrying the entry; omit when every member of the
            class carries it
        signature:
          type:
          - array
          - 'null'
          x-template: '[SYMBOL]'
          x-comment: indices the observable still takes; empty for a scalar
          title: signature (indices $i$ and $t$)
          description: 'the free indices of the definition: a constituent kind, an index set, time, a
            parameter, or a new index that it introduces'
          examples:
          - the spike phase of each neuron over time (two indices); a correlation over separation and
            lag (two indices); a stationary rate (none)
        values:
          type:
          - string
          - 'null'
          x-template: '"SET EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          title: Values
          description: a set expression over declared symbols giving the values of the observable
        scale:
          x-vocabulary: observables.scale
          type:
          - string
          - 'null'
          title: scale
          description: nominal · ordinal · interval · ratio · absolute · not-applicable
          examples:
          - a regime label (nominal); a delay counted in training steps (ratio)
        dimensional_formula:
          type:
          - string
          - 'null'
          x-template: '"MONOMIAL OVER BASE DIMENSIONS"'
          pattern: '^(1|(1 */ *)?[A-Za-z][A-Za-z0-9_]*(\^(-?[0-9]+|\(-?[0-9]+(/[0-9]+)?\)))?(( *[*/] *| +)[A-Za-z][A-Za-z0-9_]*(\^(-?[0-9]+|\(-?[0-9]+(/[0-9]+)?\)))?)*)$'
          x-kind: label
          x-comment: optional; a monomial such as M L T^-2, or 1 for a pure number
          title: dimensional formula
          description: optional; a monomial over the base dimensions and the base scales of the problem,
            such as M L T^-2, or 1 for a pure number
          examples:
          - '`M L T^-2` for a force; `T` for a delay; `1` for a fraction'
        expression:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          x-comment: give for a derived observable
          title: expression
          description: '"[expression over declared symbols]", whose binders consume the indices that it
            aggregates'
          examples:
          - the mean of the constituent rates; the minimum abundance $\min_i N_i$; the delay $t_{gen}-t_{fit}$
        condition:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION THAT THE QUANTITY SATISFIES"'
          x-kind: text
          x-comment: give when no map builds the quantity
          title: Condition
          description: give when no map builds the quantity
        selects:
          x-comment: required with a condition
          x-vocabulary: observables.selects
          type:
          - string
          - 'null'
          title: Selects
          description: 'the reading of a quantity fixed by a condition that several values may satisfy: the unique value, any value, or all of them'
        held_by:
          type:
          - string
          - 'null'
          x-template: RECORD.UNIT
          x-kind: label
          x-comment: optional, with a condition; the law or the consequence of a derivation that establishes a value satisfying the condition
          title: Held by
          description: The law of a background or of a model, or the consequence of a derivation, that establishes a value satisfying the condition; empty while the existence that the condition presupposes is undischarged.
        reading:
          type:
          - string
          - 'null'
          x-template: '"THE EXPRESSION IN WORDS"'
          x-kind: text
          title: Reading
          description: the expression of the observable in words
        event:
          type:
          - object
          - 'null'
          properties:
            origin:
              type:
              - string
              - 'null'
              x-template: '"EXPRESSION FIXING THE ORIGIN OF TIME"'
              x-kind: text
              title: Origin
              description: an expression fixing the origin from which the clock of the event starts
            first_observation:
              type:
              - string
              - 'null'
              x-template: '"EXPRESSION FIXING THE TIME OF THE FIRST OBSERVATION"'
              x-kind: text
              x-comment: required when the censoring is `left`, whose time it bounds; omit when observation
                starts at the origin
              title: First observation
              description: required when the censoring is `left`, whose time it bounds; omit when observation
                starts at the origin
            horizon:
              type:
              - string
              - 'null'
              x-template: '"EXPRESSION FIXING THE END OF OBSERVATION"'
              x-kind: text
              title: Horizon
              description: an expression fixing the end of observation
            censoring:
              x-vocabulary: observables.censoring
              type:
              - string
              - 'null'
              title: Censoring
              description: 'the censoring of the event time: right, left or interval, when the time is unknown, or none, when it is observed'
            reading:
              type:
              - string
              - 'null'
              x-template: '"THE EVENT IN WORDS, AND THE VALUE RECORDED WHEN IT IS NOT OBSERVED"'
              x-kind: markdown-line
              title: Reading
              description: the event in words, and the value recorded when it is not observed
          x-comment: fill when the observable is the time of an event; the observable's `expression` then
            states the event criterion
          title: event
          description: the origin from which the clock starts, the first observation that bounds a left-censored
            time, the horizon at which observation stops, and the censoring (right · left · interval · none)
            for an event whose time is unknown
          examples:
          - a generalization event observed up to a finite training horizon, right-censored when the criterion
            is never met
        estimator:
          type:
          - object
          - 'null'
          properties:
            method:
              type:
              - string
              - 'null'
              x-template: '"THE ESTIMATOR THAT COMPUTES THE VALUES FROM THE DATA"'
              x-kind: markdown-line
              title: Method
              description: the estimator that computes the values from the data
            data_version:
              type:
              - string
              - 'null'
              x-template: VERSION
              x-kind: label
              x-comment: the version of the data on which the estimator runs
              title: Data version
              description: the version of the data on which the estimator runs
            uncertainty:
              type:
              - string
              - 'null'
              x-template: '"THE UNCERTAINTY THAT THE ESTIMATOR REPORTS"'
              x-kind: markdown-line
              title: Uncertainty
              description: the uncertainty that the estimator reports
          x-comment: fill when the values are estimated from data; the estimates are computed from these
            entries, never recorded
          title: estimator
          description: the estimator that computes the values from the data, the version of the data on
            which it runs, and the uncertainty that it reports; the estimates themselves are computed
            from these entries, not recorded
          examples:
          - the peak of the power spectrum, estimated by Welch's method on version 3 of the recordings,
            with a bootstrap interval
    x-comment: functions of the system state that restate the behavior
    title: Observables
    description: a reference to a quantity that the target declares, or "[symbol] ∈ [set expression]"
      with a reading naming it in words
    examples:
    - $Y$ = the regime of the population activity, with values "asynchronous" and "synchronous"
  manifestations:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          x-template: '"NAME OF THE MANIFESTATION"'
          x-kind: markdown-line
          title: Name
          description: the words that designate the manifestation
        symbol:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          title: Symbol
          description: the symbol of the manifestation, unique within the record
        variant:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          x-comment: symbol of the target variant carrying the entry; omit when every member of the class
            carries it
          title: Variant
          description: symbol of the target variant carrying the entry; omit when every member of the
            class carries it
        form:
          x-vocabulary: manifestations.form
          type:
          - string
          - 'null'
          title: Form
          description: 'the form of the manifestation: a value, a dependence, a functional form, a scaling or a relation'
        expression:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          title: Expression
          description: an expression over the observables stating the manifestation
        reading:
          type:
          - string
          - 'null'
          x-template: '"THE MEANING OF THE EXPRESSION"'
          x-kind: text
          x-comment: only content beyond the name and the form
          title: Reading
          description: only content beyond the name and the form
        features:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              name:
                type:
                - string
                - 'null'
                x-template: '"NAME OF THE FEATURE"'
                x-kind: markdown-line
                title: Name
                description: the words that designate the feature
              symbol:
                type:
                - string
                - 'null'
                x-template: SYMBOL
                x-kind: label
                title: Symbol
                description: the symbol of the feature, unique within the record
              values:
                type:
                - string
                - 'null'
                x-template: '"SET EXPRESSION OVER DECLARED SYMBOLS"'
                x-kind: text
                title: Values
                description: a set expression over declared symbols giving the values that the feature can take
              dimensional_formula:
                type:
                - string
                - 'null'
                x-template: '"MONOMIAL OVER BASE DIMENSIONS"'
                pattern: '^(1|(1 */ *)?[A-Za-z][A-Za-z0-9_]*(\^(-?[0-9]+|\(-?[0-9]+(/[0-9]+)?\)))?(( *[*/] *| +)[A-Za-z][A-Za-z0-9_]*(\^(-?[0-9]+|\(-?[0-9]+(/[0-9]+)?\)))?)*)$'
                x-kind: label
                x-comment: optional; a monomial such as M L T^-2, or 1 for a pure number
                title: dimensional formula
                description: optional; a monomial over the base dimensions and the base scales of the
                  problem, such as M L T^-2, or 1 for a pure number
              observed:
                type:
                - string
                - 'null'
                x-template: '"ONE ELEMENT OF THE VALUE SET"'
                x-kind: markdown-line
                title: Observed
                description: the value of the feature observed, one element of its value set
              condition:
                type:
                - string
                - 'null'
                x-template: '"EXPRESSION THAT THE FEATURE SATISFIES"'
                x-kind: text
                x-comment: give when the measurement constrains the feature without fixing its value
                title: Condition
                description: give when the measurement constrains the feature without fixing its value
              selects:
                x-comment: required with a condition
                x-vocabulary: manifestations.selects
                type:
                - string
                - 'null'
                title: Selects
                description: 'the reading of a quantity fixed by a condition that several values may satisfy: the unique value, any value, or all of them'
              held_by:
                type:
                - string
                - 'null'
                x-template: RECORD.UNIT
                x-kind: label
                x-comment: optional, with a condition; the law or the consequence of a derivation that establishes a value satisfying the condition
                title: Held by
                description: The law of a background or of a model, or the consequence of a derivation, that establishes a value satisfying the condition; empty while the existence that the condition presupposes is undischarged.
              procedure:
                type:
                - string
                - 'null'
                x-template: '"THE FINDING THAT THE MEASUREMENT ESTABLISHES"'
                x-kind: markdown-line
                x-comment: only content beyond the name and the value set
                title: Procedure
                description: only content beyond the name and the value set
              caveat:
                type:
                - string
                - 'null'
                x-template: '"THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE
                  OMISSION"'
                x-kind: markdown-line
                title: Caveat
                description: the content of the feature that the record leaves unstated, and the reason for the omission
          x-comment: quantities of the form that characterize the behavior
          title: features
          description: per feature, "[symbol] ∈ [set expression]" with the value observed within that
            set
          examples:
          - the amplitude, the frequency and the phase of an oscillation; the exponents of a scaling law
    x-comment: one entry per form of the observables' behavior
    title: Manifestations
    description: 'per form, "[expression over the observables]" with its form: value · dependence · functional
      form · scaling · relation'
    examples:
    - $Y$ is "synchronous" (value); gamma power increases with contrast (dependence); $m(t)=A\sin(2\pi
      f t+\varphi)$ (functional form); $S_p(r)\sim r^{\zeta_p}$ (scaling); feasibility implies local stability
      (relation)
