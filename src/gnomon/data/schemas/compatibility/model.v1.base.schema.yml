$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/compatibility/model.v1.base.schema.yml
title: Model record
description: The fields of a model record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 1
x-header:
- 'specification: `docs/specification/model.md`; one file per model, which several answers can ground'
- 'symbols and expressions: `docs/specification/expressions.md`'
- declare the constituents, index sets, variables and parameters in target-system form, and the laws and
  organization in background form
- 'no entry refers to one question, and no quantity enters by reference to a target quantity: a binding
  relates the model to its target'
- 'name a symbol of the target by source identifier and symbol: `system.TOPIC.SYMBOL`'
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
- specifications follow the order of the specification note
properties:
  title:
    type:
    - string
    - 'null'
    x-template: '"SHORT NAME OF THE MODEL"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  id:
    type:
    - string
    - 'null'
    x-template: mod.TOPIC.NAME
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: model
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: provisional
    x-vocabulary: .status
    title: Status
    description: the maturity of the model record, taken by every field that the block `maturity` leaves unmarked
  background:
    x-blank: true
    type:
    - string
    - 'null'
    x-template: bg.TOPIC.NAME
    x-kind: label
    x-comment: fill when a law of the model carries the warrant `derived`
    title: Background
    description: 'the record from which the laws of the model are derived: the identifier of one background record'
    examples:
    - the admitted training laws of the networks of a class
  derives_from:
    x-blank: true
    type: [array, 'null']
    x-comment: fill for a derived model; the target system or the models that the operations act on
    title: Derives from
    description: The parent models, such as a target system or another model, from which the operations derive this model.
    items:
      type: [string, 'null']
      x-template: mod.TOPIC.NAME
      x-kind: label
    examples:
    - [system.grokking]
  operations:
    type: [array, 'null']
    x-comment: fill for a derived model; one entry per operation, in the order applied
    title: Operations
    description: The typed operations that derive this model from its parents, in the order in which they are applied.
    items:
      type: object
      properties:
        id:
          type: [string, 'null']
          x-template: OPERATION-NAME
          x-kind: label
          title: Identifier
          description: A descriptive identifier of the operation, unique within the record.
          examples: [weak-amplitude]
        kind:
          type: [string, 'null']
          x-vocabulary: operations.kind
          title: Kind
          description: 'the relation of the derived model to its parent that the operation establishes'
          examples: [approximate]
        acts_on:
          type: [array, 'null']
          x-template: '[SYMBOL]'
          x-comment: symbols of a parent, written `RECORD.SYMBOL`
          title: Acts on
          description: The symbols of a parent on which the operation acts.
          examples: [[system.grokking.u]]
        yields:
          type: [array, 'null']
          x-template: '[SYMBOL]'
          x-comment: symbols of this model that realize the operation
          title: Yields
          description: The symbols of this model that realize the operation.
          examples: [[A]]
        retires:
          type: [array, 'null']
          x-template: '[SYMBOL]'
          x-comment: symbols of a parent that this model no longer carries; empty when every symbol stays visible
          title: Retires
          description: The symbols of a parent that this model no longer carries.
          examples: [[system.grokking.u]]
        regime:
          type: [string, 'null']
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          x-comment: the regime in which the operation holds; required for an approximation
          title: Regime
          description: The regime in which the operation holds, as an expression over declared symbols.
          examples: ['A << 1']
        error:
          type: [string, 'null']
          x-vocabulary: operations.error
          title: Class of error
          description: 'whether the operation introduces an error into the derived model, and whether that error has a known bound'
          examples: [controlled]
        bound:
          type: [string, 'null']
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          x-comment: required when the error is `controlled`
          title: Bound
          description: The bound on the error, for a controlled operation.
          examples: ['O(A^2)']
        order:
          type: [string, 'null']
          x-template: '"THE ORDER IN WHICH THE LIMITS ARE TAKEN"'
          x-kind: markdown-line
          x-comment: required for a singular limit, or for limits that do not commute
          title: Order
          description: The order in which the limits of the operation are taken.
          examples: ['the width to infinity before the time to infinity']
        gain:
          type: [string, 'null']
          x-template: '"THE DERIVATION OR THE FACTOR THAT THE OPERATION MAKES AVAILABLE"'
          x-kind: markdown-line
          title: Gain
          description: The derivation or the factor that the operation makes available.
          examples: ['the amplitude equation of the pattern near onset']
        rests_on:
          type: [string, 'null']
          x-template: '"THE RESULT, THE LIMIT OR THE SOURCE THAT JUSTIFIES THE OPERATION"'
          x-kind: markdown-line
          title: Rests on
          description: The result, the limit or the source that justifies the operation.
          examples: ['the expansion near the onset of instability']
  constituents:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          x-template: '"KIND OF UNIT"'
          x-kind: markdown-line
          title: Name
          description: the kind of unit that the constituent collects
        symbol:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          title: Symbol
          description: the symbol of the constituent, unique within the record
        notation:
          type:
          - string
          - 'null'
          x-template: '''LATEX FORM OF THE SYMBOL'''
          x-kind: label
          x-comment: only when the LaTeX form differs from the symbol
          title: Notation
          description: only when the LaTeX form differs from the symbol
        variant:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          x-comment: symbol of the target variant that the entry models; omit when the model stands for
            every member of the class
          title: Variant
          description: symbol of the target variant that the entry models; omit when the model stands
            for every member of the class
        extent:
          type:
          - string
          - 'null'
          x-template: '"SET EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          title: Extent
          description: a set expression over declared symbols naming the members that the constituent collects
        map:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER THE CONSTITUENTS DECLARED FOR THE TARGET"'
          x-kind: text
          x-comment: give for a unit defined from the target, such as a coarse-graining, a mode decomposition,
            an aggregation or a quotient by a symmetry; omit for a unit of the model alone
          title: Map
          description: give for a unit defined from the target, such as a coarse-graining, a mode decomposition,
            an aggregation or a quotient by a symmetry; omit for a unit of the model alone
    x-comment: 'C: the units that the model treats as bearers'
    title: Constituents $C$
    description: the units that the model treats as bearers
    examples:
    - the slow eigenmodes of the connectivity (defined by a map); the four tipping elements of a box model
      of the Earth system (units of the model alone)
  index_sets:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          x-template: '"NAME OF THE SET"'
          x-kind: markdown-line
