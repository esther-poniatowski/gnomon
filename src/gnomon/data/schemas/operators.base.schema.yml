$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/operators.base.schema.yml
title: Operators record
description: The fields of an operators record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 1
x-header:
- 'specification: `docs/specification/operators.md`; one file per problem'
- declare only operators beyond the framework's canonical set that the problem's records use
- type each operator over sets declared by any record of the problem; declarations are read against every
  record
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
properties:
  title:
    type:
    - string
    - 'null'
    x-template: '"SHORT NAME OF THE PROBLEM THAT THE OPERATORS SERVE"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  id:
    type:
    - string
    - 'null'
    x-template: ops.TOPIC
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: operators
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: provisional
    x-vocabulary: .status
    title: Status
    description: The maturity of the record as a whole, or its retraction.
  target_system:
    type:
    - string
    - 'null'
    x-template: system.TOPIC
    x-kind: label
    title: Target system
    description: the identifier of the target system whose formulas use the operators
  base_scales:
    x-blank: true
    type:
    - array
    - 'null'
    x-comment: optional; one entry per base scale that the dimensional formulas of the problem may name
    title: Base scales
    description: The base scales of the problem, beside the base dimensions of the package, that the
      dimensional formulas of its quantities may name.
    examples:
    - the scale of the parameters and the scale of the loss of a learning system
    items:
      type: object
      properties:
        symbol:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          title: symbol
          description: The symbol of the base scale, unique among the base dimensions.
          examples:
          - '`W` for the scale of the parameters'
        name:
          type:
          - string
          - 'null'
          x-template: '"THE QUANTITY WHOSE SCALE IS INDEPENDENT"'
          x-kind: markdown-line
          title: name
          description: The quantity whose scale the base scale measures.
          examples:
          - '"the scale of the parameters"'
  operators:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          x-template: '"THE QUANTITY THAT THE OPERATOR COMPUTES"'
          x-kind: markdown-line
          title: name
          description: the quantity that the operator computes
          examples:
          - '"the restriction of a field to a region"'
        symbol:
          type:
          - string
          - 'null'
          x-template: SYMBOL
          x-kind: label
          title: symbol
          description: the symbol of the operator, unique within the record
          examples:
          - '`restrict`, `community_jacobian`, `ntk`'
        notation:
          type:
          - string
          - 'null'
          x-template: '''LATEX TEMPLATE'''
          x-kind: label
          x-comment: 'write #0 for the bound indices and #1 for each argument'
          title: notation
          description: 'write #0 for the bound indices and #1 for each argument'
          examples:
          - '`''\nabla \cdot #1''`; `''\operatorname{spec}( #1 )''`'
        for_any:
          type:
          - array
          - 'null'
          x-template: '[SYMBOL]'
          x-comment: type variables the operator is general over, usable in `signature` and `values`;
            omit when the operator acts on declared sets alone
          title: for any (type variables of the operator)
          description: type variables the operator is general over, usable in `signature` and `values`;
            omit when the operator acts on declared sets alone
          examples:
          - '`[S]` for an adjoint, typed `maps(S, S)` to `maps(S, S)`; `[S, n]` for an inner product of
            two vectors'
        signature:
          type:
          - array
          - 'null'
          x-template: '["SET EXPRESSION OVER DECLARED SYMBOLS OR A TYPE VARIABLE"]'
          title: signature
          description: the set of each argument of the operator, as a set expression over declared symbols or a type variable
          examples:
          - '`["maps(Om, pow(reals, 3))"]`'
        values:
          type:
          - string
          - 'null'
          x-template: '"SET EXPRESSION OVER DECLARED SYMBOLS OR A TYPE VARIABLE"'
          x-kind: text
          title: values
          description: the set of the values of the operator, as a set expression over declared symbols or a type variable
          examples:
          - '`"maps(Om, reals)"`; `reals`'
        dimension:
          x-vocabulary: operators.dimension
          type:
          - string
          - 'null'
          x-comment: optional; how the operator combines the dimensional formulas of its arguments
          title: dimension
          description: How the operator combines the dimensional formulas of its arguments; an operator
            that states no rule leaves the formula of its result undecided.
          examples:
          - '`pure-argument` for an exponential'
    title: Operators
    description: the operators that the formulas of the problem use beyond the canonical set, one entry per operator
    examples:
    - the restriction of a field to a region; the Jacobian of a community at equilibrium; the empirical
      neural tangent kernel
  maturity:
    x-blank: true
    type:
    - object
    - 'null'
    additionalProperties:
      x-template-key: FIELD.PATH
      x-template: open
    x-comment: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out'
    title: Maturity
    description: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out'
