$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/assessment.base.schema.yml
title: Assessment record
description: The fields of an assessment record, as the specification of the record documents them.
type: object
x-identifier: id
x-version: 2
x-assessment-test-properties: &assessment-test-properties
  verdict:
    type: [string, 'null']
    x-template: pending
    x-vocabulary: tests.verdict
    x-rules:
    - {check: unresolved-value, value: pending}
    title: Verdict
    description: The result of applying the criterion to the assessed claim.
  evidence:
    type: [string, 'null']
    x-template: '""'
    x-kind: markdown-line
    title: Evidence
    description: The derivation, simulation, measurement or comparison that settles the verdict.
  holds_on:
    type: [string, 'null']
    x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
    x-kind: latex
    title: Holds on
    description: The subdomain over which the evidence still supports the claim after a failed test.
x-header:
- 'specification: `docs/specification/assessment.md`; one file per assessed candidate answer or demanded
  construct'
- 'a construct: name it under `assesses`, its problem under `against`, and keep only `tests.constraints`'
- replace every UPPERCASE placeholder; leave a field empty while it is not filled
- 'admissibility: keep the tests of the core and the tests of the block of the aim of the question; delete
  the tests of the other blocks'
- 'the erotetic relation of the answer routes the tests: a corrective answer holds no aim block, so its
  product test and the tests of its block are `not-applicable`'
- give `not-applicable` to a test whose specification is empty in the question
- fill the appraisal for one answer at a time; name another candidate only when one exists
properties:
  title:
    type:
    - string
    - 'null'
    x-template: '"SHORT NAME OF THE ASSESSMENT"'
    x-kind: markdown-line
    title: Title
    description: A short name of the record, as a label.
  id:
    type:
    - string
    - 'null'
    x-template: assess.TOPIC.NAME
    x-kind: label
    title: Identifier
    description: The identifier of the record, in the dotted form whose prefix names the record type.
  type:
    type:
    - string
    - 'null'
    x-template: assessment
    x-kind: label
    title: Record type
    description: The record type, which fixes the contract that the record follows.
  status:
    type:
    - string
    - 'null'
    x-template: provisional
    x-vocabulary: .status
    title: Status
    description: the maturity of the assessment record, taken by every field that the block `maturity` leaves unmarked
  assesses:
    type:
    - string
    - 'null'
    x-template: ans.TOPIC.NAME
    x-kind: label
    x-comment: the candidate answer, or the record of a construct that a problem demands
    title: Assesses
    description: 'the candidate answer or the construct whose verdicts this record holds: the identifier of one candidate answer, or of the record of a construct that a problem demands, such as a model'
    examples:
    - the answer by inhibitory delay
  against:
    type:
    - string
    - 'null'
    x-template: quest.TOPIC.NAME
    x-kind: label
    x-comment: the question of an answer, or the revised question that a reformulating answer names; the
      problem of a construct
    title: Against
    description: 'the record whose specifications fix which tests apply: for an answer, the identifier of one question, or the revised question that a reformulating answer names; for a construct, the identifier of its problem'
    examples:
    - why the network is synchronous rather than asynchronous
  against_version:
    type:
    - string
    - 'null'
    pattern: ^[1-9][0-9]*$
    x-template: '"1"'
    x-kind: label
    x-comment: the version of the question that the verdicts read; omit for a construct
    title: Against version
    description: the version of the question that the verdicts read; omit for a construct
    examples:
    - '`"1"`'
  tests:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      admissibility:
        type:
        - object
        - 'null'
        properties:
          product:
            type:
            - object
            - 'null'
            # The keys are written out: a YAML 1.2 reader, such as Ekphrasis, takes a merge key `<<` as an
            # ordinary key. They repeat the shared test properties, with the template of the evidence.
            properties:
              verdict:
                type: [string, 'null']
                x-template: pending
                x-vocabulary: tests.verdict
                x-rules:
                - {check: unresolved-value, value: pending}
                title: Verdict
                description: The result of applying the criterion to the assessed claim.
              evidence:
                type: [string, 'null']
                x-template: '"DERIVATION, SIMULATION, MEASUREMENT OR COMPARISON THAT SETTLES THE TEST"'
                x-kind: markdown-line
                title: Evidence
                description: The derivation, simulation, measurement or comparison that settles the verdict.
              holds_on:
                type: [string, 'null']
                x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
                x-kind: latex
                title: Holds on
                description: The subdomain over which the evidence still supports the claim after a failed test.
            title: Product
            description: the verdict on whether the claim is a direct answer of the type that the question fixes, with its evidence
          scope:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Scope
            description: the verdict on whether the domain of the claim covers the reference class restricted by the domain, with its evidence
          grain:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Grain
            description: the verdict on whether the claim specifies the observable at the grain of the question, with its evidence
          individuation:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Individuation
            description: the verdict on whether each bearer of the model is a unit mapped from the constituents of the system, or a unit of the model alone, with its evidence
          binding:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Binding
            description: the verdict on whether the answer cites one binding of each model on which it runs to the phenomenon, with its evidence
          modal-strength:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Modal-strength
            description: the verdict on whether the answer claims the modal strength that the question requests, with its evidence
          values:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of a description
            title: Values
            description: block of a description
          space:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of an exploration
            title: Space
            description: block of an exploration
          outputs:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of a prediction
            title: Outputs
            description: block of a prediction
          contrast:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of an explanation
            title: Contrast
            description: block of an explanation
          relation:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of an explanation
            title: Relation
            description: block of an explanation
          target-status:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of an explanation
            title: Target-status
            description: block of an explanation
          admissible-explanans:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of an explanation
            title: Admissible-explanans
            description: block of an explanation
          witness-or-proof:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of modal knowledge
            title: Witness-or-proof
            description: block of modal knowledge
          consequence:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: block of model properties
            title: Consequence
            description: block of model properties
        x-comment: the tests of the core, then the tests of each aim block
        title: admissibility
        description: per criterion of the tests of the core and of the tests of the block of the aim of
          the question, a verdict — pending · pass · fail · inconclusive · not-applicable — with the evidence that settles
          it
        examples:
        - 'contrast: pass, by producing the asynchronous state in a simulation; admissible explanans:
          not-applicable, since the question bounded the answer to no variables'
      warrant:
        type:
        - object
        - 'null'
        properties:
          phenomenon-established:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Phenomenon-established
            description: the verdict on whether the phenomenon is established before it is explained, with its evidence
          foil-evidence:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Foil-evidence
            description: the verdict on whether the evidence for the contrast comes from the foil itself, with its evidence
          law-warrant:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Law-warrant
            description: the verdict on whether each ground meets what its role requires, with its evidence
          closure:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Closure
            description: the verdict on whether the route fits the target, as the closure of its admitted laws decides, with its evidence
          fidelity:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: name the comparisons that the verdict reads, and how each of their three reports
              bears on it
            title: Fidelity
            description: name the comparisons that the verdict reads, and how each of their three reports
              bears on it
          adequacy-to-use:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            x-comment: replaces fidelity for an answer that declares its use
            title: Adequacy-to-use
            description: replaces fidelity for an answer that declares its use
          robustness:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Robustness
            description: the verdict on whether the claim survives each idealization among its grounds, with its evidence
          selection:
            type:
            - object
            - 'null'
            x-template: '{verdict: pending, evidence: ""}'
            properties: *assessment-test-properties
            title: Selection
            description: the verdict on whether a claim about some members extends to the class after a check for selection bias, with its evidence
        title: warrant
        description: per criterion of the warrant table, a verdict with the evidence that settles it
        examples:
        - 'robustness: fail, since the claim did not survive at finite network size'
      constraints:
        type:
        - array
        - 'null'
        items:
          type: object
          properties:
            constraint:
              type:
              - string
              - 'null'
              x-template: '"NAME OF THE CONSTRAINT"'
              x-kind: markdown-line
              title: Constraint
              description: the name of the constraint of the problem that the entry judges
            verdict:
              type:
              - string
              - 'null'
              x-template: pending
              x-kind: label
              x-rules:
              - {check: unresolved-value, value: pending}
              title: Verdict
              description: 'the verdict on the constraint: pending, pass, fail, inconclusive or not-applicable'
            evidence:
              type:
              - string
              - 'null'
              x-template: '""'
              x-kind: markdown-line
              title: Evidence
              description: the derivation, the simulation, the measurement or the comparison that settles the verdict
        x-comment: an assessment of a construct, in place of the two levels above; one entry per constraint
          of the problem
        title: constraints
        description: per constraint of the problem, its name and a verdict — pending · pass · fail · inconclusive · not-applicable
          — with the evidence that settles it
        examples:
        - 'a model that reproduces the delay within the tolerance of the problem: pass'
    x-comment: 'verdict: pending | pass | fail | inconclusive | not-applicable; on a failed test, holds_on: the subdomain over which the evidence still supports the claim, as an expression over declared symbols'
    title: Tests
    description: 'verdict: pending | pass | fail | inconclusive | not-applicable, with the evidence that settles it, and on a failed test the subdomain over which the evidence still supports the claim, under holds_on'
  comparisons:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          x-template: COMPARISON
          x-kind: label
          title: Id
          description: a name of the comparison, unique within the assessment, by which a verdict cites it
        binding:
          type:
          - string
          - 'null'
          x-template: bind.TOPIC.NAME
          x-kind: label
          title: Binding
          description: the identifier of the binding from which the comparison is computed
        version:
          type:
          - string
          - 'null'
          x-template: VERSION
          x-kind: label
          x-comment: the version of the binding
          title: Version
          description: the version of the binding
        data_version:
          type:
          - string
          - 'null'
          x-template: VERSION
          x-kind: label
          x-comment: the version of the data
          title: Data version
          description: the version of the data
    x-comment: one entry per comparison that a verdict of fidelity reads; the metric and the tolerance
      are read from the question
    title: Comparisons
    description: 'the inputs from which each comparison cited by a verdict is recomputed: per comparison, the binding and its version, and the version of the data; the metric and the tolerance are read from the question'
    examples:
    - version 2 of the binding of the rate model, with version 3 of the recordings
  grounds:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        ground:
          type:
          - string
          - 'null'
          x-template: GROUND
          x-kind: label
          title: Ground
          description: the identifier of the ground of the assessed answer that the entry judges
        verdict:
          type:
          - string
          - 'null'
          x-template: pending
          x-vocabulary: grounds.verdict
          x-rules:
          - {check: unresolved-value, value: pending}
          title: Verdict
          description: 'the verdict on the ground: pending, pass, fail, inconclusive or not-applicable'
        evidence:
          type:
          - string
          - 'null'
          x-template: '"THE DERIVATION, SIMULATION, MEASUREMENT OR COMPARISON THAT SETTLES THE VERDICT"'
          x-kind: markdown-line
          title: Evidence
          description: the derivation, the simulation, the measurement or the comparison that settles the verdict
        step:
          type:
          - string
          - 'null'
          x-template: itin.TOPIC.NAME.STEP
          x-kind: label
          x-comment: the step of an itinerary whose act supplies the evidence; required for a law marked `computed`
          title: Step
          description: the identifier of the step of an itinerary whose act supplies the evidence
        holds_on:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          x-comment: fail only, optional; the subdomain over which the ground still meets its role
          title: Holds on
          description: on a failed ground, the subdomain over which the ground still meets its role
    x-comment: fill to judge grounds of the answer one by one for the test of law warrant; one entry per ground judged, and the verdict of that test agrees with them
    title: Grounds
    description: per ground of the answer judged one by one, its identifier, a verdict with its evidence, and the step of an itinerary that supplies the evidence
    examples:
    - 'the law of the delay: pass, by the simulation of the step that compares it with the derived law'
  obligations:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        obligation:
          type:
          - string
          - 'null'
          x-template: OBLIGATION
          x-kind: label
          title: Obligation
          description: the identifier of the proof obligation of the question that the entry settles
        verdict:
          type:
          - string
          - 'null'
          x-template: pending
          x-vocabulary: obligations.verdict
          x-rules:
          - {check: unresolved-value, value: pending}
          title: Verdict
          description: 'the verdict on the proof obligation: pending, pass, fail, inconclusive or not-applicable'
        evidence:
          type:
          - string
          - 'null'
          x-template: '"THE DERIVATION OR THE COUNTEREXAMPLE THAT SETTLES THE IMPLICATION"'
          x-kind: markdown-line
          title: Evidence
          description: the derivation or the counterexample that settles the implication
        derivation:
          type:
          - string
          - 'null'
          x-template: derivation.TOPIC.NAME
          x-kind: label
          x-comment: optional; the derivation record that settles the obligation
          title: Derivation
          description: The identifier of the derivation record that settles the obligation.
        holds_on:
          type:
          - string
          - 'null'
          x-template: '"EXPRESSION OVER DECLARED SYMBOLS"'
          x-kind: text
          x-comment: fail only, optional; the subdomain over which the implication still holds
          title: Holds on
          description: on a failed obligation, the subdomain over which the implication still holds
    x-comment: one entry per proof obligation of the question, named by its identifier
    title: Obligations
    description: per obligation, its identifier, and a verdict with the derivation or the counterexample that settles it
    examples:
    - 'the necessary direction: pass, by the derivation of Lemma 2; the sufficient direction: fail, by
      a counterexample'
  appraisal:
    x-blank: true
    type:
    - array
    - 'null'
    items:
      type: object
      properties:
        virtue:
          x-vocabulary: appraisal.virtue
          type:
          - string
          - 'null'
          title: Virtue
          description: the virtue that the entry appraises
        assessment:
          type:
          - string
          - 'null'
          x-template: '"THE RESULT OF THE OPERATIONAL QUESTION OF THAT VIRTUE FOR THIS ANSWER"'
          x-kind: markdown-line
          title: Assessment
          description: the result of the operational question of that virtue for this answer
        preferred_over:
          type:
          - string
          - 'null'
          x-template: '"THE CANDIDATES THAT THIS ANSWER OUTRANKS ON THAT VIRTUE"'
          x-kind: markdown-line
          x-comment: fill when other candidates have been assessed
          title: Preferred over
          description: fill when other candidates have been assessed
    x-comment: one entry per `preferred` virtue of the question, only once no test of admissibility or of warrant fails or stays pending; the product test already settles each
      `constitutive` virtue
    title: Appraisal
    description: per virtue, the assessment of this answer, and the candidates over which it is preferred
      once they have been appraised
    examples:
    - 'intelligibility: the oscillation frequency can be read off the delay, without simulating the network'
  credence:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      value:
        type:
        - string
        - 'null'
        x-template: '"NUMBER IN THE INTERVAL FROM 0 TO 1"'
        x-kind: markdown-line
        title: value
        description: a number between 0 and 1
        examples:
        - '0.6'
      basis:
        type:
        - string
        - 'null'
        x-template: '"THE EVIDENCE AND THE PRIOR THAT FIX THE VALUE"'
        x-kind: markdown-line
        title: basis
        description: the evidence and the prior from which the value follows
        examples:
        - two replications at a larger width, from a prior of 0.3
    x-comment: optional; the degree of belief that the assessor places in the answer
    title: Credence
    description: a number between 0 and 1, with the evidence and the prior from which it follows
    examples:
    - 0.6, after two replications at a larger width
  maturity:
    x-blank: true
    type:
    - object
    - 'null'
    additionalProperties:
      x-vocabulary: .maturity
      x-template-key: FIELD.PATH
      x-template: open
    x-comment: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out'
    title: Maturity
    description: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out'
