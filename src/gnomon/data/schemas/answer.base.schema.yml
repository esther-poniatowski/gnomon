        description: the internal steps of a derivation stay in the derivation
    title: Route
    description: '`derivation` · `proof` · `simulation` · `estimation` · `measurement`, the records on
      which it runs (the target, one model, or a family of models), and a pointer to the derivation, the
      code or the data'
    examples:
    - the linear stability analysis of the rate model (derivation, on one model)
  domain:
