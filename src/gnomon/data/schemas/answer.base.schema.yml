      a factor makes no difference is a ground with the role `assumption`
    title: Abstractions
    description: per factor, the factor left out
    examples:
    - the axonal delays of a rate model whose claims bear only on stationary rates; abstraction and the
      truth test
  dependence:
    x-blank: true
    type:
