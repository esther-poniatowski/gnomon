          type:
          - string
          - 'null'
          title: Kind
          description: The kind of the record.
        grounds:
          type:
          - array
          - 'null'
          x-template: '[GROUND]'
          x-comment: grounds of this answer, by identifier
          title: Grounds
          description: grounds of this answer, by identifier
        models:
          type:
          - array
          - 'null'
          x-template: '[mod.TOPIC.NAME]'
          x-comment: 'robustness only: the models compared'
          title: Models
          description: 'robustness only: the models compared'
        result:
          type:
          - string
          - 'null'
          x-template: '"THE RESULT OF THE ANALYSIS"'
          x-kind: markdown-line
          x-comment: omit for a minimal sufficient set
          title: Result
          description: omit for a minimal sufficient set
    x-comment: how the claim depends on its grounds; one entry per result
    title: Dependence
    description: how the claim depends on its grounds per entry, a minimal set of grounds that suffices
      for the claim; the result of a sensitivity analysis over one ground [saltelli2008]; or the result
      of a robustness analysis across models that share the claimed structure [weisberg2006]
    examples:
    - the derivation of the claim requires the mean-field limit and the delay (minimal sufficient set)
  route:
    x-blank: true
    type:
    - object
    - 'null'
    properties:
      kind:
