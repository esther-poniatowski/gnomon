title: Operators record contract
description: The record type `operators`, bound to `gnomon:operators@2`, with its closed vocabularies.
allOf:
- $ref: https://github.com/esther-poniatowski/gnomon/schemas/operators.base.schema.yml
required:
- _schema
properties:
  _schema:
    const: gnomon:operators@2
    title: Schema
    description: The logical identifier of the contract that the record follows.
  type:
    const: operators
    examples:
    - operators
  id:
    pattern: ^ops\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
    examples:
    - ops.topic
  title:
    examples:
    - SHORT NAME OF THE PROBLEM THAT THE OPERATORS SERVE
  status:
    examples:
    - provisional
    enum:
    - provisional
    - stabilized
    - retracted
    - null
  target_system:
    examples:
    - system.TOPIC
  base_scales:
    description: 'The base scales of the problem, beside the base dimensions of the package, that the
      dimensional formulas of its quantities may name.


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
    items:
      propertyNames:
        enum:
        - symbol
        - name
      properties:
        symbol:
          description: 'The symbol of the base scale, unique among the base dimensions.


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
        name:
          description: 'The quantity whose scale the base scale measures.


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
  operators:
    description: 'the operators that the formulas of the problem use beyond the canonical set, one entry
      per operator


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
    items:
      propertyNames:
        enum:
        - name
        - symbol
        - kind
        - notation
        - for_any
        - signature
        - values
        - dimension
      properties:
        name:
          description: 'the quantity that the operator computes


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
        symbol:
          description: 'the symbol of the operator, unique within the record


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
        kind:
          description: 'the kind of the operator; binder when it consumes the indices that it binds


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
          enum:
          - binder
          - map
          - relation
          - set
          - constant
          - null
        notation:
          description: 'write #0 for the bound indices and #1 for each argument


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
        for_any:
          description: 'type variables the operator is general over, usable in `signature` and `values`;
            omit when the operator acts on declared sets alone


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
          items:
            examples:
            - SYMBOL
        signature:
          description: 'the set of each argument of the operator, as a set expression over declared symbols
            or a type variable


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
          items:
            examples:
            - SET EXPRESSION OVER DECLARED SYMBOLS OR A TYPE VARIABLE
        values:
          description: 'the set of the values of the operator, as a set expression over declared symbols
            or a type variable


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
        dimension:
          description: 'How the operator combines the dimensional formulas of its arguments; an operator
            that states no rule leaves the formula of its result undecided.


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/operators.md).'
          enum:
          - preserve
          - product
          - derivative
          - second-derivative
          - derivative-at
          - pure
          - pure-argument
          - statement
          - connective
          - unchecked
          - null
  maturity:
    description: 'optional; one maturity per specification: open | provisional | stabilized; the record
      status applies to every specification left out


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/maturity.md).'
    additionalProperties:
      examples:
      - open
      enum:
      - open
      - provisional
      - stabilized
      - null
