        description: 'the procedures and the data searched, and why they would have detected the behavior
          within the scope


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        examples:
        - THE PROCEDURES AND THE DATA SEARCHED, AND WHY THEY WOULD HAVE DETECTED THE BEHAVIOR
      counterexample:
        description: 'the record or the publication that establishes the counterexample or the contradiction


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
