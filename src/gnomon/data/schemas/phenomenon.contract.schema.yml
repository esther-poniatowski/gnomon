  evidential_status:
    description: 'established across data sets or methods · reported once · predicted, of a target with
      actual members · derived, of a model or of a target without actual members · absent from a closed
      search · disproved · undecided


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    enum:
    - established
    - reported
    - predicted
    - derived
    - absent
    - disproved
    - undecided
    - null
  search:
    description: 'the search behind a negative status, its scope and procedure for an absence, its counterexample
      for a disproof


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
