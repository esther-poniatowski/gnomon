# Generated by `gnomon schemas` from `phenomenon.base.schema.yml` and the vocabulary registry. Edit those, not this file.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/phenomenon.contract.schema.yml
title: Phenomenon record contract
description: The record type `phenomenon`, bound to `gnomon:phenomenon@2`, with its closed vocabularies.
allOf:
- $ref: https://github.com/esther-poniatowski/gnomon/schemas/phenomenon.base.schema.yml
required:
- _schema
properties:
  _schema:
    const: gnomon:phenomenon@2
    title: Schema
    description: The logical identifier of the contract that the record follows.
  type:
    const: phenomenon
    examples:
    - phenomenon
  id:
    pattern: ^phen\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
    examples:
    - phen.topic.name
  title:
    examples:
    - SHORT NAME OF THE PHENOMENON
  statement:
    description: '"[bearer of the phenomenon] [its behavior]", as a reading


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
  status:
    examples:
    - provisional
    enum:
    - provisional
    - stabilized
    - retracted
    - null
  commitment:
    description: 'how far the record fixes the phenomenon: `identified`: a definite description and pointers
      fix the referent · `specified`: the observables and the manifestations are written, and their symbols
      resolve


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    enum:
    - identified
    - specified
    - null
  target_system:
    examples:
    - system.TOPIC
  identification:
    description: 'what fixes the referent before any observable is declared: a definite description of
      the behavior, with pointers to the data, the results or the publications that report it


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    propertyNames:
      enum:
      - description
      - pointers
    properties:
      description:
        description: 'a noun phrase that picks out one behavior of the target


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
      pointers:
        description: 'per pointer, a data set, a result or a publication


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        items:
          examples:
          - POINTER TO A DATA SET, A RESULT OR A PUBLICATION THAT FIXES THE REFERENT
  category:
    description: 'particular occurrence · regularity (effect) · capacity · structural property


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    enum:
    - particular-occurrence
    - regularity
    - capacity
    - structural-property
    - null
  course:
    description: 'the ordered index along which the behavior unfolds: an index, a grain and the parameters
      of the target that vary along the course


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    propertyNames:
      enum:
      - index
      - grain
      - varies
    properties:
      index:
        description: 'the symbol of an index set of the target or of this record that orders states in
          time: time or a training step


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
      grain:
        description: 'an expression giving the shortest segment on which a predicate of the behavior is
          evaluated


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
      varies:
        description: 'the symbols of those parameters


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        items:
          examples:
          - SYMBOL
  occurrence:
    description: 'the class of the occurrences that the phenomenon concerns: state · process · event for
      a particular occurrence, state for a structural property, not-applicable for a regularity or a capacity


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    enum:
    - state
    - process
    - event
    - not-applicable
    - null
  index_sets:
    description: '"[symbol]", with the set expression that it collects and its structure: continuum ·
      discrete set · interval


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    items:
      propertyNames:
        enum:
        - name
        - symbol
        - notation
        - variant
        - extent
        - structure
        - dimensional_formula
      properties:
        name:
          description: 'the words that designate the index set


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - NAME OF THE SET
        symbol:
          description: 'the symbol of the index set, unique within the record


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        notation:
          description: 'only when the LaTeX form differs from the symbol


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - LATEX FORM OF THE SYMBOL
        variant:
          description: 'variant carrying the entry; omit when every member of the class carries it


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        extent:
          description: 'a set expression over declared symbols naming the members of the index set


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SET EXPRESSION OVER DECLARED SYMBOLS
        structure:
          description: 'the role of the index set: the index along which the state evolves, or another
            index, continuous or countable


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          enum:
          - evolution
          - continuum
          - discrete-set
          - null
        dimensional_formula:
          description: 'optional; the dimensional formula of the coordinate that the index set collects,
            such as L for a spatial domain or T for a time axis, so that a derivative along the index
            is checked


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
  observables:
    description: 'a reference to a quantity that the target declares, or "[symbol] ∈ [set expression]"
      with a reading naming it in words


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    items:
      propertyNames:
        enum:
        - reference
        - name
        - symbol
        - notation
        - variant
        - signature
        - values
        - scale
        - dimensional_formula
        - expression
        - condition
        - selects
        - held_by
        - reading
        - event
        - estimator
      properties:
        reference:
          description: 'for an observable the target already declares as a quantity, give only this reference


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - system.TOPIC.SYMBOL
        name:
          description: 'the words that designate the observable


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - NAME OF THE OBSERVABLE
        symbol:
          description: 'the symbol of the observable, unique within the record


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        notation:
          description: 'only when the LaTeX form differs from the symbol


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - LATEX FORM OF THE SYMBOL
        variant:
          description: 'symbol of the target variant carrying the entry; omit when every member of the
            class carries it


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        signature:
          description: 'the free indices of the definition: a constituent kind, an index set, time, a
            parameter, or a new index that it introduces


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          items:
            examples:
            - SYMBOL
        values:
          description: 'a set expression over declared symbols giving the values of the observable


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SET EXPRESSION OVER DECLARED SYMBOLS
        scale:
          description: 'nominal · ordinal · interval · ratio · absolute · not-applicable


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          enum:
          - nominal
          - ordinal
          - interval
          - ratio
          - absolute
          - not-applicable
          - null
        dimensional_formula:
          description: 'optional; a monomial over the base dimensions and the base scales of the problem,
            such as M L T^-2, or 1 for a pure number


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        expression:
          description: '"[expression over declared symbols]", whose binders consume the indices that it
            aggregates


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        condition:
          description: 'give when no map builds the quantity


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - EXPRESSION THAT THE QUANTITY SATISFIES
        selects:
          description: 'the reading of a quantity fixed by a condition that several values may satisfy:
            the unique value, any value, or all of them


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          enum:
          - unique
          - any
          - all
          - null
        held_by:
          description: 'The law of a background or of a model, or the consequence of a derivation, that
            establishes a value satisfying the condition; empty while the existence that the condition
            presupposes is undischarged.


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - RECORD.UNIT
        reading:
          description: 'the expression of the observable in words


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - THE EXPRESSION IN WORDS
        event:
          description: 'the origin from which the clock starts, the first observation that bounds a left-censored
            time, the horizon at which observation stops, and the censoring (right · left · interval ·
            none) for an event whose time is unknown


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          propertyNames:
            enum:
            - origin
            - first_observation
            - horizon
            - censoring
            - reading
          properties:
            origin:
              description: 'an expression fixing the origin from which the clock of the event starts


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - EXPRESSION FIXING THE ORIGIN OF TIME
            first_observation:
              description: 'required when the censoring is `left`, whose time it bounds; omit when observation
                starts at the origin


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - EXPRESSION FIXING THE TIME OF THE FIRST OBSERVATION
            horizon:
              description: 'an expression fixing the end of observation


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - EXPRESSION FIXING THE END OF OBSERVATION
            censoring:
              description: 'the censoring of the event time: right, left or interval, when the time is
                unknown, or none, when it is observed


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              enum:
              - right
              - left
              - interval
              - none
              - null
            reading:
              description: 'the event in words, and the value recorded when it is not observed


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - THE EVENT IN WORDS, AND THE VALUE RECORDED WHEN IT IS NOT OBSERVED
        estimator:
          description: 'the estimator that computes the values from the data, the version of the data
            on which it runs, and the uncertainty that it reports; the estimates themselves are computed
            from these entries, not recorded


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          propertyNames:
            enum:
            - method
            - data_version
            - uncertainty
          properties:
            method:
              description: 'the estimator that computes the values from the data


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - THE ESTIMATOR THAT COMPUTES THE VALUES FROM THE DATA
            data_version:
              description: 'the version of the data on which the estimator runs


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - VERSION
            uncertainty:
              description: 'the uncertainty that the estimator reports


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - THE UNCERTAINTY THAT THE ESTIMATOR REPORTS
  manifestations:
    description: 'per form, "[expression over the observables]" with its form: value · dependence · functional
      form · scaling · relation


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    items:
      propertyNames:
        enum:
        - name
        - symbol
        - variant
        - form
        - expression
        - reading
        - features
      properties:
        name:
          description: 'the words that designate the manifestation


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - NAME OF THE MANIFESTATION
        symbol:
          description: 'the symbol of the manifestation, unique within the record


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        variant:
          description: 'symbol of the target variant carrying the entry; omit when every member of the
            class carries it


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        form:
          description: 'the form of the manifestation: a value, a dependence, a functional form, a scaling
            or a relation


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          enum:
          - value
          - dependence
          - functional-form
          - scaling
          - relation
          - null
        expression:
          description: 'an expression over the observables stating the manifestation


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - EXPRESSION OVER DECLARED SYMBOLS
        reading:
          description: 'only content beyond the name and the form


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - THE MEANING OF THE EXPRESSION
        features:
          description: 'per feature, "[symbol] ∈ [set expression]" with the value observed within that
            set


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          items:
            propertyNames:
              enum:
              - name
              - symbol
              - values
              - dimensional_formula
              - observed
              - condition
              - selects
              - held_by
              - procedure
              - caveat
            properties:
              name:
                description: 'the words that designate the feature


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - NAME OF THE FEATURE
              symbol:
                description: 'the symbol of the feature, unique within the record


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - SYMBOL
              values:
                description: 'a set expression over declared symbols giving the values that the feature
                  can take


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - SET EXPRESSION OVER DECLARED SYMBOLS
              dimensional_formula:
                description: 'optional; a monomial over the base dimensions and the base scales of the
                  problem, such as M L T^-2, or 1 for a pure number


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - MONOMIAL OVER BASE DIMENSIONS
              observed:
                description: 'the value of the feature observed, one element of its value set


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - ONE ELEMENT OF THE VALUE SET
              condition:
                description: 'give when the measurement constrains the feature without fixing its value


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - EXPRESSION THAT THE FEATURE SATISFIES
              selects:
                description: 'the reading of a quantity fixed by a condition that several values may satisfy:
                  the unique value, any value, or all of them


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                enum:
                - unique
                - any
                - all
                - null
              held_by:
                description: 'The law of a background or of a model, or the consequence of a derivation,
                  that establishes a value satisfying the condition; empty while the existence that the
                  condition presupposes is undischarged.


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - RECORD.UNIT
              procedure:
                description: 'only content beyond the name and the value set


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - THE FINDING THAT THE MEASUREMENT ESTABLISHES
              caveat:
                description: 'the content of the feature that the record leaves unstated, and the reason
                  for the omission


                  [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
                examples:
                - THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE OMISSION
  scope_over_instances:
    description: 'an instance is a member of the reference class of $S$, or one realization of a system
      (a trial, a random initialization, a disorder sample); per source of variation, the declared quantities
      that it varies and the other sources held fixed meanwhile. Each entry also records its source: class
      member · realization · parameter draw · structure draw · scenario. It records its quantification
      as well: single instance · typical instance · ensemble summary · ensemble distribution · universal,
      meaning every member of the admitted class


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    items:
      propertyNames:
        enum:
        - name
        - symbol
        - variant
        - over
        - source
        - quantification
        - conditional_on
        - differentiation
      properties:
        name:
          description: 'the words that designate the source of variation


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - NAME OF THE SOURCE OF VARIATION
        symbol:
          description: 'the symbol of the source of variation, unique within the record


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        variant:
          description: 'symbol of the target variant carrying the entry; omit when every member of the
            class carries it


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - SYMBOL
        over:
          description: 'declared quantities this source changes; empty when the instance itself varies


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - &id001
            - SYMBOL
          items:
            examples: *id001
        source:
          description: 'the kind of the source: a class member, a realization, random parameters, a random
            structure or a scenario


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          enum:
          - class-member
          - realization
          - random-parameters
          - random-structure
          - scenario
          - null
        quantification:
          description: 'how the phenomenon ranges over the instances: a single instance, a typical instance,
            an ensemble summary, an ensemble distribution, or every member


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          enum:
          - single
          - typical
          - ensemble-summary
          - ensemble-distribution
          - universal
          - null
        conditional_on:
          description: 'other sources held fixed while this one varies


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - &id002
            - SYMBOL
          items:
            examples: *id002
        differentiation:
          description: 'only content beyond the name


            [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
          examples:
          - THE CONSEQUENCE OF THE VARIATION FOR THE CLAIM
  conditions_and_byproducts:
    description: 'put a factor the question varies among the indices or the scope entries instead


      [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
    propertyNames:
      enum:
      - precipitating
      - inhibiting
      - modulating
      - nonstandard
      - byproducts
    properties:
      precipitating:
        description: 'per condition, an expression over declared symbols with a justification


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        items:
          propertyNames:
            enum:
            - name
            - variant
            - expression
            - justification
          properties:
            name:
              description: 'the words that designate the precipitating condition


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - NAME OF THE CONDITION
            variant:
              description: 'symbol of the target variant carrying the entry; omit when every member of
                the class carries it


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - SYMBOL
            expression:
              description: 'an expression over declared symbols stating the condition that must hold for
                the behavior to occur


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - EXPRESSION OVER DECLARED SYMBOLS
            justification:
              description: 'only content beyond the expression


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - WHY THE CONDITION TRIGGERS THE BEHAVIOR
      inhibiting:
        description: 'per condition, an expression over declared symbols with a justification


          [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
        items:
          propertyNames:
            enum:
            - name
            - variant
            - expression
            - justification
            - caveat
          properties:
            name:
              description: 'the words that designate the inhibiting condition


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - NAME OF THE CONDITION
            variant:
              description: 'symbol of the target variant carrying the entry; omit when every member of
                the class carries it


                [Read the canonical specification](https://github.com/esther-poniatowski/gnomon/blob/main/docs/specification/phenomenon.md).'
              examples:
              - SYMBOL
            expression:
              description: 'an expression over declared symbols stating the condition that prevents the
                behavior


