# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/expressions.schema.yml
title: LaTeX form of each expression
description: 'Generated by `gnomon views`: the LaTeX form of each expression of each record, composed
  from the notations of its symbols and of the operators of its target system. A view is computed from
  the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- expressions
properties:
  _schema:
    const: gnomon:view.expressions@1
    title: Schema
  id:
    const: view.expressions
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  expressions:
    type: array
    x-kind: table
    title: Expressions
    description: per record and field, the expression as written and its LaTeX form
    items:
      type: object
      additionalProperties: false
      required:
      - record
      - field
      - expression
      - latex
      properties:
        record:
          type: string
          x-kind: label
          title: Record
        field:
          type: string
          x-kind: label
          title: Field
        expression:
          type: string
          title: Expression
        latex:
          type: string
          x-kind: latex
          title: LaTeX
