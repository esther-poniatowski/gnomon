# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/itinerary-progress.schema.yml
title: Progress of each itinerary
description: 'Generated by `gnomon views`: each itinerary stage and the complete dependency graph
  of its steps, with the usability state and origins of every output. A view is computed from the
  records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- itineraries
- graph
properties:
  _schema:
    const: gnomon:view.itinerary-progress@4
    title: Schema
  id:
    const: view.itinerary-progress
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  itineraries:
    type: array
    x-kind: table
    title: Itineraries
    description: 'per itinerary, the record that it addresses and its stage, computed from its steps and
      from that record: planned, in-progress, concluded or abandoned'
    items:
      type: object
      additionalProperties: false
      required: [itinerary, addresses, stage]
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        addresses:
          type: string
          x-kind: label
          title: Addresses
        stage:
          type: string
          enum: [planned, in-progress, concluded, abandoned]
          x-kind: label
          title: Stage
  graph:
    type: object
    x-kind: graph
    title: Step dependencies
    description: steps connected by every displayed dependency and by explicit external state origins
    additionalProperties: false
    required: [presentation, nodes, edges]
    properties:
      presentation:
        $ref: https://github.com/esther-poniatowski/gnomon/schemas/views/components/graph-presentation.schema.yml
        x-graph-role: presentation
        title: Presentation profile
      nodes:
        type: array
        x-graph-role: nodes
        title: Steps and external origins
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - category
          - category_label
          - shape
          - marker
          - kind
          - family
          - label
          - link
          - status_axis
          - status
          - root
          - root_label
          - itinerary
          - step
          - activity
          - verdict
          - output
          - state
          - origins
          - external_origin
          properties:
            id:
              type: string
              x-kind: label
              x-graph-role: node-id
              title: Identifier
            category:
              type: string
              enum: [activity, source]
              x-kind: label
              x-graph-role: node-category
              title: Category
            category_label:
              type: string
              x-kind: text
              x-graph-role: node-category-label
              title: Category label
            shape:
              type: string
              enum: [capsule, dashed]
              x-kind: label
              x-graph-role: node-shape
              title: Shape
            marker:
              type: string
              x-kind: label
              x-graph-role: node-marker
              title: Marker
            kind:
              type: string
              x-kind: label
              x-graph-role: node-kind
              title: Kind
            family:
              type: string
              x-kind: label
              x-graph-role: node-family
              title: Family
            label:
              type: string
              x-graph-role: node-label
              title: Outcome
            link:
              type: string
              x-kind: label
              x-graph-role: node-link
              title: Link
              description: output record opened from the node title; empty when no record is named
            status_axis:
              type: string
              x-kind: text
              x-graph-role: node-status-axis
              title: Status axis
            status:
              type: string
              x-kind: text
              x-graph-role: node-status
              title: Status
            root:
              type: boolean
              x-graph-role: node-root
              title: Root
            root_label:
              type: string
              x-kind: text
              x-graph-role: node-root-label
              title: Root label
            itinerary:
              type: string
              x-kind: label
              title: Itinerary
            step:
              type: string
              x-kind: label
              title: Step
            activity:
              type: string
              x-kind: label
              title: Activity
            verdict:
              type: string
              x-kind: label
              title: Norm verdict
            output:
              type: string
              x-kind: label
              title: Output
            state:
              type: string
              enum: [sound, conditional, impeached, not-produced]
              x-kind: label
              title: Output usability
            origins:
              type: array
              uniqueItems: true
              title: Displayed origins
              description: displayed steps whose failed or unsettled norms reach this output
              items:
                type: string
                x-kind: label
            external_origin:
              type: boolean
              title: External origin
              description: whether the current state also originates outside the displayed steps
      edges:
        type: array
        x-graph-role: edges
        title: Relations
        items:
          type: object
          additionalProperties: false
          required: [source, target, kind, label]
          properties:
            source:
              type: string
              x-kind: label
              x-graph-role: edge-source
              title: Source
            target:
              type: string
              x-kind: label
              x-graph-role: edge-target
              title: Target
            kind:
              type: string
              enum: [step-dependency, impeaches, conditions]
              x-kind: label
              x-graph-role: edge-kind
              title: Kind
            label:
              type: string
              x-kind: text
              x-graph-role: edge-label
              title: Label
