# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/itinerary-progress.schema.yml
title: Progress of each itinerary
description: 'Generated by `gnomon views`: the steps of each itinerary in the order of their dependencies,
  with their verdicts. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- steps
- edges
properties:
  _schema:
    const: gnomon:view.itinerary-progress@1
    title: Schema
  id:
    const: view.itinerary-progress
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  steps:
    type: array
    x-kind: table
    title: Steps
    description: 'per step, its activity, its verdict, its output and its state: sound, conditional or
      impeached'
    items:
      type: object
      additionalProperties: false
      required:
      - itinerary
      - step
      - activity
      - verdict
      - output
      - state
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        step:
          type: string
          x-kind: label
          title: Step
        activity:
          type: string
          x-kind: label
          title: Activity
        verdict:
          type: string
          x-kind: label
          title: Verdict
        output:
          type: string
          x-kind: label
          title: Output
        state:
          type: string
          x-kind: label
          title: State
  edges:
    type: array
    x-kind: table
    title: Edges
    description: the dependencies between steps, for a renderer of graphs
    items:
      type: object
      additionalProperties: false
      required:
      - itinerary
      - from
      - to
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        from:
          type: string
          x-kind: label
          title: From
        to:
          type: string
          x-kind: label
          title: To
