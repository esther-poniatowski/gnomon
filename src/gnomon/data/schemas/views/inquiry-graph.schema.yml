# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/inquiry-graph.schema.yml
title: Operational inquiry graph
description: 'Generated by `gnomon views`: the typed research products, epistemic activities and
  directed relations that constitute an inquiry. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- graph
properties:
  _schema:
    const: gnomon:view.inquiry-graph@1
    title: Schema
  id:
    const: view.inquiry-graph
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  graph:
    type: object
    x-kind: graph
    title: Inquiry
    description: products and activities connected by typed, directed relations
    additionalProperties: false
    required:
    - nodes
    - edges
    properties:
      presentation:
        $ref: https://github.com/esther-poniatowski/gnomon/schemas/views/components/graph-presentation.schema.yml
        x-graph-role: presentation
        title: Presentation profile
        description: reusable semantic defaults embedded once in the graph; retained artifacts may omit the profile
      nodes:
        type: array
        x-graph-role: nodes
        title: Nodes
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - category
          - category_label
          - shape
          - marker
          - kind
          - family
          - label
          - link
          - status_axis
          - status
          - root
          - root_label
          properties:
            id:
              type: string
              x-kind: label
              x-graph-role: node-id
              title: Identifier
            category:
              type: string
              enum: [product, activity, source]
              x-kind: label
              x-graph-role: node-category
              title: Category
            category_label:
              type: string
              x-kind: text
              x-graph-role: node-category-label
              title: Category label
            shape:
              type: string
              enum: [rectangle, capsule, dashed]
              x-kind: label
              x-graph-role: node-shape
              title: Shape
            marker:
              type: string
              x-kind: label
              x-graph-role: node-marker
              title: Marker
            kind:
              type: string
              x-kind: label
              x-graph-role: node-kind
              title: Kind
            family:
              type: string
              x-kind: label
              x-graph-role: node-family
              title: Family
            label:
              type: string
              x-graph-role: node-label
              title: Label
            link:
              type: string
              x-kind: label
              x-graph-role: node-link
              title: Link
              description: URI or vault link opened from the node label; empty when the node has no target
            status:
              type: string
              x-kind: label
              x-graph-role: node-status
              title: Status
            status_axis:
              type: string
              x-kind: text
              x-graph-role: node-status-axis
              title: Status axis
            root:
              type: boolean
              x-graph-role: node-root
              title: Root
            root_label:
              type: string
              x-kind: text
              x-graph-role: node-root-label
              title: Root label
      edges:
        type: array
        x-graph-role: edges
        title: Relations
        items:
          type: object
          additionalProperties: false
          required:
          - source
          - target
          - kind
          - label
          properties:
            source:
              type: string
              x-kind: label
              x-graph-role: edge-source
              title: Source
            target:
              type: string
              x-kind: label
              x-graph-role: edge-target
              title: Target
            kind:
              type: string
              x-kind: label
              x-graph-role: edge-kind
              title: Kind
            label:
              type: string
              x-kind: text
              x-graph-role: edge-label
              title: Label
