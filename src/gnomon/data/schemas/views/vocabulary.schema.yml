# The schema of the vocabulary that `gnomon vocabulary` generates in the folder of a problem; the
# record is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/vocabulary.schema.yml
title: Vocabulary of a problem
description: 'Generated by `gnomon vocabulary`: every symbol that the records of one problem declare,
  with its LaTeX form, the symbols reused across records, the operators that the problem may use, and
  the directed relations of its target system. A vocabulary is computed from the records and never
  edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- problem
- generated_by
- symbols
- reused_across_records
- operators
- relations
properties:
  _schema:
    const: gnomon:view.vocabulary@2
    title: Schema
  id:
    type: string
    pattern: '^vocab\.'
    title: Identifier
  type:
    const: vocabulary
    title: Type
  title:
    type: string
    title: Title
  problem:
    type: string
    title: Problem
  generated_by:
    type: string
    title: Generated by
  symbols:
    type: array
    x-kind: table
    title: Symbols
    description: per symbol, the record and the block that declare it, its signature, its name and its
      LaTeX form
    items:
      type: object
      additionalProperties: false
      required:
      - symbol
      - declared_in
      - block
      - signature
      - name
      - latex
      properties:
        symbol:
          type: string
          x-kind: label
          title: Symbol
        declared_in:
          type: string
          x-kind: label
          title: Declared in
        block:
          type: string
          x-kind: label
          title: Block
        signature:
          type: array
          items:
            type: string
          title: Signature
        name:
          type: string
          title: Name
        latex:
          type: string
          x-kind: latex
          title: LaTeX
  reused_across_records:
    type: object
    title: Symbols reused across records
    description: each symbol that several records declare, with those records; the same letter then
      denotes distinct quantities
    additionalProperties:
      type: array
      items:
        type: string
  operators:
    type: object
    additionalProperties: false
    title: Operators
    properties:
      canonical:
        type: array
        items:
          type: string
        title: Canonical operators
      declared:
        type: object
        title: Operators declared by the problem
        additionalProperties:
          type: string
  relations:
    type: array
    x-kind: table
    title: Directed relations
    description: per edge of the relation graph of the target system, its sources, its reach, the
      quantities through which it acts, and its ordered tuples
    items:
      type: object
      additionalProperties: false
      required:
      - edge
      - sources
      - reach
      - through
      - tuples
      properties:
        edge:
          type: string
          x-kind: label
          title: Edge
        sources:
          type: array
          items:
            type: string
          title: Sources
        reach:
          type: string
          x-kind: label
          title: Reach
        through:
          type: array
          items:
            type: string
          title: Through
        tuples:
          type: string
          title: Ordered tuples
