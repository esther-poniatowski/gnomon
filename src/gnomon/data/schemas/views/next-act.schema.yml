# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/next-act.schema.yml
title: Open conditions and ready acts
description: 'Generated by `gnomon views`: the diagnosis of `gnomon status`, with each open condition
  separating required predecessors from ready acts, and each valid appraisal compared by its declared
  rule. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- conditions
- open_conditions
- comparisons
- refuted
- revisions
- signals
- narrowings
properties:
  _schema:
    const: gnomon:view.next-act@8
    title: Schema
  id:
    const: view.next-act
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  coverage:
    $ref: https://github.com/esther-poniatowski/gnomon/schemas/views/components/coverage.schema.yml
  conditions:
    type: array
    x-kind: table
    title: Conditions
    description: per question, route and condition, its state and what shows it
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - route
      - condition
      - state
      - source
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        condition:
          type: string
          x-kind: label
          title: Condition
        state:
          type: string
          x-kind: label
          title: State
        source:
          type: string
          x-kind: label
          title: Source
  open_conditions:
    type: array
    x-kind: records
    title: Open conditions
    description: each open condition and all registered activities that act on it
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - route
      - condition
      - required_predecessors
      - ready_acts
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        condition:
          type: string
          x-kind: label
          title: Condition
        required_predecessors:
          type: array
          x-kind: table
          title: Required predecessors
          description: per waiting activity, its missing inputs and what the activity can produce
            after those inputs exist and its norm passes
          items:
            type: object
            additionalProperties: false
            required:
            - activity
            - missing_inputs
            - required_inputs
            - output_type
            - produces_in
            - may_unblock
            properties:
              activity:
                type: string
                x-kind: label
                title: Before activity
              missing_inputs:
                type: array
                title: Missing unimpeached inputs
                items:
                  type: string
              required_inputs:
                type: array
                title: All required inputs
                items:
                  type: string
              output_type:
                type: string
                x-kind: label
                title: Output type
              produces_in:
                type: array
                title: Recorded in
                description: records or fields that can hold the output; a partial prefix means
                  that the record holds only part of the product type
                items:
                  type: string
              may_unblock:
                type: array
                title: May unblock
                description: waiting activities that can use this output type after the norm passes
                items:
                  type: string
                  x-kind: label
        ready_acts:
          type: array
          x-kind: table
          title: Ready acts
          description: the unranked activities available now and what each can produce if its norm
            passes
          items:
            type: object
            additionalProperties: false
            required:
            - activity
            - required_inputs
            - output_type
            - produces_in
            - may_unblock
            - conditional
            properties:
              activity:
                type: string
                x-kind: label
                title: Activity
              required_inputs:
                type: array
                title: Required inputs
                items:
                  type: string
              output_type:
                type: string
                x-kind: label
                title: Output type
              produces_in:
                type: array
                title: Recorded in
                description: records or fields that can hold the output; a partial prefix means
                  that the record holds only part of the product type
                items:
                  type: string
              may_unblock:
                type: array
                title: May unblock
                description: waiting activities that can use this output type after the norm passes
                items:
                  type: string
                  x-kind: label
              conditional:
                type: boolean
                title: Conditional
  comparisons:
    type: array
    x-kind: records
    title: Comparisons from supplied criteria
    description: each valid appraisal, with the authored inputs and every relation derived by its
      declared rule
    items:
      type: object
      additionalProperties: false
      required:
      - itinerary
      - appraisal
      - question
      - route
      - rule
      - rule_statement
      - selection
      - leading_acts
      - criteria
      - acts
      - judgments
      - relations
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        appraisal:
          type: string
          x-kind: label
          title: Appraisal
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        rule:
          const: ordinal-dominance
          x-kind: label
          title: Rule
        rule_statement:
          type: string
          x-kind: text
          title: Rule statement
        selection:
          type: string
          enum:
          - determined
          - unresolved
          x-kind: label
          title: Selection
        leading_acts:
          type: array
          title: Undominated acts
          items:
            type: string
            x-kind: label
        criteria:
          type: array
          x-kind: table
          title: Supplied criteria
          items:
            type: object
            additionalProperties: false
            required:
            - criterion
            - question
            - scale
            - preferred
            properties:
              criterion:
                type: string
                x-kind: label
                title: Criterion
              question:
                type: string
                x-kind: markdown-line
                title: Question
              scale:
                type: array
                title: Ordered scale
                items:
                  type: string
                  x-kind: label
              preferred:
                type: string
                enum:
                - higher
                - lower
                x-kind: label
                title: Preferred direction
        acts:
          type: array
          x-kind: table
          title: Considered acts
          items:
            type: object
            additionalProperties: false
            required:
            - act
            - activity
            - acts_on
            - available_means
            properties:
              act:
                type: string
                x-kind: label
                title: Act
              activity:
                type: string
                x-kind: label
                title: Activity
              acts_on:
                type: string
                x-kind: label
                title: Acts on
              available_means:
                type: array
                title: Available means
                items:
                  type: string
                  x-kind: markdown-line
        judgments:
          type: array
          x-kind: table
          title: Supplied judgments
          items:
            type: object
            additionalProperties: false
            required:
            - act
            - criterion
            - value
            - basis
            properties:
              act:
                type: string
                x-kind: label
                title: Act
              criterion:
                type: string
                x-kind: label
                title: Criterion
              value:
                type: string
                x-kind: label
                title: Value
              basis:
                type: string
                x-kind: markdown-line
                title: Basis
        relations:
          type: array
          x-kind: table
          title: Pairwise relations
          items:
            type: object
            additionalProperties: false
            required:
            - act
            - other
            - relation
            - better_on
            - worse_on
            - equal_on
            properties:
              act:
                type: string
                x-kind: label
                title: Act
              other:
                type: string
                x-kind: label
                title: Compared with
              relation:
                type: string
                enum:
                - dominates
                - dominated-by
                - equivalent
                - incomparable
                x-kind: label
                title: Relation
              better_on:
                type: array
                title: Better on
                items:
                  type: string
                  x-kind: label
              worse_on:
                type: array
                title: Worse on
                items:
                  type: string
                  x-kind: label
              equal_on:
                type: array
                title: Equal on
                items:
                  type: string
                  x-kind: label
  refuted:
    type: array
    x-kind: table
    title: Refuted conditions
    description: the conditions that call for a revision
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - route
      - condition
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        condition:
          type: string
          x-kind: label
          title: Condition
  revisions:
    type: array
    x-kind: table
    title: Revisions
    description: per revision, its kind and the dependents still to review, each with the relation and
      the warrant class that flag it
    items:
      type: object
      additionalProperties: false
      required:
      - step
      - record
      - kind
      - to_review
      properties:
        step:
          type: string
          x-kind: label
          title: Step
        record:
          type: string
          x-kind: label
          title: Record
        kind:
          type: string
          x-kind: label
          title: Kind
        to_review:
          type: string
          title: To review
  signals:
    type: array
    x-kind: table
    title: Signals
    description: the records impeached or conditional, and the steps whose norm is judged anew
    items:
      type: object
      additionalProperties: false
      required:
      - record
      - signal
      properties:
        record:
          type: string
          x-kind: label
          title: Record
        signal:
          type: string
          title: Signal
  narrowings:
    type: array
    x-kind: table
    title: Narrowings of scope
    description: per answer whose test fails beyond a subdomain that the test names, the scope-narrowing
      revision that the failure proposes
    items:
      type: object
      additionalProperties: false
      required:
      - answer
      - holds_on
      - test
      - assessment
      properties:
        answer:
          type: string
          x-kind: label
          title: Answer
        holds_on:
          type: string
          title: Holds on
        test:
          type: string
          x-kind: label
          title: Test
        assessment:
          type: string
          x-kind: label
          title: Assessment
