# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/exposure.schema.yml
title: Exposure of each answer to revision
description: 'Generated by `gnomon views`: for each answer, every exposing unit reached when Gnomon walks
  its dependencies. The table preserves the kind, reason and recorded route of each finding. The graph collapses
  those findings into answer-to-unit reachability. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- exposures
- graph
properties:
  _schema:
    const: gnomon:view.exposure@6
    title: Schema
  id:
    const: view.exposure
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  coverage:
    $ref: https://github.com/esther-poniatowski/gnomon/schemas/views/components/coverage.schema.yml
  graph:
    type: object
    x-kind: graph
    title: Exposure reachability
    description: answers connected to every exposing unit reached when Gnomon walks their dependencies
    additionalProperties: false
    required: [presentation, nodes, edges]
    properties:
      presentation:
        $ref: https://github.com/esther-poniatowski/gnomon/schemas/views/components/graph-presentation.schema.yml
        x-graph-role: presentation
        title: Presentation profile
      nodes:
        type: array
        x-graph-role: nodes
        title: Answers and exposing units
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - category
          - category_label
          - shape
          - marker
          - kind
          - family
          - label
          - link
          - status_axis
          - status
          - root
          - root_label
          - reference
          - record
          - role
          properties:
            id:
              type: string
              x-kind: label
              x-graph-role: node-id
              title: Identifier
            category:
              const: product
              x-kind: label
              x-graph-role: node-category
              title: Category
            category_label:
              type: string
              x-kind: text
              x-graph-role: node-category-label
              title: Category label
            shape:
              type: string
              x-kind: label
              x-graph-role: node-shape
              title: Shape
            marker:
              type: string
              x-kind: label
              x-graph-role: node-marker
              title: Marker
            kind:
              enum:
              - answer
              - law
              - move
              - posit
              - operation
              - consequence
              - presupposition
              - existence
              - assumption
              - commitment
              x-kind: label
              x-graph-role: node-kind
              title: Kind
            family:
              const: exposure
              x-kind: label
              x-graph-role: node-family
              title: Family
            label:
              type: string
              x-graph-role: node-label
              title: Label
            link:
              type: string
              x-kind: label
              x-graph-role: node-link
              title: Link
              description: authored record opened from the node title
            status_axis:
              const: Exposure role
              x-kind: text
              x-graph-role: node-status-axis
              title: Status axis
            status:
              enum: [Answer, Revisable unit]
              x-kind: text
              x-graph-role: node-status
              title: Status
            root:
              const: false
              x-graph-role: node-root
              title: Root
            root_label:
              const: ''
              x-kind: text
              x-graph-role: node-root-label
              title: Root label
            reference:
              type: string
              x-kind: label
              title: Reference
            record:
              type: string
              x-kind: label
              title: Owning record
            role:
              enum: [answer, revisable-unit]
              x-kind: label
              title: Exposure role
      edges:
        type: array
        x-graph-role: edges
        title: Exposure relations
        items:
          type: object
          additionalProperties: false
          required: [source, target, kind, label, reasons, vias]
          properties:
            source:
              type: string
              x-kind: label
              x-graph-role: edge-source
              title: Answer
            target:
              type: string
              x-kind: label
              x-graph-role: edge-target
              title: Revisable unit
            kind:
              const: exposed-by
              x-kind: label
              x-graph-role: edge-kind
              title: Kind
            label:
              const: exposed by
              x-kind: text
              x-graph-role: edge-label
              title: Label
            reasons:
              type: array
              uniqueItems: true
              title: Reasons
              items:
                type: string
                x-kind: text
            vias:
              type: array
              uniqueItems: true
              title: Routes
              items:
                type: string
                x-kind: text
  exposures:
    type: array
    x-kind: table
    title: Exposures
    description: per answer, each unit that exposes it, the kind of that unit, the reason of the exposure,
      and the record through which the walk reaches it
    items:
      type: object
      additionalProperties: false
      required:
      - answer
      - unit
      - kind
      - reason
      - via
      properties:
        answer:
          type: string
          x-kind: label
          title: Answer
        unit:
          type: string
          x-kind: label
          title: Unit
          description: the reference of the exposing unit
        kind:
          enum:
          - law
          - move
          - posit
          - operation
          - consequence
          - presupposition
          - existence
          - assumption
          - commitment
          x-kind: label
          title: Kind
        reason:
          type: string
          x-kind: text
          title: Reason
          description: the warrant of a law, the error of a move or an operation, or the state of a posit,
            a consequence or a presupposition
        via:
          type: string
          title: Via
          description: '`direct` for a ground of the answer, or the derivation, the presupposition or the
            answer through which the walk reaches the unit'
