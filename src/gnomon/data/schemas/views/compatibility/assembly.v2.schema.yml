# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/compatibility/assembly.v2.schema.yml
title: Assembly of each level
description: 'Generated by `gnomon views`: the components, parts, citations, gaps, limits and excluded
  parts of each level of the inquiry. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- levels
- components
- parts
- citations
- gaps
- limits
- excluded
properties:
  _schema:
    const: gnomon:view.assembly@2
    title: Schema
  id:
    const: view.assembly
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  levels:
    type: array
    x-kind: table
    title: Levels
    description: one row per level, a problem or a question that other questions serve, with the number
      of its parts, the number settled, and its synthesis, the accepted answer to the level that the parts
      support
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - kind
      - title
      - status
      - version
      - parts
      - settled
      - synthesis
      - gaps
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        kind:
          type: string
          x-kind: label
          title: Kind
        title:
          type: string
          title: Title
        status:
          type: string
          x-kind: label
          title: Status
        version:
          type: string
          x-kind: label
          title: Version
        parts:
          type: integer
          title: Parts
        settled:
          type: integer
          title: Settled
        synthesis:
          type: string
          x-kind: label
          title: Synthesis
        gaps:
          type: integer
          title: Gaps
  components:
    type: array
    x-kind: table
    title: Components
    description: one row per question that serves a level, with its link; `supplies` marks a component
      whose answers are parts, and `deferred` names the exclusion that defers it
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - component
      - link
      - supplies
      - answers
      - accepted
      - settled
      - deferred
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        component:
          type: string
          x-kind: label
          title: Component
        link:
          type: string
          x-kind: label
          title: Link
        supplies:
          type: boolean
          title: Supplies
        answers:
          type: string
          x-kind: label
          title: Answers
        accepted:
          type: string
          x-kind: label
          title: Accepted
        settled:
          type: boolean
          title: Settled
        deferred:
          type: string
          x-kind: label
          title: Deferred
  parts:
    type: array
    x-kind: table
    title: Parts
    description: one row per answer to a supplying component, and per construct that a step obtains for
      it, with the state of its assessments
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - part
      - component
      - kind
      - status
      - erotetic
      - assessment
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        part:
          type: string
          x-kind: label
          title: Part
        component:
          type: string
          x-kind: label
          title: Component
        kind:
          type: string
          x-kind: label
          title: Kind
        status:
          type: string
          x-kind: label
          title: Status
        erotetic:
          type: string
          x-kind: label
          title: Erotetic relation
        assessment:
          type: string
          x-kind: label
          title: Assessment
  citations:
    type: array
    x-kind: table
    title: Citations
    description: one row per citation between the questions of a level, a link between them or an edge
      between their answers, named in `through`
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - source
      - target
      - relation
      - through
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        source:
          type: string
          x-kind: label
          title: Source
        target:
          type: string
          x-kind: label
          title: Target
        relation:
          type: string
          x-kind: label
          title: Relation
        through:
          type: string
          title: Through
  gaps:
    type: array
    x-kind: table
    title: Gaps
    description: 'one row per dependency not yet resolved: an open or deferred component, a missing synthesis,
      or an accepted part without a current satisfied assessment'
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - gap
      - subject
      - detail
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        gap:
          type: string
          x-kind: label
          title: Gap
        subject:
          type: string
          x-kind: label
          title: Subject
        detail:
          type: string
          title: Detail
  limits:
    type: array
    x-kind: table
    title: Limits
    description: 'one row per limit of validity: a domain restriction or the limit of the question, the
      scope of an accepted part or synthesis, or a part out of scope; listed, never combined'
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - part
      - limit
      - unit
      - statement
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        part:
          type: string
          x-kind: label
          title: Part
        limit:
          type: string
          x-kind: label
          title: Limit
        unit:
          type: string
          x-kind: label
          title: Unit
        statement:
          type: string
          title: Statement
  excluded:
    type: array
    x-kind: table
    title: Excluded parts
    description: one row per entry of the field `excludes` of a level question
    items:
      type: object
      additionalProperties: false
      required:
      - level
      - id
      - kind
      - question
      - reading
      - reason
      properties:
        level:
          type: string
          x-kind: label
          title: Level
        id:
          type: string
          x-kind: label
          title: Identifier
        kind:
          type: string
          x-kind: label
          title: Kind
        question:
          type: string
          x-kind: label
          title: Question
        reading:
          type: string
          title: Reading
        reason:
          type: string
          title: Reason
