# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/question-tree.schema.yml
title: Question tree
description: 'Generated by `gnomon views`: the operational hierarchy that connects the problems,
  questions, subquestions, answers, assessments and serving designs of a project. A view is computed
  from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- nodes
- edges
properties:
  _schema:
    const: gnomon:view.question-tree@3
    title: Schema
  id:
    const: view.question-tree
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  nodes:
    type: array
    x-kind: tree
    title: Inquiry hierarchy
    description: each problem, question, answer, assessment or serving design in its parent-child position, with its kind and status
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - title
      - status
      - depth
      properties:
        id:
          type: string
          x-kind: label
          x-tree-role: identifier
          title: Identifier
        kind:
          type: string
          x-kind: label
          x-tree-role: detail
          title: Kind
        title:
          type: string
          x-tree-role: label
          title: Title
        status:
          type: string
          x-kind: label
          x-tree-role: detail
          title: Status
        depth:
          type: integer
          x-tree-role: depth
          title: Depth
  edges:
    type: array
    x-kind: table
    x-collapsed: true
    title: Parent relations
    description: the parent-child relations represented by the hierarchy
    items:
      type: object
      additionalProperties: false
      required:
      - parent
      - child
      properties:
        parent:
          type: string
          x-kind: label
          title: Parent
        child:
          type: string
          x-kind: label
          title: Child
