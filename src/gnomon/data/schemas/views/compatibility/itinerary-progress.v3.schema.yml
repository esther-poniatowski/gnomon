# The retained tabular contract of itinerary progress before the dependency graph.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/compatibility/itinerary-progress.v3.schema.yml
title: Progress of each itinerary
description: 'Generated by `gnomon views`: for each step that names an output, its sound, conditional
  or impeached itinerary state, together with dependencies formed by references to steps of the same
  itinerary. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- itineraries
- steps
- edges
properties:
  _schema:
    const: gnomon:view.itinerary-progress@3
    title: Schema
  id:
    const: view.itinerary-progress
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  itineraries:
    type: array
    x-kind: table
    title: Itineraries
    description: 'per itinerary, the record that it addresses and its stage, computed from its steps and
      from that record: planned, in-progress, concluded or abandoned'
    items:
      type: object
      additionalProperties: false
      required:
      - itinerary
      - addresses
      - stage
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        addresses:
          type: string
          x-kind: label
          title: Addresses
        stage:
          type: string
          enum:
          - planned
          - in-progress
          - concluded
          - abandoned
          x-kind: label
          title: Stage
  steps:
    type: array
    x-kind: table
    title: Steps
    description: per recorded step, its activity, verdict, output reference when present and computed state
    items:
      type: object
      additionalProperties: false
      required:
      - itinerary
      - step
      - activity
      - verdict
      - output
      - state
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        step:
          type: string
          x-kind: label
          title: Step
        activity:
          type: string
          x-kind: label
          title: Activity
        verdict:
          type: string
          x-kind: label
          title: Verdict
        output:
          type: string
          x-kind: label
          title: Output
        state:
          type: string
          x-kind: label
          title: State
  edges:
    type: array
    x-kind: table
    title: Edges
    description: dependencies created when a step names the output of another step in the same itinerary; direct record and source inputs are outside these edges
    items:
      type: object
      additionalProperties: false
      required:
      - itinerary
      - from
      - to
      properties:
        itinerary:
          type: string
          x-kind: label
          title: Itinerary
        from:
          type: string
          x-kind: label
          title: From
        to:
          type: string
          x-kind: label
          title: To
