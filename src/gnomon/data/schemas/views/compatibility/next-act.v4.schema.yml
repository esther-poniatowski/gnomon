# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/compatibility/next-act.v4.schema.yml
title: Open conditions and ready acts
description: 'Generated by `gnomon views`: the diagnosis of `gnomon status`, with each open condition
  grouping the acts that address it. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- conditions
- open_conditions
- refuted
- revisions
- signals
- narrowings
properties:
  _schema:
    const: gnomon:view.next-act@4
    title: Schema
  id:
    const: view.next-act
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  conditions:
    type: array
    x-kind: table
    title: Conditions
    description: per question, route and condition, its state and what shows it
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - route
      - condition
      - state
      - source
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        condition:
          type: string
          x-kind: label
          title: Condition
        state:
          type: string
          x-kind: label
          title: State
        source:
          type: string
          x-kind: label
          title: Source
  open_conditions:
    type: array
    x-kind: records
    title: Open conditions
    description: each open condition and all registered activities that act on it
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - route
      - condition
      - acts
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        condition:
          type: string
          x-kind: label
          title: Condition
        acts:
          type: array
          x-kind: table
          title: Acts
          description: every registered activity that acts on the condition, its readiness, and the
            input types missing
          items:
            type: object
            additionalProperties: false
            required:
            - activity
            - ready
            - missing
            properties:
              activity:
                type: string
                x-kind: label
                title: Activity
              ready:
                type: boolean
                title: Ready
              missing:
                type: string
                title: Missing
  refuted:
    type: array
    x-kind: table
    title: Refuted conditions
    description: the conditions that call for a revision
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - route
      - condition
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        route:
          type: string
          x-kind: label
          title: Route
        condition:
          type: string
          x-kind: label
          title: Condition
  revisions:
    type: array
    x-kind: table
    title: Revisions
    description: per revision, its kind and the dependents still to review, each with the relation and
      the warrant class that flag it
    items:
      type: object
      additionalProperties: false
      required:
      - step
      - record
      - kind
      - to_review
      properties:
        step:
          type: string
          x-kind: label
          title: Step
        record:
          type: string
          x-kind: label
          title: Record
        kind:
          type: string
          x-kind: label
          title: Kind
        to_review:
          type: string
          title: To review
  signals:
    type: array
    x-kind: table
    title: Signals
    description: the records impeached or conditional, and the steps whose norm is judged anew
    items:
      type: object
      additionalProperties: false
      required:
      - record
      - signal
      properties:
        record:
          type: string
          x-kind: label
          title: Record
        signal:
          type: string
          title: Signal
  narrowings:
    type: array
    x-kind: table
    title: Narrowings of scope
    description: per answer whose test fails beyond a subdomain that the test names, the scope-narrowing
      revision that the failure proposes
    items:
      type: object
      additionalProperties: false
      required:
      - answer
      - holds_on
      - test
      - assessment
      properties:
        answer:
          type: string
          x-kind: label
          title: Answer
        holds_on:
          type: string
          title: Holds on
        test:
          type: string
          x-kind: label
          title: Test
        assessment:
          type: string
          x-kind: label
          title: Assessment
