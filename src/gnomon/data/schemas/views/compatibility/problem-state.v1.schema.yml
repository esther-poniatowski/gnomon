# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/compatibility/problem-state.v1.schema.yml
title: State of each problem
description: 'Generated by `gnomon views`: the demand met, the answers and the obstacles of each problem.
  A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- problems
- obstacles
properties:
  _schema:
    const: gnomon:view.problem-state@1
    title: Schema
  id:
    const: view.problem-state
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  problems:
    type: array
    x-kind: table
    title: Problems
    description: one row per problem, with its demand met, its accepted answers and its candidates; `may_close`
      marks a problem whose demand is met while its status is still posed
    items:
      type: object
      additionalProperties: false
      required:
      - problem
      - title
      - status
      - result_type
      - request
      - demand_met
      - presupposition_denied
      - accepted
      - candidates
      - may_close
      properties:
        problem:
          type: string
          x-kind: label
          title: Problem
        title:
          type: string
          title: Title
        status:
          type: string
          x-kind: label
          title: Status
        result_type:
          type: string
          x-kind: label
          title: Result type
        request:
          type: string
          x-kind: label
          title: Request
        demand_met:
          type: string
          x-kind: label
          title: Demand met
        presupposition_denied:
          type: string
          x-kind: label
          title: Presupposition denied
        accepted:
          type: string
          title: Accepted answers
        candidates:
          type: string
          title: Candidates
        may_close:
          type: boolean
          title: May close
  obstacles:
    type: array
    x-kind: table
    title: Obstacles
    description: per problem and obstacle, whether the problem states it and whether the records show
      it
    items:
      type: object
      additionalProperties: false
      required:
      - problem
      - obstacle
      - stated
      - derived
      properties:
        problem:
          type: string
          x-kind: label
          title: Problem
        obstacle:
          type: string
          x-kind: label
          title: Obstacle
        stated:
          type: boolean
          title: Stated
        derived:
          type: boolean
          title: Derived
