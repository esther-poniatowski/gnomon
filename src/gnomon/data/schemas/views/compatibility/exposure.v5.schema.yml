# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/compatibility/exposure.v5.schema.yml
title: Exposure of each answer to revision
description: 'Generated by `gnomon views`: for each answer, every unit reached by walking its dependencies
  back that exposes it to revision: the laws marked posited, fitted or measured, the derived laws whose
  descent is recorded nowhere, and the posits, the moves and the operations of the derivations on which
  it rests, the presuppositions of its claim that no record holds, and the existence that the
  conditions of its quantities presuppose. A unit whose state its record
  does not state counts as exposed. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- source_state
- exposures
properties:
  _schema:
    const: gnomon:view.exposure@5
    title: Schema
  id:
    const: view.exposure
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  source_state:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    title: Source state
    description: digest of the canonical authored records from which this view was generated
  coverage:
    $ref: https://github.com/esther-poniatowski/gnomon/schemas/views/components/coverage.schema.yml
  exposures:
    type: array
    x-kind: table
    title: Exposures
    description: per answer, each unit that exposes it, the kind of that unit, the reason of the exposure,
      and the record through which the walk reaches it
    items:
      type: object
      additionalProperties: false
      required:
      - answer
      - unit
      - kind
      - reason
      - via
      properties:
        answer:
          type: string
          x-kind: label
          title: Answer
        unit:
          type: string
          x-kind: label
          title: Unit
          description: the reference of the exposing unit
        kind:
          enum:
          - law
          - move
          - posit
          - operation
          - consequence
          - presupposition
          - existence
          - assumption
          - commitment
          x-kind: label
          title: Kind
        reason:
          type: string
          x-kind: text
          title: Reason
          description: the warrant of a law, the error of a move or an operation, or the state of a posit,
            a consequence or a presupposition
        via:
          type: string
          title: Via
          description: '`direct` for a ground of the answer, or the derivation, the presupposition or the
            answer through which the walk reaches the unit'
