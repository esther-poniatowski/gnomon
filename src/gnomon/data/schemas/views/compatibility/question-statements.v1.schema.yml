# The schema of a view that `gnomon views` generates; the view is read-only.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/gnomon/schemas/views/compatibility/question-statements.v1.schema.yml
title: Statement of each question
description: 'Generated by `gnomon views`: the statement of each question, authored and composed from
  its fields in the statement frame. A view is computed from the records and never edited.'
type: object
readOnly: true
additionalProperties: false
required:
- _schema
- id
- type
- title
- generated_by
- statements
properties:
  _schema:
    const: gnomon:view.question-statements@1
    title: Schema
  id:
    const: view.question-statements
    title: Identifier
  type:
    const: view
    title: Type
  title:
    type: string
    title: Title
  generated_by:
    type: string
    title: Generated by
  statements:
    type: array
    x-kind: table
    title: Statements
    description: per question, the statement authored and the statement composed from its fields; the
      slots that the fields leave unfilled are written in brackets and listed under gaps
    items:
      type: object
      additionalProperties: false
      required:
      - question
      - aim
      - authored
      - composed
      - gaps
      properties:
        question:
          type: string
          x-kind: label
          title: Question
        aim:
          type: string
          x-kind: label
          title: Epistemic aim
        authored:
          type: string
          x-kind: label
          title: Authored statement
        composed:
          type: string
          x-kind: label
          title: Composed statement
        gaps:
          type: string
          x-kind: label
          title: Unfilled slots
