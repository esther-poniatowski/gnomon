# Export of the research units of a source repository, read by `ekthesis`.
# The source generates the export and commits it; no author edits it. The decision on the export
# contract states the meaning of each field.
$schema: https://json-schema.org/draft/2020-12/schema
$id: export.schema.yaml
title: Research export
description: >-
  The units that a source repository states and the relations between them, each relation mapped
  onto a class of this contract, so that an exposition can verify the relations that it presents.
type: object
readOnly: true
additionalProperties: false
required: [_schema, id, type, source, generated_by, findings_overridden, units, relations]
properties:
  _schema:
    const: 'ekthesis:export@1'
    title: Schema
    description: identifier of the contract that the export follows
    examples: ['ekthesis:export@1']
  id:
    type: string
    pattern: '^export\.[a-z0-9]+(-[a-z0-9]+)*$'
    x-kind: label
    title: Identifier
    description: identifier of the export, named after its source repository
    examples: [export.mixture]
  type:
    const: export
    title: Type
    description: the type of the record
    examples: [export]
  source:
    $ref: '#/$defs/source'
    title: Source
    description: the repository that states the units, and the tool that generated the export
  generated_by:
    type: string
    minLength: 1
    x-kind: label
    title: Generated by
    description: the command that generated the export
    examples: [gnomon export]
  findings_overridden:
    type: boolean
    title: Findings overridden
    description: >-
      true when the source generated the export although its own check reported an error, so that
      a reader can tell such an export from a clean one
    examples: [false]
  units:
    type: array
    x-kind: table
    items: {$ref: '#/$defs/unit'}
    title: Units
    description: the units of the source, each with its statement; every end of a relation is one of them
  relations:
    type: array
    x-kind: table
    items: {$ref: '#/$defs/relation'}
    title: Relations
    description: every relation between two units of the export that maps onto a class of the contract

$defs:
  unit-identifier:
    type: string
    pattern: '^[a-z][a-z0-9-]*(\.[A-Za-z0-9][A-Za-z0-9_-]*)+$'
    x-kind: label
    description: >-
      the dotted identifier of a unit in its source: the identifier of a record, followed by the
      segments of a unit inside it

  source:
    type: object
    additionalProperties: false
    required: [repository, tool]
    properties:
      repository:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        x-kind: label
        title: Repository
        description: the identifier of the source repository, as its repository record declares it
        examples: [mixture]
      tool:
        type: string
        minLength: 1
        x-kind: label
        title: Tool
        description: the tool that generated the export
        examples: [gnomon]

  unit:
    type: object
    additionalProperties: false
    required: [id, record, unit, kind, record_kind, statement, status]
    properties:
      id:
        $ref: '#/$defs/unit-identifier'
        title: Identifier
        description: identifier of the unit, unique in the export, and stable while the unit keeps its content
        examples: [ans.mixture.gain-shift]
      record:
        $ref: '#/$defs/unit-identifier'
        title: Record
        description: identifier of the record that holds the unit, equal to the identifier for a record
        examples: [ans.mixture.gain-shift]
      unit:
        type: string
        x-kind: label
        title: Unit
        description: the segments of the identifier after the record, empty for a record
        examples: ['', grounds.shape]
      kind:
        type: string
        minLength: 1
        x-kind: label
        title: Kind
        description: >-
          the kind of the unit, such as a claim, a definition or a question; an opaque label in
          this version of the contract
        examples: [claim]
      record_kind:
        type: string
        minLength: 1
        x-kind: label
        title: Record kind
        description: the kind of the record in the source, opaque to the reader
        examples: [answer]
      statement:
        type: string
        x-kind: markdown-line
        title: Statement
        description: the unit in words, as its source states it
        examples: [the gain shifts the fixed points of the mixture]
      status:
        type: string
        x-kind: label
        title: Status
        description: the status of the unit in its source, empty when the source states none
        examples: [accepted]
      version:
        type: string
        x-kind: label
        title: Version
        description: the version of the unit, for a unit that its source versions, such as a question
        examples: ['2']
      superseded_by:
        type: array
        x-kind: list
        uniqueItems: true
        items: {$ref: '#/$defs/unit-identifier'}
        title: Superseded by
        description: the units that revise this one, sorted; empty while the unit stands
        examples: [[ans.mixture.gain-shift-2]]

  relation:
    type: object
    additionalProperties: false
    required: [id, class, relation]
    oneOf:
      - required: [source, target]
        not: {required: [members]}
      - required: [members]
        not: {anyOf: [{required: [source]}, {required: [target]}]}
    properties:
      id:
        type: string
        minLength: 1
        x-kind: label
        title: Identifier
        description: >-
          identifier of the relation, unique in the export and stable while the relation holds, so
          that an argument cites the relation instead of restating it
        examples: [ans.mixture.gain-shift.shape]
      class:
        enum: [support, condition, incompatibility, contrast, elaboration, solutionhood, instance]
        x-kind: label
        title: Class
        description: the class of the contract onto which the source maps its relation
        examples: [support]
      form:
        enum: [set-member, whole-part, process-step, object-attribute, generalization-specific]
        x-kind: label
        title: Form
        description: >-
          the form of an elaboration; the form abstraction and instance is the class instance
        examples: [whole-part]
      source:
        $ref: '#/$defs/unit-identifier'
        title: Source
        description: >-
          the unit from which the relation runs: the supporting unit, the condition, the instance,
          the part, the more specific unit, or the question that a solution answers
        examples: [mod.mixture.rate.gain-law]
      target:
        $ref: '#/$defs/unit-identifier'
        title: Target
        description: the unit to which the relation runs
        examples: [ans.mixture.gain-shift]
      members:
        type: array
        x-kind: list
        minItems: 2
        uniqueItems: true
        items: {$ref: '#/$defs/unit-identifier'}
        title: Members
        description: >-
          the members of a set relation, sorted; the relation holds of the whole set and of none of
          its proper subsets
        examples: [[ans.a.x, ans.a.y, ans.a.z]]
      symmetric:
        type: boolean
        title: Symmetric
        description: true when the relation holds in both directions, as an incompatibility or a contrast does
        examples: [true]
      relation:
        type: string
        minLength: 1
        x-kind: label
        title: Relation
        description: the name of the relation in its source, opaque to the reader
        examples: ['grounds[].record']
      use:
        type: string
        x-kind: label
        title: Use
        description: the role of the relation in its source, such as the role of a ground, opaque to the reader
        examples: [warrant]
