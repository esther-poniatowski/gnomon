# specification: `docs/specification/design.md`; one file per design
# decision: `docs/adr/design-record.md`
# a step, a rule or a mode of failure is named by a descriptive identifier, never by a number
# replace every UPPERCASE placeholder; leave a field empty while it is not filled

_schema: gnomon:design@1
title: "SHORT NAME OF THE DESIGN"
id: design.TOPIC.NAME
type: design
status: provisional              # provisional | stabilized | retracted

kind:                            # experiment (an intervention on the target) | simulation-run (a run of a simulation of a model) | method (a procedure that solves a task) | scheme (a reusable way of deriving, which the segments of derivations apply)
serves: quest.TOPIC.NAME         # the question or the problem that the design serves; optional for a method or a scheme
task: "WHAT AN EXECUTION MUST ACHIEVE"
applies_when:                    # scheme only; one entry per condition of application, each a grammatical expression or a named property
  - "CONDITION OF APPLICATION"

posits:                          # scheme only; one entry per posit that the scheme prescribes, such as an ansatz or a slow scale
  - id: POSIT-NAME
    statement: "THE FORM OR THE RELATION ASSUMED"

inputs:                          # one entry per object that an execution takes
  - name: "NAME OF THE INPUT"
    description: "WHAT THE INPUT HOLDS"

steps:                           # one entry per act, in the order of execution
  - id: STEP-NAME
    act: "THE ACT THAT THE STEP PERFORMS"

rules:                           # one entry per admissible move or decision; empty when none
  - id: RULE-NAME
    rule: "THE MOVE OR THE DECISION THAT THE RULE ADMITS"

output: "WHAT AN EXECUTION YIELDS"
stopping: "THE CONDITION UNDER WHICH AN EXECUTION STOPS"

failure_modes:                   # one entry per way in which an execution or an application can mislead; empty when none
  - mode: "HOW AN EXECUTION CAN MISLEAD"
    guard: STEP-OR-RULE-NAME     # optional; the step or the rule that detects or prevents the failure
    situation: "THE SITUATION THAT ANNOUNCES THE FAILURE"   # scheme only; at the boundary of the conditions of application, or a failure of a posit
    patch: "THE PATCH THAT THE FAILURE CALLS FOR"   # scheme only

protocol:                        # experiment and simulation-run only
  intervention: "THE QUANTITY THAT AN EXECUTION SETS, WITH ITS LEVELS"
  control: "THE CONDITION AGAINST WHICH THE EFFECT IS READ"
  observation: "THE OBSERVABLE RECORDED"

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open
