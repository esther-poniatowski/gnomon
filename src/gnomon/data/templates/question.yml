# specification: `docs/specification/question.md`, `docs/specification/question-subject.md`, `docs/specification/question-task.md`, `docs/specification/question-virtues.md`; one file per question
# commitment of the slots: `docs/epistemology/objects/question/question.md`
# symbols and expressions: `docs/specification/expressions.md`
# name a quantity of another record by source identifier and symbol: `system.TOPIC.SYMBOL`
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# fix the question before evaluating any candidate answer

_schema: gnomon:question@1
title: "SHORT NAME OF THE QUESTION"
statement: "THE QUESTION IN WORDS"   # restate the fields of the subject and the task, from which the view of the record will compose the same question
id: quest.TOPIC.NAME
type: question
status: posed                    # posed | refined | answered | abandoned
addresses: prob.TOPIC.NAME       # the problem that the question serves; omit when no problem record exists
request:                         # one | all | over-a-parameter | decision; the request of the problem that the question serves; empty while the record is a schema
links:                           # questions linked to this question by one of four relations; empty when none
  - question: quest.TOPIC.NAME
    relation:                    # subquestion-of | explanans-from | presupposes | enables
    via: phen.TOPIC.NAME         # the record shared by both questions, such as a phenomenon; omit when they share none
subject:
  target_system: system.TOPIC    # a record identifier; in a question schema, a placeholder written as for `phenomenon`
  background: [bg.TOPIC.NAME]    # background records whose laws the question admits; empty when it admits none
  phenomenon:                    # a record identifier `phen.TOPIC.NAME`; in a question schema, the placeholder below
    placeholder:                 # system | phenomenon
    description: "THE ITEM AWAITED BY THE SLOT"
  contrast:
    locus:                       # other-outcome | other-system | other-condition | none
    foil_set:                    # default: the other values of the explanandum variable
      - name: "NAME OF THE ALTERNATIVE"
        symbol: SYMBOL
        expression: ["EXPRESSION OVER DECLARED SYMBOLS"]
        reading: "THE MEANING OF THE ALTERNATIVE"   # only content beyond the name and the expression
    compatibility: derived       # follows from the locus: `exclusive` for `other-outcome`, `compatible` otherwise
    foil_status:                 # observed | counterfactual | not-applicable
  domain:                        # only restrictions of the a priori specification; assumptions of the analysis belong to the answer
    restrictions:                # one entry per restriction the question imposes on the specification
      - name: "NAME OF THE RESTRICTION"   # required when no quantity names the entry
        of: system.TOPIC.SYMBOL   # quantity held; omit when no single quantity carries the restriction
        restriction:             # clamped | restricted | initial | stationary | without-event; only where the entry names a variable, since a parameter is already fixed
        values: "SET EXPRESSION OVER DECLARED SYMBOLS"   # set the quantity is held to
        expression: "EXPRESSION OVER DECLARED SYMBOLS"   # replaces `values` when no single quantity carries the restriction
        justification: "WHY THE QUESTION IS PUT ONLY UNDER THE RESTRICTION"
    limit:                       # fill only when the question concerns the limit system itself
      expression: "SYMBOL -> LIMIT VALUE"
      justification: "WHY THE QUESTION CONCERNS THE LIMIT SYSTEM"

task:
  epistemic_aim:                 # description | exploration | prediction | explanation | modal-knowledge | model-properties | explication
  explicandum: "TERM OF AN EXPLICANDUM OF THE PROBLEM"   # explication only: the term of an explicandum that the problem addressed by the question names
  requested_relation:            # causal-intervention | causal-mechanistic | constitutive | functional | nomological | statistical | mathematical | not-applicable
  function_sense:                # causal-role | etiological; required when the requested relation is `functional`
  modal_strength:                # actual | possible | necessary
  admissible_explanans:          # optional; when null, proportionality bounds the answer
    compositional: [SYMBOL]      # constituent kinds or index sets whose parts may enter the explanans; empty for the system as a whole
    substrate: null              # specific | independent | mapping
    justification: "WHY THE ANSWER IS BOUND TO THESE VARIABLES"   # also state the shortfall of an answer that draws on other variables
  required_accuracy:
    standard:                    # qualitative | order-of-magnitude | numeric-bound | structural-only | not-applicable
    outputs_to_match:            # name only the target side; the answer reproduces each output
      - target: phen.TOPIC.NAME.SYMBOL
        tolerance:               # omit when the standard is `qualitative` or `structural-only`
          metric: "EXPRESSION OVER `answer` AND `target`"   # measure the difference between `answer` and `target`
          bound: "EXPRESSION THAT THE METRIC MUST NOT EXCEED"
        justification: "WHY THE QUESTION DEMANDS THAT THE ANSWER REPRODUCE THIS OUTPUT"
    structures_to_match:
      - target: phen.TOPIC.NAME.SYMBOL
        justification: "WHY THE QUESTION DEMANDS THAT THE ANSWER REPRODUCE THIS STRUCTURE"
  proof_obligations:             # fill when the answer must derive a statement rather than match a measurement
    - name: "NAME OF THE OBLIGATION"
      reading: "THE IMPLICATION THAT THE ANSWER MUST ESTABLISH, IN WORDS"
      antecedent: ["EXPRESSION OVER DECLARED SYMBOLS"]
      consequent: ["EXPRESSION OVER DECLARED SYMBOLS"]

virtues:                         # one entry per virtue the inquiry weighs, under any epistemic aim
  - virtue:                      # unification | generality | robustness | intelligibility | structural-transparency | economy | tractability
    standing:                    # constitutive (the product test applies it) | preferred (appraisal ranks on it)
    justification: "WHY THE INQUIRY WEIGHS THIS VIRTUE"   # also state the shortfall of an answer that lacks this virtue

presuppositions:                 # fill for a presupposition that neither a link `presupposes` nor the evidential status of the phenomenon states; one entry per presupposition
  - id: PRESUPPOSITION
    part:                        # existence (a result of the demanded type exists) | topic (the fact in question holds)
    reading: "THE PRESUPPOSITION IN WORDS"
    expression: "EXPRESSION OVER DECLARED SYMBOLS"   # optional; empty while the presupposition is not formalized
construction:                    # fill when a procedure is named that would yield a direct answer; the route of construction is then diagnosed
  procedure: RECORD-OR-POINTER   # a design of kind method, or a pointer to the procedure
  reading: "HOW THE PROCEDURE WOULD YIELD A DIRECT ANSWER"

answerability:                   # one entry per condition whose state the inquiry asserts; a condition left out is not established
  - condition:                   # definiteness | answer-type | soundness | candidates | discrimination | access | bridging | representation
    route:                       # selection | construction | both
    term: SYMBOL-OR-RECORD       # definiteness only: the term whose definiteness is stated
    state:                       # established | refuted
    refutation:                  # outright (an argument of impossibility shows that the condition fails) | lack-of-means (every means considered was tried and failed); refuted only
    means:                       # lack-of-means only: every means considered, each tried and failed
      - "A MEANS CONSIDERED, TRIED AND FAILED"
    pointers:                    # the records, the steps or the publications that show the state
      - RECORD-OR-POINTER

maturity:                        # optional; one maturity per field: open | provisional | stabilized; a field left out is provisional
  FIELD.PATH: open
