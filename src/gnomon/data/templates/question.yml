# specification: `docs/specification/question.md`, `docs/specification/question-subject.md`, `docs/specification/question-task.md`, `docs/specification/question-virtues.md`; one file per question
# commitment of the slots: `docs/epistemology/objects/question/question.md`
# symbols and expressions: `docs/specification/expressions.md`
# name a quantity of another record by source identifier and symbol: `system.TOPIC.SYMBOL`
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# fix the question before evaluating any candidate answer

_schema: gnomon:question@3
title: "SHORT NAME OF THE QUESTION"
statement: "THE QUESTION IN WORDS"   # restate the fields of the subject and the task; `gnomon views` composes the subject and the aim beside it
id: quest.TOPIC.NAME
type: question
status: posed                    # posed (the question is stated and not yet revised) | refined (the question was revised since it was first stated) | answered (acts of the researcher meet the demand of its minimal problem) | dissolved (an accepted answer denies a presupposition of the question) | abandoned (the researcher stops the inquiry with the question unanswered)
version: "1"                     # raise by one at each revision of a field that fixes the answers or the tests
addresses: prob.TOPIC.NAME       # the problem that the question serves; omit when no problem record exists
sources:
  - "POINTER TO AN EXISTING NOTE, PUBLICATION, MODEL OR DATA SET"
request:                         # one (one result suffices, with no claim of completeness) | all (every result is required, with a claim of completeness) | over-a-parameter (one result for each value of a parameter) | decision (whether each candidate already proposed meets the constraints); the request of the problem that the question serves; empty while the record is a schema
links:                           # questions linked to this question by one of four relations; empty when none
  - question: quest.TOPIC.NAME
    relation:                    # subquestion-of (a part of an answer to the linked question answers this one) | explanans-from (each answer states an explanans factor over the phenomenon of the linked question) | presupposes (it has a true direct answer only if the linked question has one) | enables (an answer to it establishes a condition of answerability of the linked question)
    via: phen.TOPIC.NAME         # the record shared by both questions, such as a phenomenon; omit when they share none

excludes:                        # one entry per part of the answer that the question leaves out; a part out of scope raises the version, a deferred part does not
  - id: PART
    kind:                        # deferred (left out at the present grain and taken up later, inside the demand) | out-of-scope (outside the demand of the question, which its revision removed)
    question: quest.TOPIC.NAME   # the question of the part, when the part is posed as one; omit otherwise
    reading: "THE PART LEFT OUT, IN WORDS"
    reason: "WHY THE PART IS LEFT OUT"
subject:
  target_system:                 # a record identifier; in a question schema, a placeholder written as for `phenomenon`
    placeholder:                 # system (the slot awaits a target-system record) | phenomenon (the slot awaits a record of a behavior of the target)
    description: "THE ITEM AWAITED BY THE SLOT"
  background: [bg.TOPIC.NAME]    # background records whose laws the question admits; empty when it admits none
  phenomenon:                    # a record identifier `phen.TOPIC.NAME`; in a question schema, the placeholder below
    placeholder:                 # system (the slot awaits a target-system record) | phenomenon (the slot awaits a record of a behavior of the target)
    description: "THE ITEM AWAITED BY THE SLOT"
  contrast:
    locus:                       # other-outcome (same system and conditions, another value of the phenomenon) | other-system (another system, in which the phenomenon is absent) | other-condition (same system, under a different setting or intervention) | none (the question states no contrast)
    foil_set:                    # default: the other values of the explanandum variable
      - name: "NAME OF THE ALTERNATIVE"
        symbol: SYMBOL
        expression: ["EXPRESSION OVER DECLARED SYMBOLS"]
        reading: "THE MEANING OF THE ALTERNATIVE"   # only content beyond the name and the expression
    compatibility: derived       # follows from the locus: `exclusive` for `other-outcome`, `compatible` otherwise
    foil_status:                 # observed (the foil case occurred and has been recorded) | counterfactual (the foil case never occurred and must first be produced) | not-applicable (the question states no foil set)
  domain:                        # only restrictions of the a priori specification; assumptions of the analysis belong to the answer
    restrictions:                # one entry per restriction the question imposes on the specification
      - id: RESTRICTION          # unique within the question; a ground with the role `condition` cites the restriction by it
        name: "NAME OF THE RESTRICTION"   # required when no quantity names the entry
        of: system.TOPIC.SYMBOL   # quantity held; omit when no single quantity carries the restriction
        restriction:             # clamped (a fixed value replaces the rule that determines the variable) | restricted (the variable is held within a stated set of values, by no more specific mode) | initial (only the initial values of the variable are restricted) | stationary (the variable is held to courses whose law is invariant under shifts along the course) | without-event (the variable is held to courses on which a stated event does not occur); only where the entry names a variable, since a parameter is already fixed
        event: "THE EVENT THAT THE ADMITTED COURSES EXCLUDE"   # required with the restriction `without-event`; omit otherwise
        values: "SET EXPRESSION OVER DECLARED SYMBOLS"   # set the quantity is held to
        expression: "EXPRESSION OVER DECLARED SYMBOLS"   # replaces `values` when no single quantity carries the restriction
        justification: "WHY THE QUESTION IS PUT ONLY UNDER THE RESTRICTION"
    limit:                       # fill only when the question concerns the limit system itself
      expression: "SYMBOL -> LIMIT VALUE"
      justification: "WHY THE QUESTION CONCERNS THE LIMIT SYSTEM"

task:
  epistemic_aim:                 # description (what structure the target system has) | exploration (what happens in the system as conditions vary) | prediction (what will occur under specified conditions) | explanation (why or how the phenomenon occurs) | modal-knowledge (what is possible, impossible, necessary or contingent) | model-properties (what follows from a theory or a model) | explication (which criterion should define a term)
  explicandum: "TERM OF AN EXPLICANDUM OF THE PROBLEM"   # explication only: the term of an explicandum that the problem addressed by the question names
  requested_relation:            # causal-intervention (the explanandum changes when a factor is set by intervention) | causal-mechanistic (earlier entities outside the system produce the phenomenon by interactions) | constitutive (organized parts and activities of the system compose the phenomenon) | functional (a part contributes to a capacity or was selected for its effects) | nomological (the explanandum follows from a law) | statistical (the explanandum falls under a probabilistic regularity) | mathematical (a mathematical fact proves the explanandum or excludes its alternatives) | not-applicable (the answer relates no explanans to the explanandum)
  function_sense:                # causal-role (the contribution of a part to a capacity of the system) | etiological (the effects for which the part was selected); required when the requested relation is `functional`
  modal_strength:                # actual (the claim holds of the target system) | possible (the claim is consistent with the admitted laws and the domain) | necessary (no alternative consistent with the admitted laws produces a foil)
  admissible_explanans:          # optional; when null, proportionality bounds the answer
    compositional: [SYMBOL]      # constituent kinds or index sets whose parts may enter the explanans; empty for the system as a whole
    substrate: null              # specific (explanans variables belong to the particular parts of one realization) | independent (explanans variables are shared by every realization of the system) | mapping (how the variables of the parts realize variables shared by all realizations)
    justification: "WHY THE ANSWER IS BOUND TO THESE VARIABLES"   # also state the shortfall of an answer that draws on other variables
  required_accuracy:
    standard:                    # qualitative (agreement in kind with the target, with no tolerance) | order-of-magnitude (the larger of the two values is at most ten times the smaller) | numeric-bound (a stated metric of the difference must not exceed a bound) | structural-only (only structures of the target must correspond, with no values) | not-applicable (the answer is compared with no data of the target)
    outputs_to_match:            # name only the target side; the answer reproduces each output
      - target: phen.TOPIC.NAME.SYMBOL
        tolerance:               # omit when the standard is `qualitative`, `structural-only` or `order-of-magnitude`, which fixes its own
          metric: "EXPRESSION OVER `answer` AND `target`"   # measure the difference between `answer` and `target`
          bound: "EXPRESSION THAT THE METRIC MUST NOT EXCEED"
        justification: "WHY THE QUESTION DEMANDS THAT THE ANSWER REPRODUCE THIS OUTPUT"
    structures_to_match:
      - target: phen.TOPIC.NAME.SYMBOL
        justification: "WHY THE QUESTION DEMANDS THAT THE ANSWER REPRODUCE THIS STRUCTURE"
  proof_obligations:             # fill when the answer must derive a statement rather than match a measurement
    - id: OBLIGATION
      name: "NAME OF THE OBLIGATION"
      reading: "THE IMPLICATION THAT THE ANSWER MUST ESTABLISH, IN WORDS"
      antecedent: ["EXPRESSION OVER DECLARED SYMBOLS"]
      consequent: ["EXPRESSION OVER DECLARED SYMBOLS"]

virtues:                         # one entry per virtue the inquiry weighs, under any epistemic aim
  - virtue:                      # unification (the account explains many phenomena through few common principles) | generality (the explanatory structure extends across cases or parameter regimes) | robustness (conclusions survive changes of parameters, assumptions or representation beyond the declared idealizations) | intelligibility (consequences can be recognized without the full calculation) | structural-transparency (the representation makes components, relations and dependencies salient) | economy (the purpose is achieved without unnecessary complexity) | tractability (the model can be analyzed or computed with available resources)
    standing:                    # constitutive (the product test applies it) | preferred (appraisal ranks on it)
    justification: "WHY THE INQUIRY WEIGHS THIS VIRTUE"   # also state the shortfall of an answer that lacks this virtue

presuppositions:                 # fill for a presupposition that neither a link `presupposes` nor the evidential status of the phenomenon states; one entry per presupposition
  - id: PRESUPPOSITION
    part:                        # existence (a result of the demanded type exists) | topic (the fact in question holds)
    reading: "THE PRESUPPOSITION IN WORDS"
    expression: "EXPRESSION OVER DECLARED SYMBOLS"   # optional; empty while the presupposition is not formalized
construction:                    # fill when a procedure is named that would yield a direct answer; the route of construction is then diagnosed
  procedure: RECORD-OR-POINTER   # a design of kind method, or a pointer to the procedure
  reading: "HOW THE PROCEDURE WOULD YIELD A DIRECT ANSWER"

answerability:                   # one entry per condition whose state the inquiry asserts; a condition left out is not established
  - condition:                   # definiteness (each term has a definition or a criterion adequate to its use) | answer-type (every component of the type of the direct answers is fixed) | soundness (the presuppositions of the question are true) | candidates (at least one proposed answer passes the admissibility tests) | discrimination (a quantity takes different values under the candidates and their alternatives) | access (an available procedure applies to the quantity or the demanded result) | bridging (an inference stated in advance links the quantity to the answer) | representation (the model used for access represents the target to the required accuracy)
    route:                       # selection (a discriminating value singles out one proposed candidate) | construction (a named procedure would yield a direct answer when run) | both (the state holds on each of the two routes)
    term: SYMBOL-OR-RECORD       # definiteness only: the term whose definiteness is stated
    state:                       # established (the records show that the condition holds) | refuted (the records or the literature show that the condition fails)
    refutation:                  # outright (an argument of impossibility shows that the condition fails) | lack-of-means (every means considered was tried and failed); refuted only
    means:                       # lack-of-means only: every means considered, each tried and failed
      - "A MEANS CONSIDERED, TRIED AND FAILED"
    pointers:                    # the records, the steps or the publications that show the state
      - RECORD-OR-POINTER

maturity:                        # optional; one maturity per field: open | provisional | stabilized; a field left out is provisional
  FIELD.PATH: open               # open (not fixed and still expected from the inquiry or the author) | provisional (written and still under revision) | stabilized (no further revision expected in the current state)
