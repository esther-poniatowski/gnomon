# specification: `docs/specification/key.md`; one file per map shared by bindings
# a key carries one side of a binding onto the other; the bindings that use it reference it by identifier and version
# a map that also defines a bearer of a model is stated once, in the model, and the key references that definition
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# specifications follow the order of the specification note

_schema: gnomon:key@2
title: "SHORT NAME OF THE KEY"
id: key.TOPIC.NAME
type: key
status: provisional              # provisional (the record is written and still under revision) | stabilized (the inquiry expects no further revision of the record) | retracted (the record is withdrawn, with all its specifications)

kind:                            # observation-operator (carries a model state to the quantities that the data record) | unit-map (rescales a value of the model by a factor that expresses it in the units of the target) | aggregation-map (carries fine quantities onto coarse bearers, such as a population mean) | qualitative-abstraction (carries trajectories or values onto labels that name the classes of a partition)

domain_and_codomain:             # the two sides that the key connects, each as a set expression or a type
  domain: "SET EXPRESSION OR TYPE"   # the side of the model
  codomain: "SET EXPRESSION OR TYPE"   # the side of the target

expression: "EXPRESSION OVER THE SYMBOLS OF THE DOMAIN, OR A POINTER TO THE PROCEDURE THAT COMPUTES THE MAP"

version: VERSION                 # a version identifier; a revised map is a new version

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open               # open (not fixed and still expected from the inquiry or the author) | provisional (written and still under revision) | stabilized (no further revision expected in the current state)
