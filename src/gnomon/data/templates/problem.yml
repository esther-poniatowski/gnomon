# specification: `docs/specification/problem.md`; one file per research problem
# theory: `docs/epistemology/objects/problem/epistemic-problem.md`, `docs/epistemology/objects/problem/problem-types.md`
# the questions serving this problem name it in their field `addresses`
# replace every UPPERCASE placeholder; leave a field empty while it is not filled

_schema: gnomon:problem@1
title: "SHORT NAME OF THE PROBLEM"
statement: "THE PROBLEM IN WORDS: THE RESULT SOUGHT, AND THE OBSTACLE TO OBTAINING IT"
id: prob.TOPIC.NAME
type: problem
status: posed                    # posed | refined | solved | dissolved | abandoned
kind:                            # empirical (the problem concerns the objects of a domain) | conceptual (the problem concerns the consistency of a theory or its fit with other theories)
demand: "THE RESULT REQUIRED OF A SOLUTION"
result_type:                     # phenomenon | consequence | target-claim | model | explanation | classification | concept | measurement-procedure | design | knowledge-state-change | inter-theory-relation
request:                         # one | all | over-a-parameter | decision
associated_question: quest.TOPIC.NAME   # optional; the question record that states the associated question, whose request equals this one
constraints:                     # conditions on every solution; empty when the demand alone delimits the solutions
  - name: "NAME OF THE CONSTRAINT"
    statement: "THE CONDITION ON A SOLUTION"
    source: "POINTER TO THE RESULT, THE BACKGROUND LAW OR THE PUBLICATION THAT IMPOSES THE CONDITION"
explicanda:                      # terms used in the statement before any record fixes their sense
  - term: "TERM AS USED IN THE STATEMENT"
    pointer: "POINTER TO THE DATA, THE RESULT OR THE PUBLICATION THAT FIXES THE USE OF THE TERM"
sources:
  - "POINTER TO THE PUBLICATION, THE DATA OR THE ANOMALY THAT RAISES THE PROBLEM"
significance: "THE CONSEQUENCES OF A SOLUTION FOR OTHER WORK"
knowledge_obstacles:             # one entry per obstacle in the state of the knowledge about the associated question; empty when none
  - obstacle:                    # open-gap | unassessed-candidates | conflict | unwarranted-claim | ill-defined-terms | unsound-presupposition
    pointers: [RECORD.ID]        # the records or the publications that establish the obstacle
answerability_obstacles:         # one entry per refuted condition of answerability of the associated question; empty when none
  - condition:                   # definiteness | answer-type | discrimination | access | bridging | representation
    refutation:                  # outright | lack-of-means
    pointers: [RECORD.ID]        # the records or the publications that establish the refutation

maturity:                        # optional; one maturity per field: open | provisional | stabilized; a field left out is provisional
  FIELD.PATH: open
