# specification: `docs/specification/operators.md`; one file per problem
# declare only operators beyond the framework's canonical set that the problem's records use
# type each operator over sets declared by any record of the problem; declarations are read against every record
# replace every UPPERCASE placeholder; leave a field empty while it is not filled

_schema: gnomon:operators@2
title: "SHORT NAME OF THE PROBLEM THAT THE OPERATORS SERVE"
id: ops.TOPIC
type: operators
status: provisional              # provisional (the record is written and still under revision) | stabilized (the inquiry expects no further revision of the record) | retracted (the record is withdrawn, with all its specifications)
target_system: system.TOPIC

base_scales:                     # optional; one entry per base scale that the dimensional formulas of the problem may name
  - symbol: SYMBOL
    name: "THE QUANTITY WHOSE SCALE IS INDEPENDENT"

operators:
  - name: "THE QUANTITY THAT THE OPERATOR COMPUTES"
    symbol: SYMBOL
    kind:                        # binder (consumes the indices that it binds) | map (maps its arguments to a value) | relation (states a relation between its arguments) | set (constructs a set) | constant (takes no argument); binder when the operator is written op_{indices} before its arguments
    notation: 'LATEX TEMPLATE'   # write #0 for the bound indices and #1 for each argument
    for_any: [SYMBOL]            # type variables the operator is general over, usable in `signature` and `values`; omit when the operator acts on declared sets alone
    signature: ["SET EXPRESSION OVER DECLARED SYMBOLS OR A TYPE VARIABLE"]
    values: "SET EXPRESSION OVER DECLARED SYMBOLS OR A TYPE VARIABLE"
    dimension:                   # preserve (the formula of the first argument) | product (the sum of the exponents of the arguments) | derivative (the first argument divided by the second) | second-derivative (the first argument divided by the square of the second) | derivative-at (the first argument divided by the second, at a point of the formula of the second) | pure (a pure number, whatever the arguments) | pure-argument (a pure number, from pure arguments only) | statement (a statement, from quantities each checked on its own) | connective (a statement, from statements only) | unchecked (the formula of the result stays undecided, as a declared waiver); optional; how the operator combines the dimensional formulas of its arguments

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open               # open (not fixed and still expected from the inquiry or the author) | provisional (written and still under revision) | stabilized (no further revision expected in the current state)
