# method: `docs/epistemology/target-system.md`; one file per target system
# symbols and expressions: `docs/epistemology/symbols-and-expressions.md`
# the admitted laws, their closure and the organization: `background.yml`, one or more records per target
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# specifications follow the order of the method note

title: "NAME OF THE SYSTEM"
id: system.TOPIC
type: target-system
status: provisional              # provisional | stabilized | retracted
commitment:                      # identified (a definite description and pointers fix the referent) | specified (the record writes its declarations, and their symbols resolve)
target_type:                     # particular | actual-systems | possible-systems | hypothetical | no-external-target

identification:                  # fixes the referent before any quantity is declared
  description: "A DEFINITE DESCRIPTION THAT PICKS OUT THE SYSTEM OR THE CLASS OF SYSTEMS"
  pointers:
    - "POINTER TO A DATA SET, A RESULT OR A PUBLICATION THAT FIXES THE REFERENT"

reference_class:                 # name only; the remaining specifications of the record generate the class
  name: "KIND OF SYSTEM"
  projectibility:                # whether a claim about some members can be projected onto the class
    status:                      # assumed | tested | not-claimed
    evidence: "THE TEST OR THE ARGUMENT THAT SUPPORTS PROJECTING THE CLAIM ONTO THE CLASS"   # omit when the status is `not-claimed`
  selection_criteria:            # fill only when membership depends on an outcome of the dynamics; put a restriction on prior values in the domain of the question that imposes it, since other questions may leave them free
    - name: "NAME OF THE CRITERION"
      expression: "EXPRESSION OVER DECLARED SYMBOLS THAT A MEMBER SATISFIES"
      justification: "THE REASON FOR THIS SELECTION"   # also state how the selection affects the inferences the population supports

variants:                        # forms of a member that differ in their declarations; empty when a single form covers every member
  - name: "NAME OF THE VARIANT"
    symbol: SYMBOL
    differentiation: "THE DECLARATIONS THAT ONLY MEMBERS OF THIS VARIANT CARRY"
    caveat: "THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE OMISSION"

constituents:                    # empty for a field system that decomposes into no unit
  - name: "KIND OF UNIT"
    symbol: SYMBOL
    notation: 'LATEX FORM OF THE SYMBOL'   # only when the LaTeX form differs from the symbol
    variant: SYMBOL              # variant carrying the entry; omit when every member of the class carries it
    extent: "SET EXPRESSION OVER DECLARED SYMBOLS"

index_sets:                      # sets that index a quantity without being units, such as a continuum, a lattice or a sample space
  - name: "NAME OF THE SET"
    symbol: SYMBOL
    notation: 'LATEX FORM OF THE SYMBOL'   # only when the LaTeX form differs from the symbol
    variant: SYMBOL              # variant carrying the entry; omit when every member of the class carries it
    extent: "SET EXPRESSION OVER DECLARED SYMBOLS"
    structure:                   # continuum | discrete-set | interval

variables:                       # quantities that vary while the phenomenon unfolds; the state space is the product of the value sets of the non-aggregate variables determined `within`
  - name: "NAME OF THE VARIABLE"
    symbol: SYMBOL
    notation: 'LATEX FORM OF THE SYMBOL'   # only when the LaTeX form differs from the symbol
    of: SYMBOL                   # external system the entry characterizes; omit when the entry belongs to the target
    variant: SYMBOL              # variant carrying the entry; omit when every member of the class carries it
    determined:                  # within (its value is fixed inside the system) | outside (its value varies but is set beyond the system)
    signature: [SYMBOL]          # one constituent kind or index set per place; empty for the system as a whole
    values: "SET EXPRESSION OVER DECLARED SYMBOLS"
    scale:                       # nominal | ordinal | interval | ratio | absolute | not-applicable
    expression: "EXPRESSION OVER DECLARED SYMBOLS"   # give when a map builds the quantity from declared symbols
    condition: "EXPRESSION THAT THE QUANTITY SATISFIES"   # give when no map builds the quantity
    selects:                     # unique | any | all; required with a condition
    reading: "THE EXPRESSION IN WORDS"
    shared: false                # true when one value holds for every tuple of the signature

parameters:                      # quantities held fixed while the phenomenon unfolds
  - name: "NAME OF THE PARAMETER"
    symbol: SYMBOL
    notation: 'LATEX FORM OF THE SYMBOL'   # only when the LaTeX form differs from the symbol
    of: SYMBOL                   # external system the entry characterizes; omit when the entry belongs to the target
    variant: SYMBOL              # variant carrying the entry; omit when every member of the class carries it
    signature: [SYMBOL, SYMBOL]  # one entry per place, e.g. two neurons for a connectivity weight
    values: "SET EXPRESSION OVER DECLARED SYMBOLS"
    scale:                       # nominal | ordinal | interval | ratio | absolute | not-applicable
    expression: "EXPRESSION OVER DECLARED SYMBOLS"   # give for a derived parameter
    condition: "EXPRESSION THAT THE QUANTITY SATISFIES"   # give when no map builds the quantity
    selects:                     # unique | any | all; required with a condition
    reading: "THE EXPRESSION IN WORDS"
    shared: false                # true when one value holds for every tuple of the signature

external_systems:                # the variables shared with these systems form the target's boundary
  - name: "EXTERNAL SYSTEM"
    symbol: SYMBOL
    variant: SYMBOL              # variant carrying the entry; omit when every member of the class carries it
    class: "SET EXPRESSION OVER DECLARED SYMBOLS"   # candidates for the external system, as a reference class for the target; empty where the record fixes no class
    shares: [SYMBOL]
    constrains:                  # constraints on the shared variables beyond their declared value sets; `[]` when there is none
      - name: "NAME OF THE CONSTRAINT"
        signature: [SYMBOL]      # places the claim ranges over; empty for a claim about the system as a whole
        role:                    # evolution | input-output | measurement | state-constraint | distribution | admissibility
        expression: "EXPRESSION OVER DECLARED SYMBOLS"
        reading: "THE CONSTRAINT IN WORDS"
    reading: "THE INPUT THAT THE EXTERNAL SYSTEM SUPPLIES OR THE CONSTRAINT THAT IT IMPOSES"   # only content beyond the shared variables

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open
