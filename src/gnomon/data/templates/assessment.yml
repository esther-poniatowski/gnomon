# specification: `docs/specification/assessment.md`; one file per assessed candidate answer or demanded construct
# a construct: name it under `assesses`, its problem under `against`, and keep only `tests.constraints`
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# admissibility: keep the tests of the core and the tests of the block of the aim of the question; delete the tests of the other blocks
# the erotetic relation of the answer routes the tests: a corrective answer holds no aim block, so its product test and the tests of its block are `not-applicable`
# give `not-applicable` to a test whose specification is empty in the question
# fill the appraisal for one answer at a time; name another candidate only when one exists

_schema: gnomon:assessment@1
title: "SHORT NAME OF THE ASSESSMENT"
id: assess.TOPIC.NAME
type: assessment
status: provisional              # provisional (the record is written and still under revision) | stabilized (the inquiry expects no further revision of the record) | retracted (the record is withdrawn, with all its specifications)
assesses: ans.TOPIC.NAME         # the candidate answer, or the record of a construct that a problem demands
against: quest.TOPIC.NAME        # the question of an answer, or the revised question that a reformulating answer names; the problem of a construct
against_version: "1"             # the version of the question that the verdicts read; omit for a construct

tests:                           # verdict: pending | pass | fail | inconclusive | not-applicable; on a failed test, holds_on: the subdomain over which the evidence still supports the claim, as an expression over declared symbols
  admissibility:                 # the tests of the core, then the tests of each aim block
    product: {verdict: pending, evidence: "DERIVATION, SIMULATION, MEASUREMENT OR COMPARISON THAT SETTLES THE TEST"}
    scope: {verdict: pending, evidence: ""}
    grain: {verdict: pending, evidence: ""}
    individuation: {verdict: pending, evidence: ""}
    binding: {verdict: pending, evidence: ""}
    modal-strength: {verdict: pending, evidence: ""}
    values: {verdict: pending, evidence: ""}   # block of a description
    space: {verdict: pending, evidence: ""}   # block of an exploration
    outputs: {verdict: pending, evidence: ""}   # block of a prediction
    contrast: {verdict: pending, evidence: ""}   # block of an explanation
    relation: {verdict: pending, evidence: ""}   # block of an explanation
    target-status: {verdict: pending, evidence: ""}   # block of an explanation
    admissible-explanans: {verdict: pending, evidence: ""}   # block of an explanation
    witness-or-proof: {verdict: pending, evidence: ""}   # block of modal knowledge
    consequence: {verdict: pending, evidence: ""}   # block of model properties
  warrant:
    phenomenon-established: {verdict: pending, evidence: ""}
    foil-evidence: {verdict: pending, evidence: ""}
    law-warrant: {verdict: pending, evidence: ""}
    closure: {verdict: pending, evidence: ""}
    fidelity: {verdict: pending, evidence: ""}   # name the comparisons that the verdict reads, and how each of their three reports bears on it
    adequacy-to-use: {verdict: pending, evidence: ""}   # replaces fidelity for an answer that declares its use
    robustness: {verdict: pending, evidence: ""}
    selection: {verdict: pending, evidence: ""}
  constraints:                   # an assessment of a construct, in place of the two levels above; one entry per constraint of the problem
    - constraint: "NAME OF THE CONSTRAINT"
      verdict: pending
      evidence: ""

comparisons:                     # one entry per comparison that a verdict of fidelity reads; the metric and the tolerance are read from the question
  - id: COMPARISON
    binding: bind.TOPIC.NAME
    version: VERSION             # the version of the binding
    data_version: VERSION        # the version of the data

grounds:                         # fill to judge grounds of the answer one by one for the test of law warrant; one entry per ground judged, and the verdict of that test agrees with them
  - ground: GROUND
    verdict: pending             # pending (no act has supplied the evidence that judges the ground yet) | pass (the ground meets what its role requires) | fail (the ground does not meet what its role requires) | inconclusive (the act was carried out, and its evidence neither meets nor fails the requirement) | not-applicable (no requirement applies to the ground)
    evidence: "THE DERIVATION, SIMULATION, MEASUREMENT OR COMPARISON THAT SETTLES THE VERDICT"
    step: itin.TOPIC.NAME.STEP   # the step of an itinerary whose act supplies the evidence; required for a law marked `computed`
    holds_on: "EXPRESSION OVER DECLARED SYMBOLS"   # fail only, optional; the subdomain over which the ground still meets its role

obligations:                     # one entry per proof obligation of the question, named by its identifier
  - obligation: OBLIGATION
    verdict: pending             # pending (no derivation or counterexample settles the obligation yet) | pass (a derivation establishes the implication) | fail (a counterexample shows that the implication does not hold) | inconclusive (the derivation or the search was carried out and neither establishes nor refutes the implication) | not-applicable (no test applies to the obligation, as for a corrective answer)
    evidence: "THE DERIVATION OR THE COUNTEREXAMPLE THAT SETTLES THE IMPLICATION"
    derivation: derivation.TOPIC.NAME   # optional; the derivation record that settles the obligation
    holds_on: "EXPRESSION OVER DECLARED SYMBOLS"   # fail only, optional; the subdomain over which the implication still holds

appraisal:                       # one entry per `preferred` virtue of the question, only once no test of admissibility or of warrant fails or stays pending; the product test already settles each `constitutive` virtue
  - virtue:                      # unification (the account explains many phenomena through few common principles) | generality (the explanatory structure extends across cases or parameter regimes) | robustness (conclusions survive changes of parameters, assumptions or representation beyond the declared idealizations) | intelligibility (consequences can be recognized without the full calculation) | structural-transparency (the representation makes components, relations and dependencies salient) | economy (the purpose is achieved without unnecessary complexity) | tractability (the model can be analyzed or computed with available resources)
    assessment: "THE RESULT OF THE OPERATIONAL QUESTION OF THAT VIRTUE FOR THIS ANSWER"
    preferred_over: "THE CANDIDATES THAT THIS ANSWER OUTRANKS ON THAT VIRTUE"   # fill when other candidates have been assessed

credence:                        # optional; the degree of belief that the assessor places in the answer
  value: "NUMBER IN THE INTERVAL FROM 0 TO 1"
  basis: "THE EVIDENCE AND THE PRIOR THAT FIX THE VALUE"

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open
