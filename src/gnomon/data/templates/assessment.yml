# method: `docs/epistemology/satisfaction-conditions.md`; one file per assessed candidate answer
# replace every UPPERCASE placeholder
# give `not-applicable` to a test whose specification is empty in the question
# fill the appraisal for one answer at a time; name another candidate only when one exists

title: "SHORT NAME OF THE ASSESSMENT"
id: assess.TOPIC.NAME
type: assessment
status: provisional              # provisional | stabilized | retracted
answer: ans.TOPIC.NAME

question: quest.TOPIC.NAME

tests:                           # verdict: pending | pass | fail | not-applicable
  admissibility:
    scope: {verdict: pending, evidence: "DERIVATION, SIMULATION, MEASUREMENT OR COMPARISON THAT SETTLES THE TEST"}
    grain: {verdict: pending, evidence: ""}
    contrast: {verdict: pending, evidence: ""}
    relation: {verdict: pending, evidence: ""}
    individuation: {verdict: pending, evidence: ""}
    admissible-explanans: {verdict: pending, evidence: ""}
    modal-strength: {verdict: pending, evidence: ""}
    product: {verdict: pending, evidence: ""}
  warrant:
    phenomenon-established: {verdict: pending, evidence: ""}
    foil-evidence: {verdict: pending, evidence: ""}
    law-warrant: {verdict: pending, evidence: ""}
    closure: {verdict: pending, evidence: ""}
    fidelity: {verdict: pending, evidence: ""}
    robustness: {verdict: pending, evidence: ""}
    selection: {verdict: pending, evidence: ""}

obligations:                     # one entry per proof obligation of the question, in the same order
  - verdict: pending             # pending | pass | fail | not-applicable
    evidence: "THE DERIVATION OR THE COUNTEREXAMPLE THAT SETTLES THE IMPLICATION"

appraisal:                       # one entry per `preferred` virtue of the question; the product test already settles each `constitutive` virtue
  - virtue:                      # unification | generality | robustness | intelligibility | structural-transparency | economy | tractability
    assessment: "THE RESULT OF THE OPERATIONAL QUESTION OF THAT VIRTUE FOR THIS ANSWER"
    preferred_over: "THE CANDIDATES THAT THIS ANSWER OUTRANKS ON THAT VIRTUE"   # fill when other candidates have been assessed

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open
