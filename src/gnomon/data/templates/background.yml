# specification: `docs/specification/background.md`; one file per body of admitted laws about one target system
# symbols and expressions: `docs/specification/expressions.md`
# name only the quantities declared by the described target system; several background records may describe one target
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# specifications follow the order of the specification note

_schema: gnomon:background@1
title: "NAME OF THE BODY OF ADMITTED LAWS"
id: bg.TOPIC.NAME
type: background
status: provisional              # provisional (the record is written and still under revision) | stabilized (the inquiry expects no further revision of the record) | retracted (the record is withdrawn, with all its specifications)
describes: system.TOPIC

laws:                            # behaviors of the components or of the system admitted a priori
  - name: "NAME OF THE LAW"
    symbol: SYMBOL
    variant: SYMBOL              # variant of the target governed by the law; omit when the law governs every member
    signature: [SYMBOL]          # one entry per place of the claim; empty for a claim about the system as a whole
    role:                        # evolution (how the state changes along the course) | input-output (how one quantity is determined by others at the same point) | measurement (how an instrument registers the state) | state-constraint (which states may hold together, including at the start and at the boundary) | distribution (the law of a random quantity) | admissibility (a restriction on the parameters or the forms that a member may take)
    expression: "EXPRESSION OVER DECLARED SYMBOLS"   # the claim of the law: the only part of the entry that can be false of the system
    reading: "THE LAW IN WORDS"
    warrant:                     # derived (from other admitted laws, in a limit or not, the range of the law stating the limit) | posited (by a choice, admitted as a premise without acceptance) | fitted (by adjusting the parameters of the law to data) | measured (on the evidence of an instrument) | computed (by a numerical computation from the laws on which it rests, at sampled values and with a stated error)
    requires:                    # optional; one entry per unit that the law rests on, by its dotted identifier
      - RECORD.UNIT
    rests_on: "WHAT THE WARRANT REFERS TO BEYOND THE UNITS REQUIRED"   # in words, only what `requires` cannot name, such as a source or a data set
    origin: "POINTER TO THE SOURCE OF THE LAW: A PUBLICATION, A DATA SET OR A DERIVATION"
    range: "EXPRESSION OVER DECLARED SYMBOLS, SATISFIED WHEREVER THE LAW IS ESTABLISHED"   # omit when the law is established across the whole reference class

closure:                         # complete (formal target: the laws define the system) | partial (empirical target)

organization:                    # relations among parts and laws whose arrangement produces the behavior
  - name: "NAME OF THE RELATION"
    symbol: SYMBOL
    variant: SYMBOL              # variant carrying the entry; omit when every member of the class carries it
    reading: "THE ARRANGEMENT IN WORDS"   # only content beyond the relation and the laws
    relates: "prod(SOURCE, REACH), or subset(prod(SOURCE, REACH), ADJACENCY)"   # for a relation among parts: the connected tuples, reach last
    among: [SYMBOL]              # for a relation among laws: the laws, reach last; fill exactly one of `relates` and `among`
    realized_by: [SYMBOL]        # laws stating a relation among parts; the parts are read from their expressions

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; the record status applies to every specification left out
  FIELD.PATH: open
