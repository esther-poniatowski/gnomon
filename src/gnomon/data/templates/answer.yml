# specification: `docs/specification/answer.md`; one file per candidate answer to one atomic question
# the model on which the route runs: `model.yml`; its relation to the phenomenon: `binding.yml`
# the core holds what every aim requires; `aim_block` holds the block of the aim of the question only
# name a symbol of another record by source identifier and symbol: `mod.TOPIC.NAME.SYMBOL`
# replace every UPPERCASE placeholder; leave a field empty while it is not filled
# record test verdicts in an assessment file

_schema: gnomon:answer@1
title: "SHORT NAME OF THE CANDIDATE ANSWER"
id: ans.TOPIC.NAME
type: answer
answers: quest.TOPIC.NAME

claim:                           # over the symbols of the model on which the route runs, or over those of the target and the phenomenon when the route runs on the target
  reading: "THE CLAIM IN WORDS"
  expression: "EXPRESSION OVER DECLARED SYMBOLS"   # empty while the claim is not formalized, with a caveat naming the gap
  caveat: "THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE OMISSION"
  realizations:                  # fill when the question bounds the explanans to the link between two substrates; one entry per role
    - id: MAPPING
      realizes: SYMBOL           # a role, declared by the model independently of any substrate
      by: "EXPRESSION OVER THE SYMBOLS SPECIFIC TO THE SUBSTRATE"
      reading: "THE STRUCTURE THAT THE MAPPING PRESERVES"   # only content beyond the expression of `by`
  presuppositions:               # optional; one entry per commitment that the claim takes for granted beyond the presuppositions of its question and the existence that the conditions of its quantities presuppose
    - id: PRESUPPOSITION-NAME
      reading: "WHAT THE CLAIM TAKES FOR GRANTED"
      expression: "EXPRESSION OVER DECLARED SYMBOLS"   # optional; empty while the presupposition is not formalized
      held_by: RECORD.UNIT       # empty while undischarged; a law of a background or a model, or a consequence of a derivation
  interventions:                 # for a counterfactual claim, which naming them marks; one entry per intervention admitted
    - REFERENCE

grounds:                         # what the claim depends on; one entry per ground
  - id: GROUND
    role:                        # assumption (a premise asserted true of the target) | idealization (a premise known false of the target, which licenses the derivation) | condition (a restriction under which the claim holds) | datum (evidence drawn from a version of recorded or derived data) | warrant (a law or an argued pair licensing the step to the claim) | criterion (a standard fixed by the question, such as a tolerance)
    content: "THE GROUND IN WORDS"
    record: RECORD.UNIT          # the record or the unit that holds the ground: a law of the model or of the background, or an argued pair of a binding, for a warrant; a restriction of the domain; a criterion of the question; a phenomenon for a datum
    version: VERSION             # datum only: the version of the data
    distortion: "THE DISTORTION OF THE TARGET THAT THE IDEALIZATION INTRODUCES"   # idealization only, as are the four keys below
    motive:                      # tractability (the undistorted system admits no analysis) | isolation (it removes a factor judged irrelevant) | limit (it exposes the behavior of a limit system)
    gain: "THE DERIVATION THAT THE IDEALIZATION MAKES POSSIBLE, OR THE FACTOR THAT IT EXPOSES"
    range: "EXPRESSION OVER DECLARED SYMBOLS, SATISFIED WHEREVER THE IDEALIZATION HOLDS"
    removable:                   # controlled (a correction to the idealized result is known) | ineliminable (the model cannot be stated without it) | unknown (neither a correction nor the ineliminability of the distortion is known)

abstractions:                    # factors of the target that the claim leaves out and claims nothing about; a reason that a factor makes no difference is a ground with the role `assumption`
  - id: ABSTRACTION
    factor: "THE FACTOR LEFT OUT"

dependence:                      # how the claim depends on its grounds; one entry per result
  - kind:                        # minimal-set (grounds that suffice for the claim) | sensitivity (an analysis over one ground) | robustness (an analysis across models that share the claimed structure)
    grounds: [GROUND]            # grounds of this answer, by identifier
    models: [mod.TOPIC.NAME]     # robustness only: the models compared
    result: "THE RESULT OF THE ANALYSIS"   # omit for a minimal sufficient set

route:
  kind:                          # derivation (a deduction in which some move has an inexact warrant or some posit lacks an exact confirmation) | proof (a deduction in which every move has an exact warrant and every posit an exact confirmation) | simulation (a numerical computation of the trajectories of a model) | estimation (values inferred from data by the estimator that the phenomenon states) | measurement (values assigned to a property, preserving its empirical relations)
  runs_on: [RECORD]              # the target system, one model, or every model of a family, by identifier
  family_fidelity:               # per-member (one comparison per member, each of which must pass) | ensemble (one comparison of the ensemble of the family); fill for a family of models only
  derivations: [derivation.TOPIC.NAME]   # for a derivation or a proof; the derivation records on which the claim rests
  pointer: "POINTER TO THE CODE, THE DATA OR A PUBLISHED DERIVATION"   # a recorded derivation is named in `derivations`, and its internal steps stay in it

domain: "EXPRESSION OVER DECLARED SYMBOLS"   # for a deductive route, implied by the grounds with the roles `assumption` and `condition` and by the range of each idealization, as the scope test judges; for a route on a model, within the domain of comparison of the binding

variant: SYMBOL                  # symbol of the target variant this answer accounts for; omit when the answer covers every member of the class

status: entertained              # entertained (put forward as a candidate and not yet adopted for evaluation) | hypothesized (held provisionally while it is tested) | accepted (admitted into the accepted knowledge by an act of the researcher) | retracted (withdrawn by a decision of the researcher); the attitude taken toward the answer
support: unsupported             # unsupported (nothing supports the claim yet, neither a proof nor data nor an informal argument) | informal (support short of proof or empirical test, such as toy simulations) | formally-proven (a proof derives the claim from its stated premises) | empirically-supported (the claim passed a test against data on the target); independent of the status; each law of the model keeps its own `warrant`

uncertainty:                     # fill when the claim assigns a value; one entry per value
  - of: SYMBOL
    form:                        # interval (a range that contains the value with a stated probability, such as 40 ± 3 Hz at 95 %) | distribution (a probability distribution over the value) | bound (limits that the value or its error does not exceed, stated without a probability)
    expression: "EXPRESSION OVER DECLARED SYMBOLS"

modal_strength:                  # actual (the claim holds of the target system) | possible (the claim is consistent with the admitted laws and the domain) | necessary (no alternative consistent with the admitted laws produces a foil); the strength that the answer claims, compared with the strength the question requests

erotetic_relation:
  value:                         # complete (a direct answer, conclusive under the answer conditions of the aim) | partial (narrows the direct answers without being conclusive) | corrective (shows that a presupposition of the question is false) | reformulating (answers a revised question, which it names)
  denies: "THE PRESUPPOSITION OF THE QUESTION THAT THE ANSWER SHOWS FALSE"   # corrective only
  revised_question: quest.TOPIC.NAME   # reformulating only: the question that the answer answers and is assessed against

binding:                         # fill when the route runs on a model other than the target and the claim bears on the target; one entry per model
  - record: bind.TOPIC.NAME
    version: VERSION

use:                             # fill in place of a binding when the claim bears only on a model or on a formal class
  value:                         # tool (the model performs a stated task) | proof-of-principle (the model shows that a behavior can arise) | conceptual-exploration (the model serves to explore a class of models) | understanding (the model affords a grasp of explanatory, structural or modal relations); a new use enters the vocabulary registry first
  property: "THE PROPERTY THAT THE MODEL MUST HAVE FOR THAT USE"

aim_block:                       # fill for a complete or a partial answer only: keep the block of the aim of the question, and delete the others
  description:
    values:                      # one entry per observable or feature that the request covers, per source of variation
      - of: phen.TOPIC.NAME.SYMBOL
        across: SYMBOL           # the source of variation of the phenomenon whose quantification the value takes; omit for a single instance
        data_version: VERSION    # for a value that the estimator of the phenomenon computes: the version of the data on which it runs
        value: "EXPRESSION OVER DECLARED SYMBOLS"   # only for a characterization that no estimator computes
  exploration:
    space:                       # the observables and the varied factors
      origin:                    # input (fixed by the question) | output (produced by the answer)
      observables: [SYMBOL]      # of the phenomenon
      varied:
        - factor: SYMBOL
          range: "SET EXPRESSION OVER DECLARED SYMBOLS"
    criterion:                   # the equivalence criterion that partitions the space
      origin:                    # input (fixed by the question) | output (produced by the answer)
      expression: "EXPRESSION OVER DECLARED SYMBOLS"
      reading: "THE CRITERION IN WORDS"
    classes:                     # one entry per class found
      - id: CLASS
        pattern: "EXPRESSION OVER DECLARED SYMBOLS"
        reading: "THE PATTERN IN WORDS"
        detection:               # pass (the pattern meets the criterion and counts as a phenomenon) | fail (the pattern does not meet the criterion) | pending (the criterion has not yet been applied to the pattern); the result of the detection criterion of the phenomenon
  prediction:
    outputs:                     # one entry per predicted output
      - target: phen.TOPIC.NAME.SYMBOL   # one of the outputs to match that the required accuracy of the question names
        condition: "EXPRESSION OVER DECLARED SYMBOLS"   # the condition of the target under which the output is predicted
        value: "EXPRESSION OVER DECLARED SYMBOLS"   # a value or a distribution
  explanation:
    contrastive_explanandum: "THE FACT AND THE FOILS THAT THE EXPLANATION SEPARATES"   # read from the contrast of the question; the fact alone when its locus is `none`
    explanatory_claim:           # one entry per dependence of the core that the explanation reads
      - ground: GROUND           # the ground on which the claim depends
        explanatory: true        # false for a dependence that the explanation declares not explanatory
        determinant: "THE PROPERTY THAT MAKES THE LAW, THE STRUCTURE OR THE DERIVATION RELEVANT"
    relation:                    # causal-intervention (the explanandum changes when a factor is set by intervention) | causal-mechanistic (earlier entities outside the system produce the phenomenon by interactions) | constitutive (organized parts and activities of the system compose the phenomenon) | functional (a part contributes to a capacity or was selected for its effects) | nomological (the explanandum follows from a law) | statistical (the explanandum falls under a probabilistic regularity) | mathematical (a mathematical fact proves the explanandum or excludes its alternatives)
    factors:                     # E: one entry per explanatory factor
      - id: FACTOR
        name: "NAME OF THE FACTOR"
        factor:                  # condition (on a quantity) | structural-property (of a structure, such as sparsity or low rank) | law-property (of a law, such as invariance, additivity or factorization) | organization (of the arrangement, such as a feedback loop or a modular composition)
        holds: "EXPRESSION OVER DECLARED SYMBOLS THAT STATES THE CLAIM OF THE FACTOR"   # empty while the claim is unformalized, with a caveat naming the gap
        under: "SET EXPRESSION OVER DECLARED SYMBOLS"   # the transformation group of an invariance stated by `holds`; omit for any other claim
        bears_on: [SYMBOL]       # elements the factor applies to as a property or condition; one entry per element, so a family spans several entries
        through: [SYMBOL]        # laws and relations carrying the effect from `bears_on` to the explanandum
        produces: SYMBOL         # explanandum variable or manifestation the factor accounts for
        separates: [SYMBOL]      # foils ruled out, by their symbols in the foil set; empty where the contrast has no locus
        appeals_to: [SYMBOL]     # external systems drawn on, by declared symbol; empty when none
        procedure: "HOW THE FACTOR PRODUCES ITS EFFECT"   # only content beyond the chain `bears_on`, `through`, `produces`
        caveat: "THE CONTENT THAT THE RECORD LEAVES UNSTATED HERE, AND THE REASON FOR THE OMISSION"
        target_status:           # denoting (the factor denotes a quantity or a part of the target) | coarse-graining (the factor describes a target feature at a stated level) | limit-construct (the factor holds only in a limit system) | structural-constraint (the factor is a symmetry or bound that the target satisfies); empty under a declared use
        pair: bind.TOPIC.NAME.PAIR   # the feature pair of the binding that carries the status; omit when the route runs on the target
  modal_knowledge:
    modality:                    # possible (the property holds in some admitted alternative, shown by a witness) | impossible (the property holds in no admitted alternative, shown by proof) | necessary (the property holds in every admitted alternative, shown by proof)
    property: "EXPRESSION OVER DECLARED SYMBOLS"   # the property that the modal claim bears on
    space: "THE SPACE OF ALTERNATIVES THAT THE ADMITTED LAWS AND THE DOMAIN FIX"
    witness: RECORD              # for a possibility: the instance that witnesses it, such as a model
    proof: "POINTER TO THE PROOF OR TO THE EXHAUSTIVE EXCLUSION"   # for an impossibility or a necessity
  model_properties:
    form:                        # derived-law (a law that follows from the laws of the model) | regime (a qualitative behavior of the model over a range of parameters) | limit (the behavior of the model in a limit system) | structural-property (a property of the model structure, such as low rank) | counterexample (an instance that falsifies a stated property of the model)
    discharges: [OBLIGATION]     # the proof obligations of the question that the consequence discharges, by name

relations:                       # fill when the answer bears on another answer; one entry per relation, and one entry per set for a relation of a set
  - relation:                    # supports (its claim is a ground of the other answer) | presupposes (it is admissible only if the other answer is true) | tests (its claim is a consequence of the other answer, compared with the target) | defeats (its claim, once accepted, denies a ground of the other answer or that one of its laws applies) | exemplifies (its claim is an instance of the concept or of the more general answer) | revises (it replaces the other answer over time, which stays unchanged) | incompatible-with (the claims of the set cannot all be true over the domain that they share) | contrasts-with (the two answers differ in a stated respect and may both hold)
    target: ans.TOPIC.NAME       # the other answer, or one of its grounds by its dotted identifier; omit for a relation of a set
    members: [ans.TOPIC.NAME]    # for a relation of a set, such as an incompatibility, the other members; omit otherwise
    warrant:                     # optional, for `supports` and `tests` only
      kind: MODE                 # a mode of inference, such as `deductive` or `abductive`
      reading: "WHY THE CLAIM SUPPORTS OR TESTS THE OTHER"
    respect: [SYMBOL]            # for `contrasts-with` only, the symbols named by both claims in which they differ

maturity:                        # optional; one maturity per specification: open | provisional | stabilized; a specification left out is provisional
  FIELD.PATH: open
