# What a filled inquiry must carry. Source of truth for the checkers; the specification notes document
# these requirements and are checked against this file.
#
# `always` lists the specifications every record of a kind carries, whatever the inquiry. A path
# written `key[].field` bears on every entry of the list `key`, and a list with no entry imposes
# nothing through it.
# `by_block` lists the specifications that an aim block of an answer carries whenever the answer
# holds that block, keyed by the path of the block; its paths are relative to the block.
# `by_commitment` lists the specifications that a target system or a phenomenon carries at each
# level of commitment. The levels are cumulative: a record at `specified` also carries the
# specifications of `identified`.
# `by_value` lists the specifications that a value of a closed field imposes, keyed by the record
# kind, the field and the value: a design of the kind `experiment` carries a protocol.
# `by_presence` lists the specifications that the presence or the absence of a field imposes,
# keyed by the record kind and the field: a root model, which names no parent, declares its
# constituents, its variables and its laws, whereas a derived model states its operations; a
# derivation that serves no record declares its root sought.
# `by_aim` adds the requirements that an epistemic aim imposes. Under `to_produce`, it lists the
# general requirements that the inquiry itself produces: an inquiry that produces a phenomenon
# cannot state that phenomenon in advance.
# An empty field and an unfilled block follow the empty-value convention of the record templates
# (`templates/_index.md`). A required path left empty is a gap. A path listed under `to_produce` for
# the aim of the inquiry may stay empty.
# A requirement names a field path. An aim fixes what an answer must deliver, never which value
# a field takes, so no entry constrains a value.
# `validation_scopes` orders the named completion targets against which a partial inquiry can be
# checked. `by_scope` states the requirements added at each target. A scope inherits every earlier
# entry. `checkpoint_records` requires a record only at that exact checkpoint. `required_records`
# activates the ordinary requirements of a record kind and requires such a record at that and
# every later checkpoint. `activate_when_present` activates ordinary requirements without requiring
# a record. `required`
# adds field paths not already stated by the ordinary tables. `by_aim`, `by_candidate` and
# `when_record_present` condition those additions. `on_demand` applies only where an open condition
# requires the stronger commitment. `settled` names a block whose applicable verdicts may no longer
# be pending.

id: registry.requirements
type: requirement-registry

validation_scopes:
  - problem-posed
  - question-typed
  - subject-identified
  - subject-specified
  - candidate-proposed
  - candidate-assessed

by_scope:
  problem-posed:
    checkpoint_records: [problem]
  question-typed:
    required_records: [question]
    activate_when_present: [itinerary]
    minimum_subject_slots: typed
    required:
      question:
        - statement
        - status
        - subject.target_system
        - subject.phenomenon
        - subject.contrast.locus
        - task.epistemic_aim
        - task.modal_strength
        - task.required_accuracy.standard
    when_record_present:
      problem:
        question: [addresses]
    by_aim:
      explanation:
        question: [task.requested_relation]
      modal-knowledge:
        question: [task.proof_obligations]
      explication:
        question: [task.explicandum]
  subject-identified:
    required_records: [target-system]
    required_unless_aim:
      phenomenon: [exploration]
    minimum_subject_slots: identified
    minimum_commitment:
      target-system: identified
      phenomenon: identified
  subject-specified:
    activate_when_present: [background, operators]
    on_demand:
      target-system: [variables]
      phenomenon: [category, course, occurrence, manifestations, evidential_status]
    on_demand_commitment:
      target-system: specified
      phenomenon: specified
    by_aim:
      exploration:
        phenomenon: [detection_criterion]
      prediction:
        phenomenon: [manifestations]
        question: [task.required_accuracy.outputs_to_match]
  candidate-proposed:
    activate_when_present: [answer, binding, concept, derivation, design, key, model]
    candidate: proposed
    by_candidate:
      answer:
        question: [request]
  candidate-assessed:
    activate_when_present: [assessment]
    candidate: assessed
    by_candidate:
      answer:
        assessment: [against_version, tests.admissibility, tests.warrant]
      construct:
        assessment: [tests.constraints]
    settled:
      assessment: [tests]

always:
  operators: [operators]
  target-system: [commitment]
  phenomenon: [commitment]
  background: [describes, laws, closure]
  problem: [statement, status, kind, demand, result_type, request]
  question: [version]
  concept: [gloss, kind, source]
  design: [kind, task, steps, output]
  derivation:
    - runs_on
    - objects
    - moves
    - moves[].kind
    - moves[].inputs
    - moves[].outputs
    - moves[].warrant.source
    - moves[].warrant.error
    - segments[].inputs
    - segments[].outputs
  itinerary: [addresses, steps]
  answer: [claim, grounds, dependence, route, status, support, modal_strength, erotetic_relation]
  binding: [model, target, asserter, feature_pairs, domain, grain, version]
  key: [kind, domain_and_codomain, expression, version]
  assessment: [assesses, against]

by_block:
  aim_block.explanation:
    - contrastive_explanandum
    - explanatory_claim
    - relation
    - factors
    - factors[].target_status

by_commitment:
  identified:
    target-system: [target_type, identification, reference_class]
    phenomenon: [statement, identification]
  specified:
    target-system: [variables]
    phenomenon: [category, course, occurrence, manifestations, evidential_status]

by_presence:
  model:
    derives_from:
      present: [operations]
      absent: [constituents, variables, laws]
  derivation:
    serves:
      absent: [sought]

by_value:
  design:
    kind:
      experiment: [serves, protocol, stopping]
      simulation-run: [serves, protocol, stopping]
      method: [stopping]
      scheme: [applies_when]
  phenomenon:
    evidential_status:
      absent: [search.scope, search.procedure]
      disproved: [search.counterexample]

# The occurrence classes admitted by each category of phenomenon. A particular occurrence takes
# the class of its one token. A structural property holds at each point of the course, so it takes
# `state`. A regularity and a capacity take no occurrence class.
occurrence_by_category:
  particular-occurrence: [state, process, event]
  regularity: [not-applicable]
  capacity: [not-applicable]
  structural-property: [state]

# The target types that admit each evidential status obtained by derivation. A behavior derived for a
# model or for a target without actual members is `derived`, since the derivation establishes it; a
# behavior derived for a target with actual members is `predicted`, since it awaits detection. A
# class of possible systems may hold actual members, so it admits both. A status left out admits
# every target type.
target_types_by_evidential_status:
  derived: [possible-systems, hypothetical, no-external-target]
  predicted: [particular, actual-systems, possible-systems]

by_aim:
  description:
    required: []
    to_produce: []
  exploration:
    required:
      - path: phenomenon.detection_criterion
    to_produce:
      - phenomenon.statement
      - phenomenon.category
      - phenomenon.occurrence
      - phenomenon.evidential_status
  prediction:
    required:
      - path: phenomenon.manifestations
      - path: question.task.required_accuracy.outputs_to_match
    to_produce: []
  explanation:
    required:
      - path: question.task.requested_relation
    to_produce: []
  modal-knowledge:
    required:
      - path: question.task.modal_strength
      - path: question.task.proof_obligations
    to_produce: []
  model-properties:
    required: []
    to_produce: []
  explication:
    required:
      - path: question.task.explicandum
    to_produce: []
