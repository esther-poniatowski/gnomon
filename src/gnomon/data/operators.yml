# The operator vocabulary the framework supplies. A problem declares in its own records the
# mathematics it brings beyond this set. Source of truth for the checkers; the specification note
# docs/specification/expressions.md documents it and is checked against it.
#
# `notation` renders the operator in LaTeX. `#0` stands for the indices a binder consumes and
# `#1`, `#2` for its arguments, so a renderer composes the form without parsing the operator.
#
# The arity of an operator is the number of its arguments, apart from the indices that a binder
# consumes. An operator with a `signature` takes one argument per entry of it; any other operator
# states its `arity`, so that no arity is read from a template. `variadic: true` lets the last
# argument repeat, and the arity is then the least number of arguments.
#
# `dimension` states how the operator combines the dimensional formulas of its arguments, as the
# decision on the dimensional formula requires (docs/adr/dimensional-formula.md): `preserve` gives
# the formula of the first argument, `product` adds the exponents of the arguments, `derivative`
# divides the first argument by the second, `second-derivative` divides the first argument by the
# square of the second, `pure` yields a pure number whatever the arguments,
# `pure-argument` requires pure arguments and yields a pure number, and `unchecked` leaves the
# formula of the result undecided.

id: registry.operators
type: operator-registry
operators:
- symbol: mean
  kind: binder
  dimension: preserve
  name: the mean over the indices it binds
  notation: '\langle #1 \rangle_{#0}'
  arity: 1
- symbol: sum
  kind: binder
  dimension: preserve
  name: the sum over the indices it binds
  notation: '\sum_{#0} #1'
  arity: 1
- symbol: min
  kind: binder
  dimension: preserve
  name: the least value over the indices it binds
  notation: '\min_{#0} #1'
  arity: 1
- symbol: max
  kind: binder
  dimension: preserve
  name: the greatest value over the indices it binds
  notation: '\max_{#0} #1'
  arity: 1
- symbol: limit
  kind: binder
  dimension: preserve
  name: the limit as the indices it binds approach their stated value
  notation: '\lim_{#0} #1'
  arity: 1
- symbol: norm
  kind: binder
  dimension: preserve
  name: the norm over the indices it binds
  notation: '\lVert #1 \rVert_{#0}'
  arity: 1
- symbol: dist
  kind: binder
  dimension: unchecked
  name: the distribution formed over the indices it binds
  notation: '\mathbb{P}_{#0}( #1 )'
  arity: 1
- symbol: implies
  kind: relation
  dimension: pure
  name: the implication between two statements
  notation: '#1 \Rightarrow #2'
  arity: 2
- symbol: and
  kind: relation
  dimension: pure
  name: the conjunction of statements
  notation: '#1 \land #2'
  arity: 2
  variadic: true
- symbol: or
  kind: relation
  dimension: pure
  name: the disjunction of statements
  notation: '#1 \lor #2'
  arity: 2
  variadic: true
- symbol: not
  kind: relation
  dimension: pure
  name: the negation of a statement
  notation: '\lnot #1'
  arity: 1
- symbol: depends_on
  kind: relation
  dimension: pure
  name: the dependence of one quantity on another
  notation: '\operatorname{dep}( #1, #2 )'
  arity: 2
- symbol: increasing
  kind: relation
  dimension: pure
  name: the monotone increase of one quantity in another
  notation: '\operatorname{incr}( #1, #2 )'
  arity: 2
- symbol: decreasing
  kind: relation
  dimension: pure
  name: the monotone decrease of one quantity in another
  notation: '\operatorname{decr}( #1, #2 )'
  arity: 2
- symbol: drawn_from
  kind: relation
  dimension: pure
  name: the quantity is distributed as the law given
  notation: '#1 \sim #2'
  arity: 2
- symbol: abs
  kind: map
  dimension: preserve
  name: the magnitude of a number or a vector
  notation: '\lvert #1 \rvert'
  arity: 1
- symbol: ft
  kind: binder
  dimension: unchecked
  name: the Fourier transform over the indices it binds, introducing their conjugates
  notation: '\widehat{#1}'
  for_any: [A, S]
  signature: ["maps(A, S)"]
  values: "maps(A, S)"
- symbol: dot
  kind: map
  dimension: product
  name: the inner product of two vectors
  notation: '#1 \cdot #2'
  for_any: [S, n]
  signature: ["vectors(S, n)", "vectors(S, n)"]
  values: S
- symbol: adjoint
  kind: map
  dimension: preserve
  name: the adjoint of a map of a set to itself
  notation: '#1^{\dagger}'
  for_any: [S]
  signature: ["maps(S, S)"]
  values: "maps(S, S)"
- symbol: re
  kind: map
  dimension: preserve
  name: the real part of a complex number
  notation: '\operatorname{Re} #1'
  signature: [complex]
  values: reals
- symbol: spectrum
  kind: map
  dimension: preserve
  name: the eigenvalues of a square array
  notation: '\operatorname{spec}( #1 )'
  for_any: [A]
  signature: ["matrices(reals, A, A)"]
  values: complex
- symbol: jacobian
  kind: map
  dimension: unchecked
  name: the matrix of first derivatives of a map, at a point
  notation: '\operatorname{J}_{#3}( #1 )'
  for_any: [A]
  signature: ["maps(A, reals)", A, A]
  values: "matrices(reals, A, A)"
- symbol: grad
  kind: map
  dimension: derivative
  name: the gradient of a field along the coordinates given
  notation: '\nabla_{#2} #1'
  for_any: [A, S, n]
  signature: ["maps(A, S)", "vectors(reals, n)"]
  values: "maps(A, vectors(S, n))"
- symbol: div
  kind: map
  dimension: derivative
  name: the divergence of a vector field along the coordinates given
  notation: '\nabla_{#2} \cdot #1'
  for_any: [A, S, n]
  signature: ["maps(A, vectors(S, n))", "vectors(reals, n)"]
  values: "maps(A, S)"
- symbol: lap
  kind: map
  dimension: second-derivative
  name: the Laplacian of a field along the coordinates given
  notation: '\Delta_{#2} #1'
  for_any: [A, S, n]
  signature: ["maps(A, S)", "vectors(reals, n)"]
  values: "maps(A, S)"
- symbol: infinity
  kind: constant
  dimension: unchecked
  name: the unbounded limit of a quantity
  notation: '\infty'
  arity: 0
- symbol: diff
  kind: map
  dimension: derivative
  name: the derivative of a quantity along the index given
  notation: '\partial_{#2} #1'
  for_any: [A, S]
  signature: ["maps(A, S)", A]
  values: "maps(A, S)"
- symbol: reals
  kind: set
  dimension: unchecked
  name: the real numbers
  notation: \mathbb{R}
  arity: 0
- symbol: ints
  kind: set
  dimension: unchecked
  name: the integers
  notation: \mathbb{Z}
  arity: 0
- symbol: bools
  kind: set
  dimension: unchecked
  name: the truth values
  notation: \mathbb{B}
  arity: 0
- symbol: pos
  kind: set
  dimension: unchecked
  name: the strictly positive members of a set
  notation: '#1_{>0}'
  arity: 1
- symbol: nonneg
  kind: set
  dimension: unchecked
  name: the nonnegative members of a set
  notation: '#1_{\geq 0}'
  arity: 1
- symbol: vectors
  kind: set
  dimension: unchecked
  name: the tuples of a given length over a set
  notation: '#1^{#2}'
  arity: 2
- symbol: matrices
  kind: set
  dimension: unchecked
  name: the arrays over a set, indexed by two sets
  notation: '#1^{#2 \times #3}'
  arity: 3
- symbol: prod
  kind: set
  dimension: unchecked
  name: the product of two sets
  notation: '#1 \times #2'
  arity: 2
- symbol: enum
  kind: set
  dimension: unchecked
  name: the set of the listed members
  notation: '\{ #1 \}'
  arity: 1
  variadic: true
- symbol: range
  kind: set
  dimension: unchecked
  name: the identifiers of a finite collection, given its size
  notation: '\{ 1, \dots, #1 \}'
  arity: 1
- symbol: interval
  kind: set
  dimension: unchecked
  name: an interval of an ordered set, or the interval between two bounds
  notation: '[ #1, #2 ]'
  arity: 2
- symbol: maps
  kind: set
  dimension: unchecked
  name: the maps from one set to another
  notation: '#1 \to #2'
  arity: 2
- symbol: measures
  kind: set
  dimension: unchecked
  name: the probability measures on a set
  notation: '\mathcal{P}( #1 )'
  arity: 1
- symbol: intersect
  kind: set
  dimension: unchecked
  name: the members two sets share
  notation: '#1 \cap #2'
  arity: 2
- symbol: union
  kind: set
  dimension: unchecked
  name: the members of either set
  notation: '#1 \cup #2'
  arity: 2
- symbol: empty
  kind: set
  dimension: unchecked
  name: the set with no member
  notation: '\emptyset'
  arity: 0
- symbol: complex
  kind: set
  dimension: unchecked
  name: the complex numbers
  notation: '\mathbb{C}'
  arity: 0
- symbol: card
  kind: set
  dimension: pure
  name: the size of a set
  notation: '\lvert #1 \rvert'
  arity: 1
- symbol: subset
  kind: set
  dimension: pure
  name: the members of a set satisfying a predicate
  notation: '\{ x \in #1 : #2(x) \}'
  arity: 2
