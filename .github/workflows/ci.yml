name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install black pylint ruff mypy pytest pytest-cov types-PyYAML types-jsonschema
      - name: Materialize the schema dependencies (kleisis)
        run: |
          pip install "kleisis @ git+https://github.com/esther-poniatowski/kleisis.git@eb5f9b9f36e6b1c2e4dddb41aa543a9114482ebc"
          python -m kleisis materialize --root .
          python -m kleisis check --root .
      - name: Check formatting (black)
        run: black --check --config config/tools/black.toml src/ tests/
      - name: Run linter (pylint)
        run: pylint --rcfile=config/tools/pylintrc.ini src/
      - name: Run linter (ruff)
        run: ruff check --config config/tools/ruff.toml src/ tests/
      - name: Run type checker (mypy)
        run: mypy --config-file config/tools/mypy.ini src/ tests/
      - name: Run tests
        run: pytest --cov --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
